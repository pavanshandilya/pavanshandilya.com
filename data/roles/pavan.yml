        between, you're thinking about how these campaigns work together to move
        real people through our funnel. We're hiring a Paid Media Lead to plan,
        deploy, and optimize campaigns across our paid channels. This role isn't
        just about setting campaigns live and watching the numbers. It's about
        thinking carefully about the marketing funnel, inventing new ways to
        bring quality leads and accounts into it, and using paid media to move
        them all the way through to sales-ready. You'll work closely with our
        Senior Director of Creative Performance Marketing, turning creative
        briefs and campaign strategies into live campaigns that actually
        perform. You'll own the technical craft of paid media (structure,
        targeting, bidding, testing, iteration) and the strategic craft of
        designing campaigns that do their job at each funnel stage. This is an
        individual contributor role with no direct reports. What you'll be doing
        is deep, hands on platform work combined with real strategic thinking
        about how paid fits into the broader journey. JOB RESPONSIBILITES: Plan
        campaign architecture across platforms with clear funnel intent
        (awareness, consideration, decision) and matching audience, creative,
        and CTA logic for each stage Get creative about lead acquisition itself:
        figure out how to reach new audiences, test new platforms and formats,
        and keep growing both the quantity and quality of leads coming into the
        funnel Design retargeting and lifecycle audiences that work with email
        nurture, content offers, and sales outreach to move leads through the
        funnel Partner with the rest of the marketing team on lead qualification
        and hand-off criteria, so what reaches sales is actually ready to
        convert Contribute creative direction to ad concepts and copy, working
        with our creative resources on work that resonates Build and launch
