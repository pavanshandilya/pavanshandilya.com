      description: "Most internships give you a list of tasks. This one gives you the
        opportunity to help build a company’s video presence from almost zero.
        We’re looking for someone who is obsessed with content, storytelling and
        the internet. Someone who watches a great Reel and immediately wonders
        why it worked. Someone who has ideas they want to shoot, edit and
        publish immediately. At Cloud Studios, you’ll work directly with the
        founder and founding team to turn the real process of building products,
        brands and a company into content people actually want to watch. You
        won’t just edit content. You’ll help shape what Cloud Studios looks and
        feels like online. Tasks Develop repeatable short-form video formats and
        recurring content series Shoot founder-led content, conversations,
        behind-the-scenes footage and company moments Edit Instagram Reels,
        YouTube Shorts and LinkedIn videos Turn longer recordings into strong
        short-form clips Help develop long-form YouTube content and a broader
        content waterfall Find the hook, story or moment that makes someone stop
        scrolling Work with pacing, subtitles, sound design, music and basic
        motion graphics Repurpose content intelligently across different
        platforms Help direct people on camera and make them feel comfortable
        Develop creative concepts, scripts, hooks, thumbnails and covers
        together with the team Organise footage and help build our internal
        content library Publish content, analyse performance and improve future
        formats based on what works Experiment with AI and new creative tools to
        make production faster and better The exact formats are not
        predetermined. Part of your role is helping us discover them and keep
        experimenting. Requirements You don’t need years of agency experience.
        You do need taste, initiative and a strong understanding of content. You
        should: Be able to shoot strong, usable video with a phone or camera
        Edit confidently in Premiere Pro, Final Cut Pro, DaVinci Resolve, CapCut
        or a comparable tool Understand pacing, hooks, framing, subtitles and
        sound Have a strong instinct for storytelling Understand what performs
        on social media without blindly copying trends Be comfortable working
        closely with people on camera Be able to give creative direction instead
        of simply recording what happens Work quickly, reliably and
        independently Bring ideas without waiting to be told exactly what to
        create Be curious about new formats, creators, platforms and tools Have
        strong English skills You must also: Be enrolled at a university Be able
        to complete the role as a recognised mandatory internship /
        Pflichtpraktikum Be able to spend regular time with us in Berlin
        Personal projects, TikToks, Reels, YouTube videos and university
        projects all matter more than your CV. Benefits This isn’t an internship
        where you spend six months resizing assets. You’ll get: Significant
        creative ownership from the beginning Direct access to the founder and
        founding team The opportunity to shape Cloud Studios’ video identity
        Real published work for your portfolio Freedom to pitch ideas and
        experiment with new formats Fast decision-making without endless
        approval processes Exposure to product, growth, brand and
        company-building Close collaboration with content, design and product
        Investment in additional production equipment where it makes sense The
        opportunity to grow into a paid working-student or proper role after the
        internship The chance to take on significantly more responsibility as
        Cloud Studios grows Location: Berlin / Hybrid Duration: 3–6 months
        Working hours: 30–40 hours/week Start: Flexible, ideally ASAP
        Internship: Mandatory internship / Pflichtpraktikum Compensation: This
        is currently an unpaid mandatory internship, designed to give you real
        ownership, hands-on experience and the opportunity to grow into a paid
        working-student or proper role if there’s a strong mutual fit. Don’t
        send us a generic cover letter. Instead, show us what you’ve made: Your
        portfolio, showreel or 3–5 videos that best represent your work A quick
        explanation of what you personally shot, edited or developed One creator
        or company whose video content you think is exceptional - and why Your
        preferred start date Your weekly availability Confirmation that your
        university can recognise the internship as a Pflichtpraktikum If your
        portfolio is rough but your work shows taste, send it anyway. We care
        far more about creative judgement, energy and potential than a perfectly
        polished CV. Find Jobs in Germany on Arbeitnow"
