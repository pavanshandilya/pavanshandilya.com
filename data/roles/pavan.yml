        bereits privat oder im Studium, um Aufgaben effizienter zu lösen.
        Begriffe wie Keywords, H1-Überschriften oder Backlinks sind dir nicht
        fremd – den Rest bringen wir dir bei. Du behältst den Überblick über
        deine Aufgaben und hilfst uns dabei, unsere Content-Roadmap Schritt für
        Schritt abzuarbeiten. Du findest dich schnell in neuen Tools (z.B.
        WordPress) zurecht. Wenn du schon mal von HTML oder Automatisierung
        (Zapier/Make) gehört hast, ist das ein Plus. Du schreibst sicher und
