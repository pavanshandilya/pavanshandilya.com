        Experience in growth, performance marketing, SEO, SEA or GTM - ideally
        in both B2B &#x26; B2C businesses (plus). Experienced in fast‑paced
        environments (hypergrowth start‑ups, VC, growth equity, PE, investment
        banking, or strategy consulting) and capable of delivering high‑quality
        outcomes. An excellent multitasker with strong organisational skills and
        adaptability to shifting priorities. A proactive communicator and team
        player with a service mindset and high integrity. Passionate about
        entrepreneurship and the start-up ecosystem with a genuine hunger to
        learn, grow and build a massive ops-heavy company. Completed a
        bachelor's or master’s programme (business-related field is a plus) from
