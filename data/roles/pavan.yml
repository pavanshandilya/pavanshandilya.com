      url: https://www.arbeitnow.com/jobs/companies/swordhealth/director-of-growth-marketing-493028
      updated_at: 1791719705
      description: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;At Sword,
        we’re building AI to heal billions and unlock humanity’s full potential.
        In doing so, we’re pioneering AI Care, a fundamentally new approach to
        healthcare built for medical reasoning, safety, and real-time treatment,
        not generic technology applied after the fact. As both a
        clinical-centric frontier AI lab and an applied AI platform, Sword is
        reimagining how care is delivered at scale, removing traditional
        barriers like appointments, waiting rooms, and stigma so more people can
        access the care they need—and ultimately get back to lives lived in
        full.&lt;/p&gt; &lt;p&gt;Since 2020, Sword has expanded across physical
        therapy, women’s health, cardiometabolic, and mental health, and is now
        moving beyond the session to a fully AI-native, 24/7 care program that
        brings physical activity, therapeutic exercise, psychotherapy,
        nutrition, and behavior change into one connected experience. More than
        700,000 members across three continents have completed over 10 million
        AI sessions, helping 1,000+ enterprise clients avoid more than $1
        billion in unnecessary healthcare costs. Backed by 42 clinical studies,
        44+ patents, and more than $500 million raised from leading investors
        including Khosla Ventures, General Catalyst, and Founders Fund, Sword is
        defining a new standard for healthcare.&lt;/p&gt;
        &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h4&gt;AI&amp;nbsp;Proficiency at
        Sword&lt;/h4&gt; &lt;p&gt;AI fluency is a core expectation at Sword.
        Every candidate is assessed against our three-level framework — be ready
        to share real examples of how AI is already part of how you
        work.&lt;/p&gt; &lt;ul&gt; &lt;li&gt; &lt;p&gt;Explorer (Level 1) — Uses
        AI daily to boost personal productivity&lt;/p&gt; &lt;/li&gt; &lt;li&gt;
        &lt;p&gt;Builder (Level 2) — Creates workflows and tools that elevate
        the whole team&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;Integrator
        (Level 3) — Embeds AI into products and processes at scale&lt;/p&gt;
        &lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Every hire must demonstrate at least
        Level 1. The expected level will vary depending on the seniority of the
        role.&lt;/p&gt;
        &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Role&lt\
        ;/strong&gt;&lt;strong&gt;&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;As Director Growth Marketing you own B2C patient acquisition
        for Kaia in Germany end to end – from first impression to activated
        patient. You set the channel mix (performance, TV/CTV, CRM, SEO,
        partnerships), own the budget and are accountable for patient volume and
        CAC.&lt;/p&gt; &lt;p&gt;You&#39;ll build the team and agency setup from
        scratch, use Sword&#39;s global growth playbook and report to the
        Managing Director Germany.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What you’ll
        be doing&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Own B2C growth
        targets for Germany: sign-ups, activated patients, CAC and
        payback&lt;/li&gt; &lt;li&gt;Own and allocate the German B2C marketing
        budget across channels based on incrementality, not last
        click&lt;/li&gt; &lt;li&gt;Build and scale paid performance (Meta,
        Google, YouTube, TikTok, programmatic) incl. high-velocity creative
        testing&lt;/li&gt; &lt;li&gt;Lead brand and TV/CTV strategy, incl.
        testimonial and brand ambassador campaigns – test before scaling
        nationally&lt;/li&gt; &lt;li&gt;Build full-funnel measurement together
        with Operations: attribution, MMM, incrementality tests, tracking from
        sign-up to activation&lt;/li&gt; &lt;li&gt;Own website/landing page
        conversion (CRO) and CRM lifecycle journeys (email, SMS)&lt;/li&gt;
        &lt;li&gt;Hire and lead an in-house team and manage agencies; align with
        Sword global marketing&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&lt;strong&gt;What you need to have&lt;/strong&gt;&lt;/p&gt;
        &lt;ul&gt; &lt;li&gt;3-5+ years in B2C growth/performance
        marketing&lt;/li&gt; &lt;li&gt;Owned 6 to 7-figure+ annual budgets with
        accountability for CAC and payback&lt;/li&gt; &lt;li&gt;Strong
        analytical skills: attribution, incrementality testing, experimentation
        design&lt;/li&gt; &lt;li&gt;Experience combining brand/TV/CTV with
        performance marketing; strong creative judgement&lt;/li&gt;
        &lt;li&gt;Fluent German and English&lt;/li&gt; &lt;li&gt;Experience in a
        regulated category (DiGA, health, OTC pharma, insurance, fintech) is a
        plus&lt;/li&gt; &lt;li&gt;Nice to have: Digital Health experience, 0→1
        market launches, marketing to a 45+ target group&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;div
        class=&quot;content-pay-transparency&quot;&gt;&lt;div
        class=&quot;pay-input&quot;&gt;&lt;div
        class=&quot;description&quot;&gt;&lt;p
        class=&quot;font-claude-response-body break-words
        whitespace-normal&quot; style=&quot;text-align: left;&quot;&gt;&lt;span
        style=&quot;font-size: 14px;&quot;&gt;*The range below reflects base,
