        entscheidenden Phasen all-in zu gehen, bist du hier richtig. Wir sind
        ein Office-First-Team im Herzen Münchens, das auf enge Zusammenarbeit,
        muttersprachliche Kommunikationsstärke in Deutsch und unverhandelbare
        Lieferqualität setzt. Nimm dir bitte kurz die Zeit und lies die
        Stellenausschreibung vollständig durch. Du bist der strategische Kopf
        und die treibende Kraft hinter unseren Performance-Marketing-Kampagnen.
        Du jonglierst mit Budgets, analysierst Daten und optimierst Kampagnen
        auf Meta und/oder Google, um für unsere E-Commerce-Kunden (Food, Beauty,
        Lifestyle) maximale Ergebnisse zu erzielen. Du bist nicht nur ein
        Verwalter, sondern ein Wachstumstreiber, der mit kreativen Ideen und
        analytischer Schärfe den Erfolg unserer Kunden und der Agentur
        vorantreibt. Was uns von anderen Agenturen und Brands unterscheidet:
        Unsere Creative-Produktion ist kein Flaschenhals. Du bekommst jederzeit
        sexy Performance-Creatives direkt von unserem Inhouse-Team, um deine
        Kampagnen sauber zu testen, zu iterieren und zu skalieren. Konkret Du
        entwickelst und steuerst Performance-Marketing-Kampagnen über
        verschiedene Kanäle (Primär Meta – Google, LinkedIn, Tiktok sind ein
        Plus). Du analysierst Kampagnen-Daten, identifizierst Trends und leitest
        Optimierungsmaßnahmen ab. Du arbeitest eng mit dem Design-Team zusammen,
        um überzeugende Creatives zu entwickeln und zu testen. Du verwaltest und
        optimierst Budgets, um den ROAS zu maximieren. Du kommunizierst proaktiv
        mit den Kunden, präsentierst Ergebnisse und gibst strategische
        Empfehlungen. Du bleibst am Puls der Zeit, testest neue Kanäle, Formate
        und Strategien. Dein Profil +3 Jahre Erfahrung im Performance Marketing
        (Midlevel, Senior und aufwärts). Nachweisbare Erfolge in der Skalierung
        von D2C-Brands auf Plattformen wie Meta, Google und/oder TikTok. Tiefes
        Verständnis für Datenanalyse und die Fähigkeit, aus Zahlen
        handlungsorientierte Erkenntnisse zu gewinnen. Eigenverantwortung &#x26;
        Macher-Mentalität – du brauchst kein Micromanagement und treibst
        Projekte proaktiv voran. Kommunikationsstärke – du kannst komplexe
        Sachverhalte einfach erklären und Kunden überzeugen. Du bist ein
        Teamplayer, der eng mit Kreativen und anderen Stakeholdern
        zusammenarbeitet. Muttersprachliche Deutschkenntnisse. Lebensmittelpunkt
        München (unverzichtbar). Wir setzen auf Office-First. Diese Rolle ist
        NICHT für dich, wenn: Du um Punkt 18:00 Uhr den Laptop zuklappst Du nur
        nach Schema F arbeitest und dich nicht traust, neue Wege zu gehen. Du
        bei schwankenden Performance-Zahlen nervös wirst, anstatt die
        Herausforderung anzunehmen. Du lieber im stillen Kämmerlein arbeitest,
        als dich aktiv mit dem Team und den Kunden auszutauschen. Du mit
        Feedback nicht umgehen kannst. Diese Rolle ist für dich, wenn: Du es
        liebst, an den Stellschrauben von Kampagnen zu drehen, um das letzte
        Quäntchen Performance herauszuholen. Du datengetriebene Entscheidungen
        triffst und Hypothesen gerne im Live-Betrieb testest. Du den Erfolg
        deiner Kampagnen als persönlichen Erfolg siehst. Du in einem dynamischen
        Umfeld aufblühst und Geschwindigkeit dich motiviert. Du kreativ
        mitdenkst und nicht nur abarbeitest. Kurz gesagt: Agenturleben =
        Geschwindigkeit, volle Eigenverantwortung, manchmal Stress. Wenn dich
        das pusht statt stresst, bist du hier richtig. Nice-to-have: Erfahrung
        mit Creative Strategy oder Performance Marketing Kampagnen.
        Grundverständnis für Design-Tools (Figma, Photoshop, After Effects).
        Erfahrung mit E-Commerce Brands (Food, Beauty, Lifestyle). Du hast schon
        mal ein kreatives Team koordiniert. Warum wir? Volle
        Projektverantwortung vom ersten Tag an – Du steuerst und verantwortest
        deine Projekte selbstständig. Ein preisgekröntes Creative-Department für
        Non-Stop Premium Creatives für deine Skalierung Kreative Freiheit – du
        darfst mitdenken und mitgestalten. Motiviertes High-Performance-Team –
        keine Politik, flache Hierarchien, die von deiner Eigeninitiative
        getragen werden. Spannende Leadgen/E-Commerce Brands (Food, Beauty,
        Lifestyle). Fettes &#x26; steuerfreies Benefitpaket inkl. Sachbezug,
        Wellpass, Mittagessen, Deutschlandticket. Modernes, zentrales Office im
        Herzen Münchens (Gärtnerplatz) – der zentrale Ankerpunkt unserer
        Kollaboration und Kultur. Team-Events, Workshops, Weiterbildungen.
        Darauf schauen wir Schick uns ein kurzes Anschreiben – so knapp wie
        möglich. Drei klare Benefits, warum es sich lohnt, mit dir zu arbeiten,
