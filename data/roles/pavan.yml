        Markteinführung neuer Produkte und Leistungen. Du arbeitest eng mit
        allen Bereichen und dem Vertrieb zusammen, um die Customer Journey
        gezielt zu begleiten. Performance Marketing &amp; Leadgenerierung Du
        konzipierst und steuerst unsere Leadfunnels und sorgst u.a. dafür, dass
