      description: "&lt;h2&gt;&lt;strong&gt;About the Role&lt;/strong&gt;&lt;/h2&gt;
        &lt;p&gt;We are looking for a data-driven &lt;strong&gt;App Marketing
        Specialist&lt;/strong&gt; to join our growing App Marketing team. In
        this role, you will support the execution and optimization of both paid
        &amp;amp; organic app user acquisition across key platforms like Apple
        Search Ads (ASA) and Google App Campaigns (UAC), Social Platforms (Meta,
        TikTok)&lt;/p&gt; &lt;p&gt;As an App specialist, you will bridge the gap
        between technical execution and creative performance. You’ll work
        closely with paid social, analytics, and product teams to help scale our
        mobile growth. This role is ideal for a performance marketer who is
        passionate about the mobile ecosystem and thrives in a fast-paced,
        testing-heavy environment.&lt;/p&gt; &lt;h2&gt;Your
        Responsibilities&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Campaign
        Execution:&lt;/strong&gt; Support the setup, management, and daily
        optimization of user acquisition campaigns via Apple Search Ads (ASA),
        UAC, TikTok, and Meta.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Performance
        Monitoring:&lt;/strong&gt; Track daily budget pacing and campaign
        performance globally, ensuring KPIs are met and reporting is kept up to
        date.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Creative
        Collaboration:&lt;/strong&gt; Work with the creative and brand teams to
        develop, test, and iterate on high-performing ad assets specifically for
        mobile.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Cross-Functional
        Support:&lt;/strong&gt; Partner with ASO, CRM, and Product teams to
        ensure a seamless user journey from &quot;click to
        subscription.&quot;&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Experimentation:&lt;/strong&gt; Assist in
        running A/B tests and audience segmentation experiments to improve CPAs,
        retention, and ROAS.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Tracking
        &amp;amp; Data:&lt;/strong&gt; Support the monitoring of MMP (Mobile
        Measurement Partner) events to ensure tracking accuracy and data
        integrity.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Operational
        Efficiency:&lt;/strong&gt; Maintain internal documentation, marketing
        calendars, and tools to ensure the App Marketing team operates
        efficiently.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;What You’ll
        Bring&lt;/strong&gt;&lt;/h2&gt;
        &lt;p&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;
        &lt;li&gt;&lt;strong&gt;Experience:&lt;/strong&gt; 3+ years of
        experience in digital marketing, with at least 1–2 years specifically
        focused on mobile performance or app-based UA.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Channel Knowledge:&lt;/strong&gt; Practical
        experience setting up and managing campaigns in Apple Search Ads or
        Google UAC.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Analytical
        Mindset:&lt;/strong&gt; Comfortable working with large data sets in
        Excel/Sheets or BI tools (e.g., Tableau) to derive actionable
        insights.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Communication:&lt;/strong&gt; Strong written and
        verbal skills with the ability to translate technical app data into
        clear performance updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Project
        Management:&lt;/strong&gt; Excellent organizational skills; able to
        manage multiple campaign launches and creative deadlines
        simultaneously.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Adaptability:&lt;/strong&gt; A proactive
        attitude with a desire to learn the nuances of mobile attribution (SKAN,
        ATT, and MMPs).&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&lt;strong&gt;Preferred&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;
        &lt;li&gt;Experience in a B2C subscription or e-commerce
        environment.&lt;/li&gt; &lt;li&gt;Familiarity with Mobile Measurement
        Partners (MMP) such as &lt;strong&gt;Adjust&lt;/strong&gt; or
        &lt;strong&gt;AppsFlyer&lt;/strong&gt;.&lt;/li&gt; &lt;li&gt;Exposure to
