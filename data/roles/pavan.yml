        intransparenten Markt für 24-Stunden-Betreuung radikal verändert. Wir
        machen Pflege einfacher zugänglich, transparent und bezahlbar. Wir haben
        viel ausprobiert und viel gelernt. Performance-Marketing läuft. TV haben
        wir zwei Jahre lang mit echtem Druck gefahren. Mailing, Print und
        Partnerschaften kennen wir aus eigener Erfahrung, nicht aus Fallstudien.
        Jetzt geht es um die zweite Stufe: aus einzelnen Kanälen ein System
        machen, das trägt, und aus marta eine Marke, die Familien kennen, bevor
        sie zum ersten Mal suchen. Darauf arbeiten wir gemeinsam hin: die erste
        große Marke für Altenpflege in Europa. Die gibt es bisher nicht. Wir
        suchen die Person, die das plant, koordiniert und schreibt. Du denkst
        dir Kampagnen aus und bringst sie bis zum fertigen Material. Du
        entscheidest mit, welchen Kanal wir als Nächstes aufmachen und in
        welcher Reihenfolge. Und du sprichst mit denen, die das möglich machen:
        Sendern, Veranstaltern, Partnern, Produktionen. Wenn du es leid bist,
        deine beste Idee in einer Präsentation sterben zu sehen, ist das hier
        der Unterschied: keine Pitch-Runden, keine Freigabekette, keine dritte
        Feedbackschleife. Du stellst deine Idee dem Performance-Marketing und
        den Gründern vor, und ihr entscheidet im selben Gespräch. Was montags
        beschlossen wird, läuft spätestens in der Woche darauf. Wir sind eine
        der größten Plattformen im deutschen 24-Stunden-Pflegemarkt, finanziert
        von führenden Investoren wie Capnamic, Almaz Capital, RTL Ventures und
        Swiss Health Ventures, mit einem bundesweiten Franchise-System und Teams
        in Berlin, Bonn, Sibiu und Danzig. Level: Senior. Du planst und
        koordinierst: Kanäle, Budget, Timing, Briefings. Die Texte schreibst du
        selbst. An deiner Seite: unser Senior Performance Marketing Manager.
        Dort liegen Analyse, Attribution und die Aussteuerung der bezahlten
        Kanäle. Bei dir liegen Marke, Kampagnen und die Kanäle daneben. Ihr
        arbeitet auf Augenhöhe an einem Funnel. Founder-Nähe: du arbeitest eng
        und direkt mit den Gründern an Marke, Botschaft und Ideen. Kurze Wege,
        schnelle Entscheidungen. Perspektive: Head of Brand mit eigenem Team.
        Die Bedingung dafür sagen wir dir offen: mindestens ein zusätzlicher
        skalierbarer Push-Kanal, der uns spürbar schneller wachsen lässt. Start:
        so bald wie möglich Deine Rolle in unserem Team Du bist die erste Person
        bei marta, die ausschließlich für die Marke da ist. 8 von 10 unserer
        treuesten Familien würden marta weiterempfehlen. Diese Geschichte
        erzählt bisher niemand systematisch. Du gibst marta eine Stimme, ein
        Gesicht und Kampagnen, die hängen bleiben. Was du jetzt festlegst, ist
        das Fundament für alles, was danach kommt. Was du machst Kampagnen, die
        hängen bleiben . Du entwickelst Kampagnen für Familien, die vor einer
        der schwersten Entscheidungen ihres Lebens stehen. Keine Werbeanzeigen,
        sondern etwas, das man sich merkt. Und du bringst sie bis zum fertigen
        Material. Kanäle planen und koordinieren . Du entscheidest mit, was wir
        als Nächstes testen, in welcher Reihenfolge und mit welchem
        Erfolgskriterium. Und du sagst genauso klar, was wir uns sparen, weil du
        Erfahrung mit verschiedenen Kanälen mitbringst. Texte, die du selbst
        schreibst. Landingpages, SEO- und Ratgeber-Content, Anzeigentexte,
        E-Mails, Videoskripte, Social, Print. Am Anfang entstehen sie an deinem
        Schreibtisch, zunehmend KI-gestützt. Wenn ein Kanal skaliert und wir
        echtes Volumen brauchen, holen wir Unterstützung dazu. Produktion
        briefen . Für Film, Design und größere Produktionen arbeitest du mit
        Freelancern und Spezialisten. Du briefst sie, beurteilst, was
        zurückkommt, und hältst die Marke über alle Kanäle konsistent. Social
        Media, UGC und Community . Hinter marta steht eine große Community aus
