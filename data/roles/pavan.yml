      description: "Our belief: At SOLPLANET, we are driven by a simple idea: solar
        for everybody We strive to create the best possible experience for
        distributors, installers and end users That´s why our solar inverters,
        energy storage systems and EV chargers are easy-to-install, reliable and
        user friendly Who We Are: Private equity-backed AISWEI is a leading
        provider of renewable energy solutions - providing the world with solar
        inverters, batteries, EV chargers, heat pumps, and energy management
        solutions AISWEI has more than 15 years of expertise in R&amp;D and
        manufacturing, with a strong technology heritage from both Germany and
        China With 32 GW of annual production volumes (2024), AISWEI is one of
        the largest manufacturers of solar string inverters world-wide AISWEI is
        operating under its own brand in China and its SOLPLANET brand
        internationally, and is trusted by leading global brands as an ODM
        service provider Our team passionately believe that that we are all
        fellow citizens of one planet, and we are truly honored about deploying
        our solutions to local societies worldwide – every day Overview and
        purpose of the role – How you will help us: The Marketing Specialist
        BeNeLux and UK&amp;Ireland is responsible for the Marketing Strategy as
        well as for defining, coordinating and ensuring the successful
        implementation and steering of the Marketing activities in the named
        countries. This role will be responsible for aligning with the Country
        Managers responsible for these countries, on strategic priorities based
        on the analysis of the competitive environment and customer segments, to
        elaborate plans that adjust to the countries’ needs and characteristics
        to achieve the set growth targets. In addition, as a member of the
        Global Solplanet Marketing Team, the Marketing Specialist BeNeLux and
        UK&amp;Ireland will contribute to the management of the company’s owned
        communication channels, with a special focus on social media,
        newsletters, local homepages and blog articles. The goal is to enhance
        overall brand awareness by designing marketing plans and implementing
        activities that strengthen brand positioning in the market, engage
        target audiences, and align with the company’s growth objectives. This
        role is part of the Western European market organization and covers
        marketing responsibilities for the BeNeLux countries as well as UK and
        Ireland. At the same time, this position is part of the Global Solplanet
        Marketing Team that includes both positions with global responsibility
        and scope as well as local marketing positions responsible for the
        marketing activities in several local countries. As such, this role
        operates within a matrix structure, reporting to both the Country
        Managers BeNeLux and UK &amp; Ireland as wells as to the Global
        Solplanet Marketing Director. Team and reporting structure · This
        position is part of the Global Solplanet Marketing Team that includes
        both positions with global responsibility and scope as well as local
        marketing positions responsible for the marketing activities in several
        local countries. The local Marketing Managers and Specialists receive
        support from the Central Marketing team in the areas of Content
        Marketing, website maintenance and overall strategic guidance as well as
        of the leaders of centrally managed projects · More specifically, this
        role is part of the BeNeLux market organization and covers marketing
        responsibilities for BeNeLux and UK&amp;Ire · This role operates within
        a matrix structure, reporting to both the Country Manager BeNeLux as
        well as the Global Solplanet Marketing Director. Key responsibilities ·
        Marketing Strategy and Marketing Plan: based on the knowledge and
        continuous observation of the competitive landscape, the Marketing
        Specialist BeNeLux and UK&amp;Ire will elaborate in alignment with the
        respective Country Managers a Marketing Strategy translated into a
        Marketing Plan and the implementation of activities that support the
        achievement of the set growth targets in each country. · PR activities :
        responsible for liaising with local media to build and maintain strong
        relationships, while working to secure media presence by creating
        compelling content pieces such as press releases, interviews, and
        advertorials that generate interest and enhance the brand's visibility ·
        Website management : Management of the local websites to ensure
        up-to-date content and traffic. · Solplanet Academy: Elaborate and
        implement the local training roadmap that covers webinars, training
        events, and related trainings activities with distributors. · Tradeshows
        and events : Own and coordinate with the support of the global
        exhibitions team the Solplanet presence at local trade shows as well as
        the participation at industry events · Collaboration with customers :
        ensure a good relationship with the distributors and installers network
        by enhancing collaboration on joint activities · Documentation portfolio
        management: Manage and localize the documentation portfolio for BeNeLux
        and UK&amp;Ire, both technical and commercial documentation as well as
        case studies as part of the local referral marketing strategy ·
        Performance Tracking and Optimization: Track performance of all
        marketing activities and local channels, and identify areas for
        optimization, driving a continuous improvement and learning process. ·
        Community and MQL Management : Manage community engagement and Marketing
        Qualified Leads (MQL) within the CRM, ensuring timely follow-up by the
