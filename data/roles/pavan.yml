        start-up - a solid launchpad for future leadership or founding roles.
        Experience a small core team with flat hierarchies and direct decision
        paths. Prime Location: Work from our central Berlin Mitte office
        (Rosenthaler Platz). High-Intensity Start-up Experience: Our non‑remote
        culture runs from 8:30am - Check-out at 8pm. Bias for action in a
        revenue-driven start-up that has substantial traction and is profitable
