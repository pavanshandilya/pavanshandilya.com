        bestehende Abteilungsleitung verantwortet. Du unterstützt diese bei
        saisonalen Kampagnen durch SEO und Grafik-Maßnahmen. Gemeinsam sorgt ihr
        dafür, dass Marke, Kommunikation und Performance optimal
        zusammenspielen. &nbsp;&nbsp; Was dich bei uns erwartet Eine
        verantwortungsvolle Position mit viel Gestaltungsspielraum Ein
        abwechslungsreiches Aufgabengebiet mit hoher Eigenverantwortung
        Attraktives Grundgehalt Flexible Arbeitszeiten Moderne Arbeitsumgebung
        und gute technische Ausstattung Hohe Weiterbildungsmöglichkeiten durch
        Coachings, unsere Academy und interne Trainings Individuelle
        Entwicklungsmöglichkeiten innerhalb des Unternehmens Mitarbeiter-Events
        und eine offene Teamkultur Mitarbeiter-Rabatte und weitere
        Vergünstigungen Flache Hierarchien und kurze Entscheidungswege Enge
        Zusammenarbeit mit Performance Marketing, Vertrieb, Recruiting und der
        Geschäftsleitung Gute Erreichbarkeit und Parkmöglichkeiten Deine
        Aufgaben Als Marketing Manager verantwortest du das operative Marketing
        von hairfree und entwickelst unseren visuellen Markenauftritt
        kontinuierlich weiter. Du stellst sicher, dass unsere Marke über alle
        Kanäle hinweg professionell, hochwertig und einheitlich präsentiert
        wird. Dabei führst und steuerst du unsere Social-Media-Managerin
        fachlich und arbeitest eng mit der Leitung Performance Marketing sowie
        weiteren internen Abteilungen zusammen. Zu deinen Aufgaben gehören
        insbesondere: Verantwortung für das operative Marketing und die
        Weiterentwicklung unseres Markenauftritts Fachliche Führung und
        Steuerung unserer Social-Media-Managerin Sicherstellung und
        Weiterentwicklung eines konsistenten Corporate Designs Konzeption und
        Gestaltung von Flyern, Broschüren, Anzeigen, Außenwerbung sowie weiteren
        Print- und Werbemitteln Erstellung von Marketingmaterialien für
        Vertrieb, Recruiting und Unternehmenskommunikation Pflege,
        Weiterentwicklung und Optimierung unserer Unternehmenswebseite Planung
        und Umsetzung geeigneter SEO-Maßnahmen Verantwortung für das
        Online-Reputationsmanagement und die Betreuung relevanter
        Bewertungsplattformen Entwicklung integrierter Marketingkampagnen in
        enger Zusammenarbeit mit der Leitung Performance Marketing Koordination
        externer Agenturen, Druckereien und weiterer Dienstleister
        Eigenverantwortliche Steuerung von Marketingprojekten unter
