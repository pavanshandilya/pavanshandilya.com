      description: "Our story: Every year millions of people are either filing their
        taxes in fear or giving up on their tax refund altogether. We're working
        on fixing that. Our intuitive app enables anyone, regardless of
        education or background, to file their taxes with newfound confidence.
        Spread across Germany, Spain and the UK, the team at Taxfix Group with
        its brands Taxfix and Steuerbot, is a compassionate group of
        solution-finders. We speak our minds openly, and with over 400
        professionals, including tax experts, developers, and IT security
        experts, we're rich in ideas and voices. The group has facilitated more
        than 3.5 billion euros in tax refunds for its customers since its
        founding in 2016. The opportunity: We're now growing our consumer
        business and building new services for self-employed people and
        freelancers. To support that, we're looking for an Influencer Marketing
        Manager to run creator campaigns for Taxfix and Steuerbot. Most people
        find taxes stressful. Hearing from a creator they already trust that
        they got money back in one evening is more convincing than an ad. That's
        why creators are a big part of our marketing. We run the channel
        in-house with a significant yearly budget and use it both to bring in
        new users and to build trust in our brands. The hard part is doing both
        at once: getting new users at a good cost while keeping the content
        credible for the creator's audience. This role reports to the Influencer
        Marketing Lead and focuses at first on our two German brands, Taxfix and
        Steuerbot. What you'll do Run and scale creator campaigns from start to
        finish: find creators, reach out, negotiate, brief them, review content,
        take it live and report on results. Negotiate deals that make sense for
        both sides. Push back on first prices and agree on terms like view
        guarantees or performance-based pay. Build long-term relationships with
        creators and their managements, and decide how we work with them across
        both brands. Run frequent hypothesis-driven experiments. We put strong
        emphasis on asking the right questions, good experiment design, and
        generating actionable data and interpretations. You own large parts of
        creator and influencer experimentation. You continue to expand our
        creator database and context layer, allowing you to work very data and
        insight driven, and enabling AI agents to work alongside or for you
        equipped with the right data and context. Automate the repetitive parts
        of your job with n8n, Claude Cowork/Code and GitHub, so research,
        scoring and reporting run on their own and you can spend your time on
        higher value work with creators, negotiations, content and strategy.
        Seasonal campaign planning across multiple platforms, formats and
        creator sizes. What you'll bring 2–4 years of hands-on experience
        running influencer campaigns on TikTok, Instagram and YouTube, at a
        brand or an agency. You’re highly curious about the creator economy and
        thrive on turning complex, ambiguous challenges into practical solutions
        in a high-agency role. You’re an effective and confident negotiator who
        always strives to get the best deal and who’s not shy to walk away from
        a deal. You’re highly analytical and very comfortable with processing
        and critically interpreting data sets, with an eye for detail. You are
        on the path of becoming an AI builder with first basic to advanced
        workflow automations or other agentic solutions under your belt with
        measurable impact. You’re experienced in general in how to work with
        LLMs and agentic solutions effectively, including when to critically
        review their outputs. Strong communicator and relationship builder with
        both, internal stakeholders and external managements and creators.
        You’re fluent in German and English. If you come from performance
        marketing, growth, affiliate or creator operations and have worked with
        creators, apply anyway. We'd like to hear from you. What your first 90
        days look like A creator pipeline where you can explain why each creator
        is on it. Working relationships with the creators and managements you
        book. Two structured experiments, with read-outs that say what failed as
        clearly as what worked. One recurring task automated, with the hours it
        saves measured. Why Taxfix? A chance to do meaningful, people-centric
        work with an international team of passionate professionals. Holistic
        well-being with free mental health coaching sessions. A monthly
        allowance to spend on an extensive range of services that you can use
        and roll over as flexibly as you like. Employee stock options for all
        employees—because everyone deserves to benefit from the success they
        help to create. 30 annual vacation days and flexible working hours. A
        generous learning budget to support your personal and professional
        development and guidance from our internal L&amp;D experts. Work from
        abroad for up to six weeks every year. Just align with your team, and
        then enjoy your trip. Plenty of opportunities to socialise as a team. In
        addition to internal meetups, our international team hosts regular
        get-togethers—virtually and in person when possible. Free tax
        declaration filing, of course, through the Taxfix app—and internal
        support for all personal tax-related questions. Have a four-legged
        friend in your life? We’re happy to have dogs join us in the office.
        Excited? So are we. Check out our Life at Taxfix page on LinkedIn to get
        a glimpse of our culture. At Taxfix, we believe that incredible things
        happen when you have a wealth of perspectives and experiences. We're
        proudly committed to equal employment and development opportunities no
        matter your gender, race, religion, age, sexual orientation, colour,
        disability, or place of origin. To help mitigate any potential
        unconscious biases, we ask that you refrain from including your picture,
        age, or marital status on your CV. Let your experiences speak for
        themselves. Not sure if you meet all the requirements for this role?
        Please apply anyway. You might bring something special to the team that
        we hadn't considered previously. Find more English Speaking Jobs in
        Germany on Arbeitnow"
