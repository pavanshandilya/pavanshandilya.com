      description: "About Andercore Andercore is the AI-native supplier of industrial
        materials for energy, infrastructure, and construction in wholesale and
        beyond. We trade with global suppliers and distribute to European
        customers on our own account. Our AI runs the full trade and
        distribution end-to-end: sourcing, quality, pricing, sales, logistics,
        and embedded financing. For the customer, it feels like buying from
        their preferred local supplier; for our partners, it is the most
        convenient and safe way to do business across borders. Behind it, our
        software and agentic AI do the heavy lifting that used to take an
        asset-intensive supply chain with four or five intermediaries and weeks
        of manual coordination. Where we are today: Strong triple-digit-million
        euro turnover Seven European markets live 80+ people across Berlin (HQ),
        offices in London, Mumbai, and Shanghai $40M Series B just closed, $75M
        raised to date from Atomico, Project A, and Inven Capital, institutional
        financing from international banks. We are building the world's first
        and last industrial-grade AI operating system for materials, redefining
        how global trade works in one of the largest and most essential
        industries on earth. About the Role We're looking for a Recruitment
        Marketing Specialist to help us build and strengthen Andercore's
        employer brand and attract exceptional talent as we continue to grow.
        You'll sit at the intersection of Talent Acquisition, marketing, and
        events , with three main areas of responsibility: managing our social
        media presence, organising recruitment and employer-brand events, and
        supporting broader Talent Acquisition projects whenever needed. This is
        a hands-on role for someone who enjoys creating engaging content,
        bringing people together, and turning ideas into action. You'll have the
        opportunity to shape how Andercore is perceived by future employees and
        help us build a strong talent community as we scale. What You'll Do
        Social Media &amp; Employer Branding: Manage Andercore's social media
        presence with a focus on employer branding and recruitment. Plan
        content, create and coordinate posts, highlight our people and culture,
        and continuously look for new ways to showcase what it's like to work at
        Andercore. Events: Organise and coordinate recruitment and
        employer-brand events, from career fairs and university events to
        meetups, networking sessions, and internal initiatives. Own the details
        from planning and logistics through to execution and follow-up. Talent
        Acquisition Projects: Support the Talent Acquisition team with a variety
        of projects as needed — from improving candidate communications and
        recruitment campaigns to developing new sourcing initiatives, talent
        community activities, and employer-branding materials. Continuous
        Improvement: Track what works, experiment with new ideas, and use data
        and feedback to continuously improve our recruitment marketing
        activities and candidate engagement. Who You Are You have previous
        experience in recruitment marketing, employer branding, social media,
        events, Talent Acquisition, or a similar role . You are fluent in
        English and confident in communicating with different audiences. German
        proficiency is a bonus, but not a must. You have hands-on experience
        managing social media accounts and creating or coordinating engaging
        content. You have experience organising events and are comfortable
        managing multiple moving parts, deadlines, and stakeholders. You are
        creative, proactive, and enjoy taking ownership — you don't wait to be
        told what needs to be done. You are highly organised and able to manage
        several projects at the same time without losing attention to detail.
        You are a strong communicator who enjoys working with people across
        different teams and seniority levels. You are comfortable working
        independently, while knowing when to ask for input or support. You are
        curious and resourceful, with a willingness to experiment, learn, and
        find practical solutions. You are excited about working in a
        fast-growing, international environment and helping shape the employer
        brand of a company doing something genuinely different. We are an
        equal-opportunity employer and welcome applicants from all backgrounds,
        regardless of race, ethnicity, gender identity or expression, sexual
        orientation, religion, age, disability, or any other characteristic. We
        believe that diversity drives innovation, creativity, and collective
        strength. Compensation: €50K – €60K • Yearly On Target Earnings (Fixed +
        Bonus) €50K – €60K Find Jobs in Germany on Arbeitnow"
