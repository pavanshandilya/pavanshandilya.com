      company: GetMOW
      title: Short-Form Video & Content Creator (m/f/d)
      location: Berlin
      url: https://www.arbeitnow.com/jobs/companies/getmow/short-form-video-content-creator-berlin-348376
      updated_at: 1790710229
      description: "GetMOW is one of the companies being built at Cloud Studios, a
        product studio in Berlin. This role sits across the wider Cloud Studios
        ecosystem, not just GetMOW. Your main focus will be creating content
        around Cloud Studios, our team, our products and the reality of building
        companies from scratch. We’re not looking for someone to sit behind a
        laptop all day editing corporate videos. We’re looking for someone who
        walks into the office with a camera and sees content everywhere. A weird
        conversation becomes a video. A team moment becomes a recurring series.
        Something happens while building a company and you turn it into a story
        people actually want to watch. Think Kinso, HeyClicky, Cluely or SULT
        rather than traditional B2B marketing. Tasks Own short-form video
        content across Cloud Studios and its products, primarily for TikTok,
        Instagram Reels, YouTube Shorts and LinkedIn. Be in the office
