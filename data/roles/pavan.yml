        Verantwortung im Team übernommen oder möchtest den nächsten Schritt in
        Richtung Teamführung gehen.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Kundenorientierung:&lt;/strong&gt; Du fühlst
        dich in der Beratung wohl, kannst komplexe Themen verständlich
        vermitteln und trittst auch in Präsentationen souverän auf.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Organisationstalent:&lt;/strong&gt; Du behältst
        auch bei mehreren Projekten und Stakeholdern den Überblick, setzt
