      description: "Vollzeit | Remote (Deutschlandweit) Du sollst bei jedem Kunden
        dieselben Ergebnisse liefern, egal wie unterschiedlich Budget und
        Angebot sind? Copy kommt aus dem einen Team, Creatives aus dem anderen,
        der Funnel von irgendwem und wenn die Zahlen nicht stimmen, liegt es an
        Dir? Bei SALTYBRANDS verantwortest Du nicht nur die Anzeige, sondern die
        ganze Kampagne: von der Zielgruppenanalyse über Copy, Funnel und
        Creatives bis zum Launch. Du betreust Deine Kunden direkt, hältst die
        Stellschrauben für Optimierungen selbst in der Hand und wirst über eine
        Provision direkt am Erfolg beteiligt. Bei uns machst Du Performance
        Marketing mit echtem Ergebnis: Unsere Kampagnen bringen
        mittelständischen Unternehmen die Fachkräfte, die sie dringend brauchen.
        Das Produkt, das Du vermarktest, ist ein Arbeitgeber und jede Bewerbung,
        die über Deine Kampagne reinkommt, kann für unsere Kunden den
        Unterschied machen. Wer sind wir: SALTYBRANDS gehört zu den führenden
        Recruiting-Unternehmen Deutschlands und unterstützt über 500 kleine und
        mittelständische Unternehmen bei der erfolgreichen Mitarbeitergewinnung
        und fungiert dabei als Unternehmensberatung. Unsere Qualität ist
        mehrfach ausgezeichnet: TÜV-zertifizierte Prozesse , der Deutsche
        Agenturpreis und die Auszeichnung als TOP-Arbeitgeber bestätigen unseren
        Anspruch, neue Maßstäbe in der Branche zu setzen. Bei uns zählt Ambition
        statt Mittelmaß. Über 20 Spezialisten vereinen Marketing-Expertise,
        strategische Kompetenz und echten Teamgeist. Wir bieten Dir ein Umfeld,
        das Erfolg, Fokus und Weiterentwicklung fördert. Hier entstehen
        Strategien, die den Fachkräftemangel nicht einfach verwalten – sondern
        aktiv verändern. Deine Rolle: Kampagnensteuerung von A bis Z Du
        arbeitest Meta-Kampagnen komplett aus, von der Zielgruppenanalyse über
        Copy, Funnel und Creatives bis zum Launch. Deine zentrale Frage: Warum
        würde jemand seinen sicheren Job jetzt aufgeben? Analyse &amp;
        Optimierung Meta-Zahlen sind Dein tägliches Brot. Du wertest die
        Performance aus, ersetzt schwache Anzeigen durch neue Angles und
        entwickelst erfolgreiche Inhalte strategisch weiter. Kundenbetreuung Du
        führst Vertiefungsgespräche, erarbeitest eigenverantwortlich
        Marketing-Angles aus und leitest daraus konkrete Kampagnen ab.
        Projektverantwortung Du bist Ansprechpartner im laufenden Projekt und
        entlastest das Account Management im Tagesgeschäft. Deadlines,
        Projektstatus und Qualität hast Du im Blick. Karriereseiten &amp;
        Systeme Du betreust Karriereseiten und Landingpages, führst
        Technik-Calls mit Kunden und richtest Bewerbermanagement-Systeme wie
        Recruitee und Leadtable ein. Deine Perspektive Mittelfristig entwickelst
        Du unsere Inhouse Social Ads weiter, übernimmst das Qualitätsmanagement
        und wächst in die fachliche Führung hinein. Deine Vorteile bei
        SALTYBRANDS ✅ Provision als Erfolgsbeteiligung Wir belohnen Deinen
        Einsatz: Neben Deinem Fixgehalt wirst Du über eine attraktive Provision
        direkt am Erfolg Deiner Kunden beteiligt ✅ Onboarding, Mentoring &amp;
        Weiterbildung Digitale Lernakademie und intensive Einarbeitung zum
        Start, danach interne Schulungen, KI-Workshops und Marketing-Trainings
        als fester Bestandteil. ✅ 100 € NETTO jeden Monat &amp; 900 €
        Gesundheitsbudget jährlich Der monatliche Zuschuss deckt z. B. Essen,
        Wlan oder Handyrechnungen. Das Gesundheitsbudget nutzt Du für über 300
        Leistungen wie kostenlose Massagen, Physiotherapie, Zahnarztrechnungen
        oder Brillen. ✅ 100 % Remote mit klarem Rhythmus Kein Pendeln, kein
        Büro. Dafür ein gemeinsamer Arbeitstag mit festen Zeiten, in dem
        Abstimmungen schnell gehen und Teamarbeit nicht zu kurz kommt. ✅
        Modernes Arbeitsumfeld Du arbeitest mit klaren, TÜV-zertifizierten
        Prozessen und KI-gestützten Abläufen, die dir Routinearbeit abnehmen. So
        bleibt mehr Zeit für das, was wirklich zählt. ✅ Ehrgeiziges Team Du
        wirst Teil eines leistungsorientierten Teams, das gemeinsam wachsen und
        gewinnen will, mit kurzen Wegen, schnellen Entscheidungen und echtem
        Zusammenhalt. Dazu betreust Du namhafte Kunden wie Veolia, die
        Autohandelsgruppe Gottfried Schultz oder ZinQ."
