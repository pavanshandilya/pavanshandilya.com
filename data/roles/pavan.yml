        aktiv ineinandergreifen statt nebeneinanderher zu laufen. Was Du dabei
        nie aus dem Blick verlierst: die Zahlen dahinter. Du sorgst dafür, dass
        am Ende messbar ist, was davon wirkt und was nicht - und leitest
        entsprechende Maßnahmen ab. Dein Ziel: avenit als starke Marke zu
        positionieren und sicherzustellen, dass unser Vertrieb verlässlich mit
        qualifizierten Leads versorgt wird. Den Weg dorthin gestaltest Du
        selbst. Zusätzlich begleitest Du unser Digital Marketing Team bei
        Kundenprojekten als fachlicher Sparringspartner, indem Du Dein Know-how
