        professional experience in marketing, with an overarching perspective
        and experience in several subareas of Marketing · Demonstrated ability
        to own the marketing responsibility for various local markets and work
        collaboratively with local sales and central marketing teams to drive
        unified marketing efforts. · Experience in budget management and
