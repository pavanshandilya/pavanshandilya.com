        &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h4&gt;AI&amp;nbsp;Proficiency at
        Sword&lt;/h4&gt; &lt;p&gt;AI fluency is a core expectation at Sword.
        Every candidate is assessed against our three-level framework — be ready
