      location: Berlin, Berlin, Germany
      url: https://careers.hellofresh.com/global/en/job/8303169?gh_jid=8303169
      updated_at: 2026-10-26T07:03:39-04:00
      description: "&lt;h2&gt;&lt;strong&gt;The role&lt;/strong&gt;&lt;/h2&gt;
        &lt;p&gt;At HelloFresh, we want to change the way people eat forever by
        making it easier for customers around the world to discover, plan, and
        enjoy high-quality meals. Over the past decade, we’ve grown from a
        meal-kit company into a global food solutions group, active across
        multiple brands including HelloFresh, Factor, Green Chef, EveryPlate,
        Chef’s Plate, and Youfoodz.&lt;/p&gt; &lt;p&gt;As search behavior
        evolves across Google, AI Overviews, ChatGPT, Perplexity, Reddit, and
        other discovery surfaces, our SEO team is expanding its focus from
        traditional organic search to broader Organic Discovery: building the
        content, technical, authority, and measurement foundations that help
        customers find our brands wherever discovery and dinner decisions
        happen.&lt;/p&gt; &lt;p&gt;We are looking for a &lt;strong&gt;Team Lead,
        SEO &amp;amp; GEO&lt;/strong&gt; to lead our global Organic Discovery
        team and help shape the next phase of how HelloFresh Group approaches
        organic growth. This role will lead a team of SEO/GEO specialists and
        work across international markets to translate global strategy into
        scalable programs that grow non-brand organic demand, strengthen our
        visibility across traditional and AI-driven search, and improve the
        quality and discoverability of our content.&lt;/p&gt; &lt;p&gt;This is a
        highly cross-functional leadership role. You will partner closely with
        Product, Engineering, Analytics, Content, Brand, and local Marketing
        teams to identify opportunities, prioritize the highest-impact work, and
        build scalable solutions across brands and markets. You’ll need to be
        equally comfortable setting strategy, coaching a team, digging into
        performance data, and influencing senior stakeholders to move complex
        initiatives forward.&lt;/p&gt; &lt;h2&gt;&amp;nbsp;&lt;/h2&gt;
        &lt;h2&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/h2&gt;
        &lt;ul&gt; &lt;li&gt;Lead, coach, and develop a team of SEO/GEO
        specialists, setting clear priorities and creating an environment of
        strong ownership, collaboration, and continuous development.&lt;/li&gt;
        &lt;li&gt;Help define and execute the global SEO &amp;amp; GEO strategy
        across HelloFresh Group brands and markets, translating broader Organic
        Discovery priorities into actionable roadmaps.&lt;/li&gt;
        &lt;li&gt;Identify opportunities to grow non-brand organic demand and
        customer acquisition across traditional search engines, AI search
        experiences, and emerging discovery platforms.&lt;/li&gt;
        &lt;li&gt;Partner with local Marketing teams to understand
        market-specific opportunities and challenges while building global
        strategies, standards, and solutions that can scale across
        markets.&lt;/li&gt; &lt;li&gt;Lead cross-functional Organic Discovery
        initiatives spanning technical SEO, content strategy, on-page
        optimization, structured data, internal linking, authority and trust
        signals, and GEO/AI visibility.&lt;/li&gt; &lt;li&gt;Partner closely
        with Product and Engineering to translate SEO/GEO opportunities into
        clear requirements, influence roadmap prioritization, and ensure Organic
        Discovery is considered in all major product and platform
        decisions.&lt;/li&gt; &lt;li&gt;Develop scalable approaches to content
        creation, optimization, and governance across recipe, editorial,
        transactional, and other high-value organic surfaces.&lt;/li&gt;
        &lt;li&gt;Advance our GEO strategy by identifying how our brands can
        become more visible, cited, and authoritative across AI-powered
        discovery experiences.&lt;/li&gt; &lt;li&gt;Use search, analytics, AI
        visibility, competitive, and internal business data to identify
        opportunities, diagnose performance changes, prioritize investments, and
        measure impact.&lt;/li&gt; &lt;li&gt;Establish clear performance
        reporting and communicate SEO/GEO performance, opportunities, risks, and
        recommendations to senior stakeholders.&lt;/li&gt; &lt;li&gt;Support
        global and local teams with SEO/GEO expertise, creating frameworks and
        best practices that enable markets to move quickly without sacrificing
        quality or consistency.&lt;/li&gt; &lt;li&gt;Manage relationships with
        relevant agencies, technology partners, and vendors where appropriate,
        ensuring external resources are aligned to our strategy and delivering
        measurable value.&lt;/li&gt; &lt;li&gt;Stay ahead of changes in search
        behavior, search engine platforms, generative AI, and the broader
        discovery ecosystem, translating emerging trends into practical
        implications for HelloFresh Group.&lt;/li&gt; &lt;/ul&gt;
        &lt;h2&gt;&amp;nbsp;&lt;/h2&gt; &lt;h2&gt;&lt;strong&gt;What you’ll
        bring&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;7+ years of
        experience in SEO / Organic Growth, ideally within large-scale,
        international, consumer-facing websites.&lt;/li&gt;
        &lt;li&gt;Demonstrated experience leading and developing SEO or Organic
        Growth teams, with the ability to balance people leadership with
        hands-on strategic involvement.&lt;/li&gt; &lt;li&gt;Broad SEO expertise
        spanning technical SEO, content strategy, on-page optimization,
        authority, international SEO, and performance measurement.&lt;/li&gt;
        &lt;li&gt;Strong understanding of how AI-powered search and answer
        engines are changing organic discovery, with curiosity and practical
        experience applying GEO/AEO principles.&lt;/li&gt; &lt;li&gt;Experience
        developing strategies and roadmaps across multiple markets, brands, or
        business units and balancing global scalability with local-market
        needs.&lt;/li&gt; &lt;li&gt;Strong ability to partner with Product and
        Engineering teams, translate organic growth opportunities into clear
        requirements, and influence prioritization without direct
        authority.&lt;/li&gt; &lt;li&gt;Strong analytical skills and experience
        using platforms such as Google Search Console, GA4, Ahrefs, Profound,
        Screaming Frog, or similar SEO, analytics, and AI-visibility
        tools.&lt;/li&gt; &lt;li&gt;Ability to connect SEO/GEO performance to
        broader business outcomes and clearly communicate priorities, tradeoffs,
        and recommendations to senior stakeholders.&lt;/li&gt;
        &lt;li&gt;Excellent stakeholder management and communication skills,
        with experience navigating complex, cross-functional
        organizations.&lt;/li&gt; &lt;li&gt;High ownership, strong judgment, and
        comfort operating in an evolving environment where priorities,
        technologies, and customer discovery behaviors are changing
        quickly.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&amp;nbsp;&lt;/h2&gt;
        &lt;h2&gt;&lt;strong&gt;What we offer&lt;/strong&gt;&lt;/h2&gt;
        &lt;p&gt;Elevate your lifestyle! Join one of Europe&#39;s
        fastest-growing tech powerhouses in a dynamic phase of
        expansion.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Immerse yourself in a diverse
        global community of 90+ nationalities.&lt;/li&gt; &lt;li&gt;Enjoy a
        competitive compensation package that goes beyond the norm, with perks
        like a HelloFresh- subsidized Pension Scheme, Berlin relocation support,
        and a Hybrid working model.&lt;/li&gt; &lt;li&gt;Elevate your lifestyle
        with exclusive discounts on your weekly HelloFresh box and office
        meals.&lt;/li&gt; &lt;li&gt;Invest in your growth with an annual
        learning &amp;amp; development budget, German language learning budget,
        and access to the HelloFresh Academy.&lt;/li&gt; &lt;li&gt;Plus,
        we&#39;ve got your well-being covered with mental health support,
        transportation perks, and working-parent-friendly benefits. From our
        24/7 gym access, and wellbeing platforms like Headspace and Spill.
        HelloFresh is not just a workplace; it&#39;s a lifestyle of perks and
        possibilities!&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&amp;nbsp;&lt;/h2&gt;
        &lt;h2&gt;&lt;strong&gt;Are you up for the
        challenge?&lt;/strong&gt;&lt;/h2&gt; &lt;p style=&quot;text-align:
        justify;&quot;&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;Please
        submit your complete application below including your salary
        expectations and earliest starting date.&lt;/span&gt;&lt;/p&gt; &lt;p
        style=&quot;text-align: justify;&quot;&gt;&lt;span
        style=&quot;font-weight: 400;&quot;&gt;After submitting an application
        our team will review this and get back to you within 5 business
        days.&amp;nbsp;&lt;/span&gt;&lt;/p&gt;"
