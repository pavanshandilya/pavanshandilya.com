      location: Berlin
      url: https://www.arbeitnow.com/jobs/companies/rosental-organics-gmbh/senior-ai-content-producer-foto-video-motion-befristet-auf-12-monate-vorerst-berlin-171868
      updated_at: 1793809211
      description: "Bei Rosental Organics bist du kein klassischer Fotograf oder
        Videograf – du bist der Content Multiplier. Ein Shoot wird bei dir zu
        50+ Assets, ein UGC-Clip zu 30 Hook-Variants, ein Produktfoto zu 20
        Format-Adaptionen. Der Meta-Algorithmus belohnt Volumen und Diversität,
        und genau das lieferst du: aus einer Kampagne wird bei dir ein ganzer
        Wochen-Feed für Paid Social. Die Stelle ist vorerst auf 12 Monate
        befristet. Du produzierst und multiplizierst Foto-, Video- und
        Motion-Content für Paid Ads, Social, CRM und E-Commerce, mit klarem
        Fokus auf Performance und Testing-Volumen. Du drehst und shootest
        schnell und hands-on mit modernem Setup: UGC, Product, Lifestyle, Studio
        – End-to-End und ohne Assistenz-Kette. Einen skalierbaren AI-Workflow
        baust du selbst auf, der Rohmaterial in Dutzende testbare Variants
        verwandelt: Hook-Iterations, Cutdowns, Format-Adaptions,
        Kontext-Wechsel, Voiceover-Varianten, Motion-Loops. Du entwickelst
        High-Performing Creatives für Meta, TikTok und CRM mit Fokus auf Hook
        Rate, Watchtime, CTR und ROAS. Mindestens 3 neue AI-Tools pro Jahr
        integrierst du produktiv in unseren Stack (Runway, Nano Banana, Kive,
        ElevenLabs, Topaz, CapCut AI, Descript – was heute liefert, ersetzt du
        morgen). Performance-Dashboards liest du selbst, ziehst die Insights und
        übersetzt sie am gleichen Tag in neue Variants und Hypothesen. Du
        bringst 3+ Jahre Erfahrung in Content Production für D2C/ E-Commerce,
        Performance Marketing oder ein hochdynamisches Growth-Umfeld mit,
        inklusive starker Paid-Social-Cases (Meta, TikTok). Dein Portfolio zeigt
        echte Performance-Ergebnisse (Hook Rate, Watchtime, CTR, ROAS) und
        Beispiele, wie du aus einem Asset viele gemacht hast, keine
        Editorial-Reels, keine Behance-Moodboards. Neue AI-Tools lernst du
        eigenständig und schnell: Runway, Nano Banana, Kive, ElevenLabs, CapCut
        AI, Descript und Topaz sind dir vertraut, und den nächsten Tool-Sprung
        hast du meist schon selbst identifiziert. Du drehst, shootest und
        schneidest selbst (≥ 85 %): Sony/Canon, Studio-Light und Natural-Light,
        Premiere Pro, CapCut, Photoshop und Lightroom auf sehr hohem Niveau, mit
        Meta-Funnel-Logik im Schlaf (Hooks Sek. 1, Pattern Interrupt, Pacing).
        Aus einem Shot 50 Assets zu machen, klingt für dich nach Chance statt
        Qualitätsverlust; Premium-Ästhetik ohne Kompromisse ist für dich
