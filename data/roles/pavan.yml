      description: "Gute Geschichten brauchen jemanden, der sie entdeckt. Und umsetzt.
        ✨ Wir bauen die Marke, auf die unsere Eltern gewartet haben: Fortisana,
        einen wissenschaftlich fundierten All-in-One-Drink rund um Muskelerhalt
        und ein aktives Leben. Mit dir wollen wir die Menschen und Ideen
        dahinter sichtbar machen. Hinter Fortisana stehen Piran, Leon und Max:
        Piran hat KoRo mitgegründet und über neun Jahre zu einer der
        erfolgreichsten Lebensmittelmarken Deutschlands aufgebaut. Leon ist
        Ernährungsberater und in der Welt der Nahrungsergänzung aufgewachsen.
        Seine Familie produziert seit über 25 Jahren Nahrungsergänzungsmittel in
        Deutschland. Max hat bereits mehr als sechs Startups begleitet und
        zuletzt bei 1KOMMA5° gelernt, wie aus einer Vision ein operativ
        exzellentes Unternehmen wird. Du arbeitest direkt mit Leon daran, seine
        persönliche Marke aufzubauen. Du machst aus seinem Wissen, seinen Ideen
        und seinem Alltag als Gründer Inhalte, die Menschen wirklich sehen
        wollen. Du findest die Geschichte, fragst nach und bringst sie vom
        ersten Gedanken bis zum veröffentlichten Video. Lerne Leon kennen: Auf
        Instagram @leonbader99 (https://www.instagram.com/leonbader99/) bekommst
        du einen Eindruck von seinen Themen, seinem Stil und den Inhalten, die
        du mit ihm weiterentwickelst. Was du bei uns machst Du entwickelst
        eigene Formate. Gemeinsam mit Leon findest du Themen, starke Einstiege
        und Geschichten rund um Ernährung, Unternehmertum und den Aufbau von
        Fortisana. Du setzt selbst um. Du planst Drehs, filmst Interviews und
        direkte Ansprachen an die Kamera und hältst spontane Momente hinter den
        Kulissen fest. Du machst aus Material gute Videos. Du schneidest
        Kurzvideos mit Rhythmus, sauberem Ton und Untertiteln, die das Anschauen
        leicht machen. Du denkst bis zur Veröffentlichung. Du schreibst
        Begleittexte, veröffentlichst Beiträge und gehst auf Fragen und
        Reaktionen der Community ein. Du lernst aus den Ergebnissen. Du
        erkennst, welche Themen, Einstiege und Formate funktionieren, und
        entwickelst sie weiter. Was du mitbringst Du verstehst Social Media. Du
        kannst Geschichten erzählen und bei Menschen eine Reaktion auslösen.
        Dein Portfolio zeigt dein Können in Konzeption, Dreh und Schnitt. Eigene
        Projekte zählen genauso. Du hast ein gutes Gespür. Für Ästhetik, Sprache
        und Details – und dafür, wann eine Geschichte echt wirkt. Du bist
        neugierig und fragst nach. Du kannst Menschen vor der Kamera begleiten,
        gute Fragen stellen und aus einer ersten Idee mehr herausholen. Du
        packst an. Du bringst eigene Ideen ein und übernimmst Verantwortung für
        ihre Umsetzung. Du kommunizierst sicher. Ausgezeichnete Deutsch- und
        Englischkenntnisse in Wort und Schrift sind Voraussetzung. Du
        formulierst in beiden Sprachen sicher, präzise und zielgruppengerecht.
        Du denkst mit. Ernährung, Sport oder Unternehmertum interessieren dich.
        Du recherchierst sorgfältig und vermittelst Gesundheitsthemen
        verständlich und ohne übertriebene Versprechen. Du bist beim Dreh dabei.
        Für diese Stelle kannst du regelmäßig vor Ort in Berlin mit Leon drehen.
        Drehs in Zürich oder Berlin stimmen wir gemeinsam ab. Du arbeitest
        AI-native und mit Qualitätsanspruch. Du testest eigenständig neue
        KI-Tools und kreative Ansätze und integrierst sie sinnvoll in deine
        Workflows. Dabei prüfst du die Ergebnisse kritisch und hältst unseren
        Qualitätsstandard bei Inhalt, Gestaltung und Genauigkeit hoch. Was wir
        dir bieten Direkte Zusammenarbeit mit Leon. Kurze Wege, ehrliches
        Feedback und die Chance, eine persönliche Marke von Anfang an
        mitzugestalten. Kreativen Freiraum. Deine Ideen sind gefragt. Du kannst
        Formate ausprobieren und einen Stil entwickeln, der wiedererkennbar ist.
        Einblick in echten Markenaufbau. Du erlebst den Aufbau von Fortisana und
        lernst von Pirans KoRo-Erfahrung und Leons Wissen aus der
        Nahrungsergänzungsbranche. Arbeit, die deine Handschrift trägt. Du
        entwickelst dich in Storytelling, Produktion und Schnitt weiter und
        baust ein sichtbares Portfolio auf. Zwei Wege ins Team Du kannst mit
        einem sechsmonatigen Vollzeitpraktikum einsteigen, mit der Möglichkeit
        einer Festanstellung nach erfolgreichem Abschluss. Wenn du bereits mehr
        Erfahrung mitbringst, ist auch eine Teilzeit- oder freiberufliche
        Zusammenarbeit mit einem Umfang von mindestens 50 % möglich. Zeig uns
        deine Arbeit 🤎 Ein perfektes Anschreiben brauchen wir nicht. Uns
        interessiert, wie du denkst und was du selbst auf die Straße gebracht
        hast. Schick uns drei Arbeiten, auf die du stolz bist. Sag bei jeder
        Arbeit konkret, was von dir stammt: Idee, Skript, Dreh, Schnitt oder
        Veröffentlichung – und ob sie im Job, für einen Kunden oder als eigenes
        Projekt entstanden ist. Wenn vorhanden, ergänze Ergebnisse und was du
        daraus gelernt hast. Dazu brauchen wir deinen Standort, deinen möglichen
        Starttermin und ein kurzes Profil oder einen Lebenslauf. Find more
