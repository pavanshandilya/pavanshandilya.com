      updated_at: 1774454427
      description: 'Hey! Bist du auf der Suche nach einer spannenden neuen
        Herausforderung in der Video Creation im Performance Marketing? Dann
        haben wir vielleicht genau das Richtige für dich! Mit Accountable können
        Selbstständige ihre Steuern einfach erledigen - ohne Bürokratie und
        Formulare. Unser Ziel ist die Zukunft des selbstbestimmten Arbeitens
        Wirklichkeit werden zu lassen. Hinter Accountable steht ein
        internationales Team mit Büro in Berlin und Brüssel, das mit viel Spaß
        an diesem großen Ziel arbeitet. Unser Fokus liegt auf einfacher
        Bedienbarkeit durch modernes UX/UI mit künstlicher Intelligenz und Hilfe
        durch unsere Steuer-Coaches. Das Feedback unserer Nutzer spornt uns
        jeden Tag an durch Statements wie diese: "Einfach nur WOW! Super
        einfache Bedienung und die schwierige Steuer-Welt verständlich gemacht.
        Konnte mit wenigen Klicks alle Rechnungen hochladen und dann an die
