      location: Berlin, Berlin, Germany
      url: https://careers.hellofresh.com/global/en/job/8113656?gh_jid=8113656
      updated_at: 2026-09-15T05:55:16-04:00
      description: "&lt;p&gt;&lt;strong&gt;AI Content Creator - Content
        Creation&lt;/strong&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;The
        role&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;As a Senior AI Content Creator
        in the HelloFresh Studio, you are part of the AI Content Creation team
        and play a leading role in developing and scaling AI-powered content
        creation across mainly photography, but also supporting video, design,
        and emerging creative formats.&lt;/p&gt; &lt;p&gt;You combine a strong
        background in commercial visual production with hands-on expertise in
        generative AI. You have a refined visual eye and strong creative
        judgment, allowing you to create high-quality content yourself and
        recognize what makes an image or video successful. Beyond creating
        individual assets, a key part of your role is translating creative
        direction and successful approaches into reliable, production-ready
        workflows that expand the Studio&#39;s AI capabilities. Working closely
        with art directors, photographers, retouchers, video, design, and tech,
        you identify where AI can improve creative possibilities, production
        efficiency, and scale. You help define best practices, evaluate emerging
        technologies, and continuously develop how AI is used in visual
        production across the Studio.&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;What
        you’ll do&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Create
        high-quality AI-powered content across commercial photography and video,
        including lifestyle, food, product, and campaign content, translating
        creative direction into assets ready for real production and marketing
        use.&lt;/li&gt; &lt;li&gt;Develop and refine AI content creation
        workflows, prompts, techniques, and reusable approaches using tools such
        as Krea, Higgsfield, Claude, ComfyUI, and emerging platforms.&lt;/li&gt;
        &lt;li&gt;Work closely with Art Directors, Photographers, Video, Design,
        and Post-Production to translate creative concepts and established
        visual approaches into scalable AI-powered production
        workflows.&lt;/li&gt; &lt;li&gt;Use your creative judgment and
        production experience to continuously improve visual quality, realism,
        consistency, and efficiency across AI-generated content.&lt;/li&gt;
        &lt;li&gt;Partner with Workflow Specialists to identify automation
        opportunities and help turn successful creative processes into scalable
        or automated content-generation workflows.&lt;/li&gt; &lt;li&gt;Evaluate
        emerging AI models, tools, and techniques, testing their practical value
        and introducing those that meaningfully improve creative output or
        production.&lt;/li&gt; &lt;li&gt;Define and share best practices,
        standards, and documentation for AI content creation, and support
        colleagues in developing their AI capabilities.&lt;/li&gt;
        &lt;li&gt;Stay closely connected to developments in generative AI,
        actively experimenting with new approaches and identifying opportunities
        to expand what the Studio can create.&lt;/li&gt; &lt;/ul&gt;
        &lt;h2&gt;&lt;strong&gt;What you’ll bring&lt;/strong&gt;&lt;/h2&gt;
        &lt;ul&gt; &lt;li&gt;&lt;strong&gt;5+ years of professional experience
        in commercial photography, retouching, art direction, or a closely
        related visual production discipline&lt;/strong&gt;, with a strong
        understanding of professional photography and/or video
        production.&lt;/li&gt; &lt;li&gt;Advanced hands-on experience creating
        high-quality visual content with generative AI tools and integrating AI
        into real creative or production workflows.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;A refined visual eye and strong creative
        judgment&lt;/strong&gt;, with an excellent understanding of photography,
        composition, lighting, colour, visual storytelling, realism, and what
        makes commercial imagery feel premium and intentional.&lt;/li&gt;
        &lt;li&gt;Proven ability to interpret creative briefs and translate
        creative direction into high-quality visual content and repeatable
        production approaches.&lt;/li&gt; &lt;li&gt;Strong collaboration and
        communication skills, with the ability to work effectively across
        creative, production, and technical teams.&lt;/li&gt; &lt;li&gt;You are
        proactive, curious, and solution-oriented, with a strong sense of
        ownership, an experimental mindset, and genuine enthusiasm for emerging
        AI technologies.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Please
        include a portfolio of your recent and relevant
        work.&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;br&gt;&lt;br&gt;&lt;/p&gt;"
