        pioneering agentic marketing platform, WPP Open – we help clients
        navigate change, capture opportunity, and deliver transformational
        growth. &lt;/p&gt; &lt;p&gt;WPP Media is WPP&#39;s AI-driven media
        operating unit, bringing together media, data, and partnerships to
        deliver creative personalisation at scale. Connected through WPP Open
        and powered by Open Intelligence, clients see exactly where, how, and
        why their media investment is working.&lt;/p&gt; &lt;p&gt;For more
        information, visit &lt;a
        href=&quot;wppmedia.com&quot;&gt;wppmedia.com&lt;/a&gt;.&lt;/p&gt;&lt;/\
        div&gt;&lt;p&gt;WPP steht für kreative Transformation. Mit der Kraft von
        Kreativität gestalten wir eine bessere Zukunft für unsere
        Mitarbeitenden, unsere Kunden, unsere Gemeinschaften und unseren
        Planeten. Genau hier setzt WPP Media an: Als globales Mediennetzwerk von
        WPP vereinen wir die besten Plattformen, Talente und Partner, um in
        einer vernetzten Medienwelt neue Chancen für grenzenloses Wachstum zu
        schaffen.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Das bieten wir dir:&lt;/strong&gt;&lt;/h2&gt;
        &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Work-Life-Balance&lt;/strong&gt;:
        Dank flexibler Arbeitszeiten mit Schwerpunkt auf dem persönlichen
        Austausch im Office und ergänzender Remote Work passt sich dein Job
        deinem Leben an. Überstunden kannst du flexible ausgleichen.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Vacation mode on&lt;/strong&gt;: Du erhältst 30
        Urlaubstage plus einen flexiblen Tag – zusätzlich sind der 24. und
        31.12. frei.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Wellbeing
        first:&amp;nbsp;&lt;/strong&gt;Gesundheitsleistungen, attraktive
        Altersvorsorge sowie Mental Health Awareness Days stellen deine
        Gesundheit in den Mittelpunkt.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Practice makes perfect&lt;/strong&gt;: Entfalte
        dich mit unseren vielfältigen Weiterbildungen und nutze unsere internen
        Karriereprogramme für deine Entwicklung im WPP-Netzwerk.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;More than just a job&lt;/strong&gt;: Dich
        erwarten unvergessliche Events, Mitarbeitendenrabatte und weitere
        Highlights wie das Job Ticket, Wellhub oder das Job Bike.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Be yourself&lt;/strong&gt;: Bei uns ist jede:r
        herzlich willkommen - Vielfalt und Chancengleichheit liegen uns am
        Herzen.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Das bewegst du:&lt;/strong&gt;&lt;/h2&gt;
        &lt;p&gt;Als &lt;strong&gt;Associate Director Performance Marketing
        (Mensch)&lt;/strong&gt; verbindest du strategisches
        Performance-Marketing-Know-how mit Kundenberatung und Teamführung. Du
        entwickelst gemeinsam mit deinem Team kanalübergreifende Lösungen,
        steuerst anspruchsvolle Projekte und sorgst dafür, dass aus Daten,
        Insights und Ideen wirkungsvolle Performance-Strategien
        entstehen.&lt;/p&gt; &lt;ul&gt;
        &lt;li&gt;&lt;strong&gt;Strategie:&lt;/strong&gt; Du entwickelst
        Performance-Marketing-Strategien weiter, leitest konkrete
        Handlungsempfehlungen ab und berätst Kunden bei strategischen und
        operativen Fragestellungen.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Kundenführung:&lt;/strong&gt; Du bist zentrale
        Ansprechpartner für deine Kunden, präsentierst Empfehlungen souverän und
        entwickelst die Zusammenarbeit gemeinsam mit ihnen kontinuierlich
        weiter.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Teamführung:&lt;/strong&gt;
        Du führst und coachst dein Team, gibst Orientierung im Arbeitsalltag und
        unterstützt deine Mitarbeitenden in ihrer fachlichen und persönlichen
        Weiterentwicklung.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Projektsteuerung:&lt;/strong&gt; Du steuerst
        komplexere Projekte und Kampagnen, koordinierst unterschiedliche
        Experten Teams und stellst eine strukturierte sowie qualitativ
        hochwertige Umsetzung sicher.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Performance:&lt;/strong&gt; Du behältst
        relevante KPIs und Business-Ziele im Blick, identifizierst
        Optimierungspotenziale und sorgst gemeinsam mit deinem Team für eine
        kontinuierliche Weiterentwicklung der Performance.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;New Business:&lt;/strong&gt; Du unterstützt bei
        Pitches und New-Business-Projekten, entwickelst Cases und Präsentationen
        mit und bringst deine Performance-Expertise in die Entwicklung
        überzeugender Lösungen ein.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Innovation:&lt;/strong&gt; Du beobachtest
        Markttrends und neue Entwicklungen im Performance Marketing und bringst
        relevante Impulse in Kundenprojekte sowie in die Zusammenarbeit mit
        internen Teams ein.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Das zeichnet dich aus:&lt;/strong&gt;&lt;/h2&gt;
