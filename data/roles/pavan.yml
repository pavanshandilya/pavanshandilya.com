        and powered by Open Intelligence, clients see exactly where, how, and
        why their media investment is working.&lt;/p&gt; &lt;p&gt;For more
        information, visit &lt;a
        href=&quot;wppmedia.com&quot;&gt;wppmedia.com&lt;/a&gt;.&lt;/p&gt;&lt;/\
        div&gt;&lt;p&gt;Wir bei T&amp;amp;P verstehen uns als datengetriebene
        Kommunikationsagentur, deren Mission es ist, Kreativität, Technologie
        und Daten auf neue, aufregende und effektive Weise zu verknüpfen. Wir
        nennen es das &amp;amp;Modell und die Prämisse ist einfach: Kreation,
        Strategie, Media und Daten/CRM arbeiten Hand in Hand und lösen
        Herausforderungen als ein Team, das nah und partnerschaftlich mit dem
        Kunden zusammenarbeitet.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Das bieten wir dir:&lt;/strong&gt;&lt;/h2&gt;
        &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Work-Life-Balance&lt;/strong&gt;:
        Dank flexibler Arbeitszeiten mit Schwerpunkt auf dem persönlichen
        Austausch im Office und ergänzender Remote Work passt sich dein Job
        deinem Leben an. Überstunden kannst du flexible ausgleichen.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Vacation mode on&lt;/strong&gt;: Du erhältst 30
        Urlaubstage plus einen flexiblen Tag – zusätzlich sind der 24. und
        31.12. frei.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Wellbeing
        first:&amp;nbsp;&lt;/strong&gt;Gesundheitsleistungen, attraktive
        Altersvorsorge sowie Mental Health Awareness Days stellen deine
        Gesundheit in den Mittelpunkt.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Practice makes perfect&lt;/strong&gt;: Entfalte
        dich mit unseren vielfältigen Weiterbildungen und nutze unsere internen
        Karriereprogramme für deine Entwicklung im WPP-Netzwerk.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;More than just a job&lt;/strong&gt;: Dich
        erwarten unvergessliche Events, Mitarbeitendenrabatte und weitere
        Highlights wie das Job Ticket, Wellhub oder das Job Bike.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Be yourself&lt;/strong&gt;: Bei uns ist jede:r
        herzlich willkommen - Vielfalt und Chancengleichheit liegen uns am
        Herzen.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Das bewegst du:&lt;/strong&gt;&lt;/h2&gt;
        &lt;p&gt;Als &lt;strong&gt;Senior Content Creator&lt;/strong&gt; bist du
        die treibende Kraft für plattformstarken Content: Vom ersten Konzept
        über die Set-Regie bis zum KI-optimierten Master-Cut machst du Marken
        auf TikTok, IG &amp;amp; Co. unübersehbar.&lt;/p&gt; &lt;p&gt;&lt;/p&gt;
        &lt;ul&gt; &lt;li&gt;&lt;strong
        data-olk-copy-source=&quot;MessageBody&quot;&gt;Creative Lead &amp;amp;
        Storytelling&lt;/strong&gt;: Im Co-Creation-Trio &lt;span&gt;mit Social
        Media Management und klassischem Conceptor &lt;/span&gt;entwickelst du
        native Formate für TikTok, Instagram, YouTube und LinkedIn. Mit Gespür
        für Trends und Timing machst du daraus Content, der
        hängenbleibt.&lt;/li&gt; &lt;li&gt; &lt;div
        class=&quot;x_elementToProof&quot;&gt;&lt;strong&gt;End-to-End Regie
        &amp;amp; Dreh:&lt;/strong&gt; Am Set übernimmst du eigenverantwortlich
        Produktionsleitung und Regie. Vom cineastischen High-End-Setup bis zum
        agilen Smartphone-Shooting erweckst du Ideen visuell zum
        Leben.&lt;/div&gt; &lt;/li&gt; &lt;li&gt; &lt;div
        class=&quot;x_elementToProof&quot;&gt;&lt;strong&gt;High-End
        Post-Production:&lt;/strong&gt; Du gibst jedem Asset den perfekten
        Schliff. Mit Editing, Color Grading, Sound Design und Motion Graphics
        erschaffst du plattformoptimierte Master auf Studioniveau.&lt;/div&gt;
        &lt;/li&gt; &lt;li&gt; &lt;div
        class=&quot;x_elementToProof&quot;&gt;&lt;strong&gt;Client Sparring
        &amp;amp; Pitch:&lt;/strong&gt; Mit Moodboards und ersten
        Schnittfassungen machst du Ideen greifbar. Du präsentierst deine
        Konzepte mit Überzeugungskraft und stehst Kund:innen bei visuellen
        Fragen verlässlich zur Seite.&lt;/div&gt; &lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Produktions- &amp;amp;
        Ressourcensteuerung:&lt;/strong&gt; Bei größeren Projekten behältst du
        Budget und Timings im Blick. Du hast ein gutes Verständnis für das was
        am Set gebraucht wird und hast kein Problem damit auch für größere
        Produktionen eine Technik-Liste aufzusetzen.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Data Insights &amp;amp;
        KI-Innovation:&lt;/strong&gt; Performance-Daten nutzt du als Hebel für
        gezielte kreative Optimierungen. Gleichzeitig integrierst du generative
        KI-Tools ganz selbstverständlich in Ideation, Kreation und
        Editing.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;p&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Das zeichnet dich
        aus:&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;&lt;/p&gt; &lt;ul&gt;
        &lt;li&gt;&lt;strong
        data-olk-copy-source=&quot;MessageBody&quot;&gt;Plattform-Expertise
        &amp;amp; Storytelling:&lt;/strong&gt; Du besitzt ein exzellentes Gespür
        für Algorithmen, aktuelle Trends und natives Storytelling.
        Markenbotschaften übersetzt du zielsicher in virale und performante
        Formate für TikTok, Instagram, YouTube und LinkedIn.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Dreherfahrung &amp;amp;
        Set-Routine:&lt;/strong&gt; Mehrjährige Praxis am Set zeichnet dich aus.
        Du beherrschst Kamerasysteme, Licht und Ton routiniert und behältst auch
        bei dynamischen Live- und Event-Drehs stets die Ruhe und den Überblick.
        Dabei reist du gerne auch mal zu spannenden Locations und bist offen
        dafür, wenn ein Event vereinzelt mal aufs Wochenende fällt.&lt;/li&gt;
        &lt;li&gt; &lt;div class=&quot;x_ms-outlook-mobile-reference-message
        x_skipProofing&quot;&gt;&lt;strong&gt;High-End
        Postproduktion:&lt;/strong&gt; Adobe Premiere Pro, After Effects und
        DaVinci Resolve beherrschst du auf Top-Niveau, ergänzt durch Know-how in
        Photoshop und Figma. Schnitt, Color Grading, Sounddesign und Motion
        Graphics setzt du eigenständig und stilsicher um.&lt;/div&gt;
        &lt;/li&gt; &lt;li&gt; &lt;div
        class=&quot;x_elementToProof&quot;&gt;&lt;strong&gt;Präsentations-
        &amp;amp; Argumentationsstärke: &lt;/strong&gt;Du bringst visuelle Ideen
        überzeugend auf den Punkt, begründest gestalterische Entscheidungen
        fachlich fundiert vor Kund:innen und berätst verlässlich zu Machbarkeit
        und Bildsprache.&lt;/div&gt; &lt;/li&gt; &lt;li&gt;
        &lt;div&gt;&lt;strong&gt;Team&lt;/strong&gt;&lt;strong&gt; &amp;amp;
        Mentoring:&lt;/strong&gt; Du hast Freude daran, Best Practices im Team
        zu etablieren, konstruktives Feedback zu geben und Kolleg:innen fachlich
        weiterzuentwickeln.&lt;/div&gt; &lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Performance-Gespür &amp;amp;
        KI-Tools:&lt;/strong&gt; Du verstehst es, Performance-Daten zu lesen und
        in kreative Hebel für Hooks, Pacing und Visuals zu übersetzen.
        Generative KI-Tools wie Midjourney, Firefly oder Runway nutzt du bereits
        neugierig und routiniert im Arbeitsalltag.&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;Darüber hinaus bist du:&lt;strong&gt; #kreativ #kommunikativ
        #motiviert&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Wenn du diesen
        Job spannend findest, dann ermutigen wir dich ausdrücklich zur
        Bewerbung, auch wenn du nicht jede oben gelistete Qualifikation
        aufweisen kannst.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Arbeiten bei WPP
        Media:&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Als WPP Media gestalten wir
        die Zukunft der Medien und investieren dabei konsequent in unsere
        Mitarbeiter:innen. Jede:r Kolleg:in genießt die Vorteile des globalen
        Netzwerks von WPP Media und WPP, um sich weiterzuentwickeln&amp;nbsp;und
        an der Spitze von Marketing und Werbung zu lernen. Vielfalt und
        Zusammenhalt leben wir durch zahlreiche Employee Resource Groups und
        regelmäßige interne Events - zum Austausch, zur Inspiration und zum
        gemeinsamen Feiern unserer Erfolge.&lt;br&gt;&amp;nbsp;&lt;br&gt;WPP
        Media ist ein Arbeitgeber, der Chancengleichheit fördert. Wir
        berücksichtigen alle Bewerber:innen für alle Positionen ohne
        Diskriminierung. Unser Ziel ist eine Kultur des Respekts und der
        Zugehörigkeit, in der jede:r die gleichen Möglichkeiten hat, sich
        einzubringen und beruflich zu wachsen.&lt;/p&gt; &lt;p&gt;Bitte lies
        unsere &lt;a
