        vergleichbare Qualifikation Mind. 6 Jahre Berufserfahrung im
        B2B-Marketing mit Mittelstandskunden, idealerweise im Agentur-, SaaS-
        oder digitalen Umfeld Fundierte Kenntnisse im Performance Marketing
        sowie in Marketing Automation und Web-Analytics Erfahrung in
        Content-Entwicklung, Kampagnenplanung und -steuerung Sicherer Umgang mit
        gängigen Marketing-, Tracking- und CRM-Tools (z. B. Google Ads, Meta
