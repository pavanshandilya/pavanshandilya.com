      description: "&lt;h2&gt;&lt;strong&gt;The role&lt;/strong&gt;&lt;/h2&gt;
        &lt;p&gt;We are seeking a Paid Marketing X-Channel Director to lead a
        global, cross-functional team that sits at the intersection of
        marketing, product, and technology. This is a hybrid role that blends
        product management, project management, and marketing expertise to drive
        the development of scalable solutions, innovative marketing technology,
        and data-driven acquisition strategies.&lt;/p&gt; &lt;p&gt;You will
        oversee a team of specialists, including project managers, automation
        engineers, audience managers, and conversion rate optimization experts.
        You will partner with Product, Engineering, and Analytics to deliver the
        next generation of performance marketing capabilities.&lt;/p&gt;
        &lt;p&gt;Reporting to the Senior Director, Performance Marketing
        International, you will help develop and execute strategic plans,
        driving innovative solutions that elevate performance marketing to the
        next level through advanced technology, scalable processes, and
        data-driven strategies.&lt;/p&gt; &lt;p&gt;This role is ideal for
        someone with a strong background in product or solution-oriented roles,
        ideally with experience building or customizing platforms, bidding
        systems, or marketing tools, who also brings solid expertise in online
        and performance marketing platforms.&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/h2&gt;
        &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Lead a high performing
        cross-functional team&lt;/strong&gt;: develop and mentor a team of 10,
        with 3 direct reports, fostering collaboration, innovation and
        accountability&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Define &amp;amp;
        deliver the vision&lt;/strong&gt;: develop the strategic roadmap for the
        marketing technology and performance stack, ensuring close alignment
        with our business goals and global acquisition strategy&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Bridge cross-functional teams&lt;/strong&gt;:
        Serve as the strategic bridge between Marketing, Product, Engineering,
        and Analytics, ensuring alignment on priorities and scalable solution
        delivery&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Optimize performance
        &amp;amp; conversion&lt;/strong&gt;: Spearhead global Conversion Rate
        Optimization (CRO) initiatives to drive double-digit improvements across
        all markets. You will enhance the entire campaign funnel, from landing
        pages and creative feedback loops to post-campaign analysis.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Drive automation &amp;amp;
        efficiency&lt;/strong&gt;: Lead workflow and marketing automation
        initiatives, enabling significant FTE savings and double-digit cost
        efficiencies&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Ensure Governance
        &amp;amp; Compliance&lt;/strong&gt;: Oversee marketing technology
        compliance, ensuring our stack and practices adhere to GDPR, Apple ATT,
        and other evolving global privacy regulations.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Enhance targeting &amp;amp;
        measurement&lt;/strong&gt;: Power our omnichannel campaigns with
        advanced targeting, CRM flows, and CDP segmentation. You will
        collaborate with central MarTech and AdTech teams to champion the
        development of custom bidding solutions and sophisticated measurement
        frameworks&amp;nbsp; etc.&lt;/li&gt; &lt;/ul&gt;
        &lt;h2&gt;&lt;strong&gt;What you’ll bring&lt;/strong&gt;&lt;/h2&gt;
        &lt;ul&gt; &lt;li&gt;An expert in marketing and product/solution
        development&lt;/li&gt; &lt;li&gt;You have solid experience in building
        data platforms at scale, leading a cross-functional team in an agile
        environment&lt;/li&gt; &lt;li&gt;Proficiency in making decisions based
        on data and are familiar with experimentation frameworks&lt;/li&gt;
        &lt;li&gt;Strong in problem-solving, with great attention to detail and
        the ability to translate technical capabilities into tangible business
        impact.&lt;/li&gt; &lt;li&gt;A natural hustler with a contagious
        “can-do” attitude who thrives in fast-paced environments&lt;/li&gt;
        &lt;li&gt;Analytically gifted with an ability to turn trends into
        actionable insights and hypotheses&lt;/li&gt; &lt;li&gt;Responsible,
        diligent and with a passion for owning projects from start to
        finish&lt;/li&gt; &lt;li&gt;At ease with engaging with other Directors
        and C-suite level executives to communicate&amp;nbsp; performance and
        its impact on the revenue and profitability of the
        business&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;At a
        minimum, you’ ll have&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;8+
        years of experience in product management, marketing technology, or
        performance marketing, ideally with a mix of product/solution-building
        and marketing expertise&lt;/li&gt; &lt;li&gt;Proven leadership
        experience managing cross-functional teams, with the ability to coach
        and grow high-performing specialists&lt;/li&gt; &lt;li&gt;Technical
        Expertise and strong understanding of:&lt;/li&gt; &lt;li&gt;Online
        &amp;amp; performance marketing platforms (Google Ads, Meta,
        Programmatic, etc.)&lt;/li&gt; &lt;li&gt;Tracking and attribution (SDK,
        server-to-server, SKAN, privacy frameworks)&lt;/li&gt; &lt;li&gt;Custom
        bidding and optimization solutions&lt;/li&gt; &lt;li&gt;Track record of
        leading product roadmaps, managing complex projects, and collaborating
        with engineering / cross-channel teams&lt;/li&gt; &lt;li&gt;Ability to
        balance long-term vision with short-term execution, leveraging data to
        inform decisions.&lt;/li&gt; &lt;/ul&gt;"
