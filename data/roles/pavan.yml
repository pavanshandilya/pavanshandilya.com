        lösungsorientiert.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Teamgeist:&lt;/strong&gt; Du arbeitest gerne mit
        unterschiedlichen Fachbereichen und Experten Teams zusammen und
        verstehst dich als verbindende Schnittstelle.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Sprachtalent:&lt;/strong&gt; Du verfügst über
        fließende Deutsch- und Englischkenntnisse in Wort und
        Schrift.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Darüber hinaus bist
        du:&lt;strong&gt;&amp;nbsp;#strategisch #kommunikationsstark
        #teamorientiert #eigenverantwortlich&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;Wenn du diesen Job spannend findest, dann ermutigen wir dich
        ausdrücklich zur Bewerbung, auch wenn du nicht jede oben gelistete
        Qualifikation aufweisen kannst.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Arbeiten bei WPP
        Media:&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Als WPP Media gestalten wir
        die Zukunft der Medien und investieren dabei konsequent in unsere
