        raised 2.4mn in pre seed and grant money and approach 1mn in annual
        revenues. Tasks About the role We are currently mainly focussing on
        outbound leads - but see so many inbound opportunities. From webinars
        with >100 participants, to clients recommending our tool to an invite to
        advise the chancellor on AI. Since there are no marketing experts in the
        team, we are not yet capturing these opportunities. And this is why we
        are looking for a new colleague 🎉 As always in early stage startups,
        your role will include adjacent tasks, e.g., PR, social media or
        branding. You will completely own marketing and work on strategic
        questions as well as operative initiatives. You will conduct events, own
        google and linkedin ads, set up our newsletter, and much more. You will
        not be expected to be an expert in every channel. You should be strong
        in the fundamentals, curious enough to learn quickly and able to decide
        what deserves focus. You come up with the ideas, launch them fast,
        measure what works and double down. You report directly to Ruth, our
        founder and CEO. Your challenge: Own messaging and branding. Decide how
        we explain what we do and why our target persona should care, and keep
        that story consistent everywhere. Run campaigns end to end. Scope them,
        ship them, measure and stop the ones that do not deliver. Open new
        segments. Build the positioning that lets us grow beyond our current
        customer base. Measure the funnel. Know where leads come from, what
        converts, and feed that back to sales and product. Requirements What you
        bring along Your profile: We are looking for a marketer who is
        comfortable starting from a blank page: Marketing experience: around 3-5
        years of hands-on B2B marketing experience, ideally in a startup,
        scale-up or similarly entrepreneurial environment. We care more about
        what you have built and learned than the exact number of years.
        Full-stack execution: You are equally happy writing a newsletter,
        briefing a landing page, setting up an ad account and standing at a
        booth. Analytical rigour: You know how to evaluate the success of your
        channels and can tell us the difference between a channel that generates
        noise and one that generates pipeline. Creativity and messaging
        instinct: You can generate the material and messages we need for the
        different channels. The material has to land with our German public
        sector audience. Language: Excellent German and English (C1). Fluent
        French, Italian or Spanish is a plus. Benefits What you can expect from
        us 💸 Competitive Compensation Package We value your skills and
        expertise - enjoy a salary that reflects your impact. 🚀 Ownership
        &#x26; Growth from Day One Take on responsibility from the start, tackle
        exciting challenges, and accelerate your career with a steep learning
        curve. 🛖 Offices in both German Startup cities Offices in both, Berlin
        and Munich. Your home office is Berlin, but you are welcome to work fro
        the Munich office anytime. 🎉 Team Events &#x26; Culture Join a vibrant
        team with fun social events, and a culture of open feedback and
        continuous learning. 💛 Exclusive Perks &#x26; Benefits Stay active with
        an EGYM Wellpass / Urban Sports Club membership, plus enjoy discounts on
        top sustainability brands and Bike Leasing. Admin: Time commitment:
        Full-time Start date: ASAP Location: Berlin 🤗 We have a few things that
        matter to us, but we are not looking for a perfect checklist candidate.
        If you have built things, learned quickly and can show your impact, we
        would love to hear from you, even if your background does not match
        every point. Your team lead will be Ruth (Founder and CEO) Find Jobs in
        Germany on Arbeitnow"
