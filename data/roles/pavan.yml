      company: GetMOW
      title: Short-Form Video & Content Creator (m/f/d)
      location: Berlin
      url: https://www.arbeitnow.com/jobs/companies/getmow/short-form-video-content-creator-berlin-348376
      updated_at: 1790710229
      description: "GetMOW is one of the companies being built at Cloud Studios, a
        product studio in Berlin. This role sits across the wider Cloud Studios
        ecosystem, not just GetMOW. Your main focus will be creating content
        around Cloud Studios, our team, our products and the reality of building
        companies from scratch. We’re not looking for someone to sit behind a
        laptop all day editing corporate videos. We’re looking for someone who
        walks into the office with a camera and sees content everywhere. A weird
        conversation becomes a video. A team moment becomes a recurring series.
        Something happens while building a company and you turn it into a story
        people actually want to watch. Think Kinso, HeyClicky, Cluely or SULT
        rather than traditional B2B marketing. Tasks Own short-form video
        content across Cloud Studios and its products, primarily for TikTok,
        Instagram Reels, YouTube Shorts and LinkedIn. Be in the office
        regularly, capturing what is actually happening rather than
        manufacturing everything from behind a desk. Turn everyday startup
        moments, conversations, failures, wins and chaos into entertaining
        content. Develop recurring formats, characters, series, office skits,
        interviews and social-first concepts. Write hooks, scripts and
        storylines that make people stop scrolling. Film and edit content from
        idea to finished post. Be comfortable getting in front of the camera
        yourself when the concept calls for it. Experiment constantly with
        formats, trends, storytelling styles and ideas. Help build Cloud Studios
        into a brand people want to follow, not just a company they know exists.
        Spend roughly 5 hours per week creating content specifically for GetMOW,
        turning topics like AI visibility, organic growth, experiments and the
        journey of building GetMOW into engaging content. Work closely with the
        founders and wider team, while having significant creative ownership
        yourself. The goal is simple: make content people would watch even if
        they had no idea what Cloud Studios or GetMOW was Requirements
        Important: This position is a mandatory internship (Pflichtpraktikum).
        You must be required to complete an internship as part of your
        university, school or educational programme and be able to provide
        confirmation of this. Beyond that, we care much more about your taste,
        creativity and energy than your CV. You’re probably a good fit if: You
        genuinely understand short-form content and internet culture. You
        naturally think in hooks, stories, formats and “this could be a video”
        moments. You have strong creative taste and can tell when something
        feels boring, forced or too corporate. You can film and edit short-form
        video confidently. You’re comfortable approaching people, asking
        questions and creating moments rather than waiting for them to happen.
        You’re willing to appear on camera yourself. You can work independently
        and turn an idea into something published without needing constant
        direction. You’re comfortable experimenting quickly and occasionally
        making something that completely flops. You speak fluent English. You
        can regularly work with us in person in Berlin. Ideally, you can join us
        for 4–6 months . You do not need years of professional experience or a
        perfect portfolio. Show us that you understand content and have the
        creative instinct to make things people want to watch. Benefits Real
        creative ownership from day one. You won’t just execute someone else’s
        content calendar. Direct access to the founders and the entire
        company-building process. A constant stream of things to film: products
        being built, ideas being tested, launches, failures, team moments and
        everything in between. Freedom to experiment with weird ideas, new
        formats and concepts. Work across Cloud Studios and products like GetMOW
        rather than being stuck creating content for one brand. Build a
        portfolio around content that actually gets published and tested in the
        real world. Work closely with a small, ambitious team in Berlin. The
        opportunity to take on significantly more responsibility as Cloud
        Studios grows. Potential to transition into a paid position after the
        internship , depending on performance, company needs and mutual fit.
        Please note: This is an unpaid mandatory internship (Pflichtpraktikum)
        If you’re looking for a traditional social media internship where
        someone hands you a content calendar and asks for three Reels a week,
        this probably isn’t it. We want someone who wants to build the content
        engine with us . Send us examples of things you’ve made, accounts you’ve
        worked on, or even content you simply think represents your taste. We
        care less about polished applications and more about seeing how you
        think creatively. If there’s a fit, we’ll start with a short
        conversation and take it from there. Find more English Speaking Jobs in
        Germany on Arbeitnow"
