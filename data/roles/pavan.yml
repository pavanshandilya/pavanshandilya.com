        revolutionieren und Bonität sowie Finanzdaten für unsere Nutzer:innen
        transparent und zugänglich zu machen, damit Menschen fundiertere
        finanzielle Entscheidungen treffen können. Dafür suchen wir dich als
        (Senior) Performance Marketing Manager in unserem dynamischen Team in
        Berlin. Ihre Aufgaben Als (Senior) Performance Marketing Manager (m/w/d)
        übernimmst du die Verantwortung für unsere bezahlten Marketingkanäle –
        von Search über Paid Social bis hin zu App-Marketing. Du arbeitest
        souverän mit Marketing, Product, Tech und Data zusammen, verstehst
        Zahlen, entwickelst eine klare Meinung und vertrittst sie überzeugend.
        Gemeinsam setzen wir Ideen in Kampagnen um, die unseren Nutzer:innen
        Mehrwert bieten. Planung, Umsetzung und Steuerung von
        Paid-Marketing-Kampagnen in den Bereichen SEA (Google Ads), ASA (Apple
        Search Ads) und Social Ads (Meta, TikTok etc.) – von der Konzeption bis
        zur laufenden Optimierung Kontinuierliche Analyse und Optimierung der
        Kampagnen Performance auf Basis von CPL, CPA, ROAS und weiteren
        Kennzahlen Konzeption, Durchführung und Auswertung von A/B-Tests für
        Anzeigen, Zielgruppen und Landingpages Zusammenarbeit mit Content-,
        Design- und Produktteams zur Umsetzung konsistenter, performance
        orientierter Kampagnen Erstellung und Auswertung von KPI-Reports sowie
        Ableitung operativer und strategischer Maßnahmen Nutzung von Google
        Analytics, Adjust, Appsflyer und ähnlichen Tools zur präzisen
        Datenanalyse Beobachtung relevanter Entwicklungen und Trends im
        Performance Marketing sowie Integration neuer Ansätze in den
        Arbeitsalltag Anforderungen 3–5 Jahre Erfahrung im Performance- oder
        Growth-Marketing, idealerweise im Bereich Digital Products oder FinTech.
        Nachweisbare Erfolge in der Steuerung und Optimierung von SEA-, ASA- und
        Social Ads-Kampagnen. Ausgeprägte analytische Fähigkeiten sowie
        praktische Erfahrung mit Analytics, Dashboards und KPI-Reporting.
        Sicherer Umgang mit Excel/Google Sheets und Freude daran, aus Daten
        klare Erkenntnisse abzuleiten. Unternehmerisches Denken und ein gutes
        Gespür für den effizienten Einsatz von Marketingbudgets unter
        Berücksichtigung kurzfristiger Kundenakquisekosten (CAC) und des
        langfristigen Kundenwerts (LTV). Eine eigenverantwortliche, operative
        Arbeitsweise, Neugier und die Fähigkeit, deine Empfehlungen überzeugend
