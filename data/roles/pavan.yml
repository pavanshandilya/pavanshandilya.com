        Direct-Response-Marketing über Meta Ads. Ein hoher ROAS ist für uns kein
        Ziel – meistens ist er ein Zeichen dafür, dass zu wenig ausgegeben wird.
        Wir steuern auf Wachstum: Neukunden, CM3, aMER, MER und ein CAC, der
        sich am Kundenwert misst. Wenn du ohnehin in Deckungsbeiträgen und
        CAC/CLV denkst statt in Plattformkennzahlen, ist das hier dein Standard.
        Wenn nicht, ist es die falsche Stelle. Wir suchen jemanden, der den
        kompletten Funnel von der Ad über das Offer und die Landingpage bis zum
        Kauf als ein System versteht, systematisch testet und Budget dorthin
        bringt, wo es profitables Wachstum erzeugt – auch wenn das auf
        Plattformebene erstmal unbequem aussieht. Aufgaben Deine Aufgaben Media
        Buying auf Wachstum steuern: Du verantwortest unsere Paid-Social-Konten
        eigenständig – Budget, Kampagnensetup, Adsets, Creatives einbuchen. Du
        skalierst, solange die Unit Economics tragen, und skalierst nicht, um
        Plattformmetriken zu schonen. Full-Funnel-Diagnose: Du analysierst
        regelmäßig den gesamten Weg von Ad über Offer und Landingpage bis zur
        Conversion, findest den größten Engpass und priorisierst genau dort.
        Creative Testing &#x26; Creative Diversity: Du entwickelst
        Testhypothesen, bewertest Creative-Performance und sorgst dafür, dass
        das Konto nicht von zwei Winning Ads abhängt: verschiedene Angles,
        Formate, Creator und Hooks parallel im Test, damit Skalierung nicht an
        Creative Fatigue scheitert. Learnings gehen konkret und datenbasiert an
        Creative Strategist und Copywriting zurück. Offer- und Landingpage-Tests
        koordinieren: Du priorisierst den Test-Backlog für Bundles, Preislogik,
        Value Stack, Message-Match und Landingpage-Struktur, briefst die
        Fachteams, wertest aus und rollst Gewinner aus. Steuerung nach
        Gesamtwirtschaftlichkeit: Deine Entscheidungsgrundlage sind Neukunden,
        CM3, aMER, MER und CAC im Verhältnis zum Kundenwert – nicht der ROAS
        einer einzelnen Kampagne. Attribution &#x26; Datenqualität: Du liest
        Performance nicht aus dem Ads Manager, sondern aus unserem
        Attributionsmodell. Du weißt, wo Plattform-Attribution und Realität
