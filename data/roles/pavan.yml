      description: 'talenthafen steht für Exzellenz im modernen Recruiting. Wir sind
        eine strategische Beratung und ein Systemhaus für
        Arbeitgeberpositionierung und Personalgewinnung – mit technologischer
        Tiefe, klaren Systemen und operativer Umsetzungskraft. Im DACH-Raum
        zählen wir zu den führenden Unternehmen in unserem Segment.
        Mittelständische und große Organisationen wie die Voets Gruppe,
        Westfalen und die Nord-Ostsee Sparkasse vertrauen auf unsere Expertise,
        wenn es darum geht, sich nachhaltig als relevanter und zukunftsfähiger
        Arbeitgeber zu positionieren. Unser Anspruch ist es nicht, dem Markt zu
        folgen – sondern ihn aktiv mitzugestalten. talenthafen ist Vorreiter in
        der Innovation des Recruitings. Wir leben Fortschritt. Wir entwickeln
        eigene Systeme, implementieren Automatisierungen und integrieren
        künstliche Intelligenzen konsequent in unsere internen Prozesse und
        Kundenstrukturen. Dadurch schaffen wir skalierbare, messbare und
        nachhaltige Lösungen – und setzen neue Standards in der Branche. Hinter
        diesem Anspruch steht ein starkes Fundament: Ein Team von über 60
        ambitionierten Persönlichkeiten , die unternehmerisch denken,
        Verantwortung übernehmen und sich kontinuierlich weiterentwickeln
        wollen. Auf mehr als 900 m² Bürofläche in Hamburg-Bahrenfeld entsteht
        täglich die nächste Stufe moderner Personalgewinnung - sowohl menschlich
        als auch technisch. Was uns besonders macht, ist nicht nur unsere
        Marktposition und Software, sondern die Qualität unseres Teams. Wir
        arbeiten leistungsorientiert, professionell und mit klaren Standards.
        Hohe Ansprüche treffen bei uns auf hohe Wertschätzung:
        überdurchschnittliche Vergütung, echte Entwicklungsperspektiven und ein
        Umfeld, in dem Exzellenz gefördert wird. talenthafen ist kein
        klassisches Recruiting-Unternehmen. Wir kombinieren Performance
        Marketing mit unserer eigenen Tech-Plattform talenthafenOS – über 70
        automatisierte Workflows, die den HR-Markt neu definieren. Bootstrapped,
        profitabel, dreistelliges Wachstum. Du arbeitest an der Schnittstelle
        von Beratung und Technologie, in einem Markt, der gerade komplett
        umgebaut wird. Deine Rolle: Recruiting-Kampagnen mit talenthafenOS
        aufsetzen, betreuen und optimieren. Du kümmerst dich um das, was am Ende
        über den Erfolg entscheidet – die Performance. Aufgaben Dein Daily
        Business Volle Ownership für deine Kundenaccounts. Du steuerst
        Paid-Kampagnen auf Meta, Google & Co. für unsere Top-B2B-Kunden – von
        Zielgruppe über Funnel bis Skalierung. Der Erfolg der Kampagne ist deine
        Verantwortung, nicht die von „dem Team" Proaktives
        Performance-Management. Du wartest nicht auf Reports oder Anweisungen –
        du erkennst, wenn eine Kampagne aus dem Ruder läuft, bevor sie zum
        Problem wird, und steuerst gegen Enge Zusammenarbeit mit den anderen
        Abteilungen. Die Strategieberater halten den Kundenkontakt und geben dir
        den nötigen Kontext – du übersetzt ihn in Kampagnen, die liefern. Kurze
        Wege, klare Absprachen, gemeinsame Verantwortung fürs Ergebnis
        Kanalübergreifendes Creative- und Zielgruppen-Denken. Du denkst nicht in
        Plattform-Silos, sondern in Zielgruppen, Botschaften und Hooks – und
        verstehst, wie Creative, Targeting und Daten zusammenspielen Reindenken
        in Kunden. Jeder Kunde hat einen eigenen Markt, eigene Zielgruppen,
        eigene Engpässe. Du verstehst das Geschäft deiner Kunden so gut, dass
