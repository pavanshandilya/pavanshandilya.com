        Marketing von FinTech- oder Finanzdienstleistungen. What we offer Die
        Möglichkeit, von Tag eins an Verantwortung zu übernehmen und eigene
        Ideen für einzubringen. Die Chance, in einem dynamischen und flexiblen
        Scale-Up-Umfeld zu wachsen Ein persönliches Weiterbildungsbudget für
        Coachings und Trainings. 30 Urlaubstage Zugang zu einer
        Mental-Health-Plattform Zuschüsse für BVG und UrbanSportsClub /
        ClassPass Wir setzen uns für Chancengleichheit und ein
        diskriminierungsfreies Arbeitsumfeld ein. Alle Mitarbeitenden und
