        Experten für den deutschen Mittelstand zu positionieren. Die Rolle im
        Detail: Du lernst, wie man LLMs nutzt, um aus Experten-Briefings
        hochwertige Artikel zu erstellen, die genau unseren Tone of Voice
        treffen. Du unterstützt uns dabei, unsere Strategie für lokale
        Landingpages umzusetzen, damit wir in jeder wichtigen deutschen Stadt
        optimal gefunden werden. Du hilfst dabei, unsere Seiten für
        Suchmaschinen verständlicher zu machen – von der Pflege von Meta-Daten
