      company: beyonnex
      title: (Junior) Agile Coach (m/f/d)
      location: Germany
      url: https://jobicy.com/jobs/139943-junior-agile-coach-m-f-d
      updated_at: 2026-02-27T03:35:08+00:00
      description: "We support our customers in making buildings more
        climate-friendly, more comfortable and more affordable with connected
        real estate, simple products and high processing and service quality. We
        provide our customers with efficient, tailored processes and
        applications for operating IoT infrastructures in real estate, as well
        as our flexible Enterprise-IoT-Suite, in which we manage data from many
        millions of sensors into intelligent products and services. With a team
        of product and IT experts, you will be enabling the development of
        beyonnex&#8217; Enterprise-IoT-Suite (bxSUITE) and services to ensure a
        stable and scalable technological foundation for the strategic
        development of the group of companies. You will drive a culture which
        helps us focussing on our customers benefits through continuous
        improvement. As (Junior) Agile Coach at beyonnex you will mainly act in
        two roles: In a Team Coach role you will be working with our development
        teams that are building new products for the beyonnex ecosystem. You
        will foster an environment for effective work and enable the team to
        self-organize and hold each other accountable. In addition you will be
        responsible to mediate conflicts and drive technical, business and
        transformation excellence within the teams. In an Agile Coach role you
        will support collaboration within beyonnex across multiple teams,
        supporting the teams to resolve dependencies and enabling the flow of
        information. You will work together with the other coaches to identify
        and resolve systemic issues and impediments and to ensure overall flow
        of work across the bxSUITE. Beyond these roles you will be supporting
        our group-internal client as needed, together with our enterprise coach.
        The position is fixed-term for nine months, with the option of
        extension. You have initial experience as a Scrum Master and/or Agile
        Coach or you are are about to finish your studies in business
        psychology, project management or related fields. You move forward
        courageously, don’t shy away from new approaches and experiments, and
        you encourage your team to act in the same way. You are curious and
        eager to continuously explore new knowledge on the job. Your heart beats
        agile: You exemplify the agile mindset and thereby inspire your
        colleagues. You have good communication skills in German and English
        (C1), and enjoy networking. You live in the northern half of Germany and
        are open to travelling to our head office in Hamburg from time to time.
        Ideally, you have knowledge of and initial practical experience with the
        Kanban method. We have a modern environment with flat hierarchies. Our
        colleagues very often highlight our great spirit to achieve our goals.
        Our company is a place to be yourself, aim high, taking care of each
        other and growing without limits. Additionally, we offer following
        benefits: Modern hardware and the opportunity to work with cutting-edge
        technologies Besides our 100% remote work possibility, we offer an
        office in Hamburg (Hammerbrook) and Munich for a more personal
        collaboration Space and budget for personal growth Flexible working
        hours 30 days vacation Events for employees to celebrate our achieved
        goals and great team-spirit Community of Practice and Knowledge Nuggets
        for improving your skills Corporate Benefits and Mental Health Programme
        JobRad-Leasing Coffee, tea and water for free in our office If you are
        interested in the role, this is they way how to proceed: Send us your
        CV, feel free to optionally add some references. We will screen your CV
        and send you an invitation for a first interview with our Agile Lead.
        After that and if we agree to move on, we will schedule an interview
        with colleagues from our coaches team. In that interview you will find
        out why we love working at beyonnex, and we will be answering all your
        questions as well as getting to know you a bit better. If you and us
        decide to move forward, you will have a final interview with one or two
        other colleagues, and our Agile Lead for final questions. We will do our
        best to move as fast as possible with the application process and our
        decision, as we value your time. In case you have any questions about
        the offered position, your application or the application process, send
        us an email to jobs@beyonnex.io ."
