      description: "OVERVIEW TransPerfect helps the world's leading brands thrive in
        the global marketplace by offering a full range of solutions to ensure
        the success of digital and mobile initiatives. Working in 170+
        languages, our services include website and software localization, QA
        and testing, international SEO/SEM, customer service and call center
        solutions, multicultural marketing, multimedia services, and more.
        RESPOSIBILITES: TransPerfect is seeking a Technical Product Manager to
        manage and own the product lifecycle for integration frameworks for CMS
        &amp; e-commerce systems. This position will work with internal
        development and QA teams and vendor partners to build integrations into
        GlobalLink - our flagship cloud-based translation management platform.
        We are looking for forward-thinking professionals who are more
        interested in how things could become and who can thrive in an evolving
        and fast-paced environment. Manage the entire product life cycle which
        includes: Manage professional services engagements and prepare SOWs for
        all existing customers Explore product functionality and recommend best
        strategy to integrate Evaluate APIs and GraphQL endpoints and devise an
        integration approach Individually carry out product deliveries from
        inception to product roll out Design/create detailed technical
        specifications for functional requirements Closely monitor development
        and QA progress for ontime deliverables Do active review of test
        strategy Planning continuous upgrades for new features Collaborate with
        multiple teams in multiple time zones including product managers,
        engineers, solutions engineers, QA and customers for product strategy
        &amp; roadmap. Participate in UI/UX design. Review Documentation updates
        Analyze application logs and debug technical issues to identify root
        causes in collaboration with engineering teams Perform competitor
        analysis and benchmarks and ensure that your product is always ahead of
        the curve"
