      description: "Data quality is the bottleneck of the AI era. Every Fortune 500 is
        trying to solve it. We're the team they call. Soda is the data quality
        layer for Disney, Ralph Lauren, CBRE, HelloFresh, 2K Games, and Nubank.
        Our open-source engine, Soda Core, is used by companies like Tesla,
        Slack, Adyen, Walmart, and JPMC. The category is growing fast because AI
        doesn't work on bad data, and we're hiring a Senior Growth Product
        Manager to get customers using Soda faster and on more of their data.
        About Us Soda's mission is to monitor the world's decisions. We're
        building the first Data &amp; AI performance monitoring platform that
        spans data collection to automated decision-making. Soda helps customers
        find, understand, and fix data quality issues by combining automated
        post-production monitoring with pre-production pipeline data testing.
        Soda was founded in 2019 by Maarten (employee #5 at Collibra) and Tom
        (creator of multiple open-source projects generating hundreds of
        millions in value). We commercialize through Soda Cloud and we're
        well-funded, with investors like Point 9 Capital, Hummingbird, Singular,
        and Eurazeo. The Role You'll lead our adoption team, a small group of
        frontend, full-stack, and AI engineers. The team works on onboarding and
        activation, on keeping workflows coherent across the product, on
        customer-facing dashboards, and on AI features that save users work.
        Most of our roadmap is driven by what customers and prospects ask for.
        This team's work is driven by adoption metrics, because customers rarely
        ask for the things that would make them use Soda more. You'll start from
        a hypothesis, for example that changing a flow will get 20% more data
        contracts created, ship the change, and check whether it worked. We sell
        to enterprises, so sample sizes are small and A/B tests rarely reach
        significance. You'll use product analytics, session replays, and
        conversations with users, and you'll often have to decide with
        incomplete data. This is a product role. If most of your growth
        experience is in paid acquisition or lifecycle email, it's probably the
        wrong fit. You'll also work closely with our Growth team, which is led
        by a co-founder, on launches and messaging. What You'll Do Own the
        adoption metrics for Soda Cloud: time to first verified contract for new
        accounts, data coverage (datasets with contracts and monitors), weekly
        active datasets and users, and usage of AI features. You'll define them,
        make sure we can measure them, and improve them. Own the UX of workflows
        across the product and keep them coherent for our two kinds of users:
        data engineers, and business users such as data stewards and governance
        leads. Find where customers get stuck between signing the contract and
        running Soda on most of their data, and decide what to fix first. Design
        and ship onboarding flows that get a new team to first value within
        days, including self-serve paths for technical teams that want to
        evaluate Soda on their own. Put AI to work on adoption: decide which
        steps an agent should do for the user, ship them with the team, and
        measure whether people keep using them. Work with Growth on launches and
        product marketing, and with our customer engineers on whatever is
        blocking rollouts at customers. Hiring Process Application: your CV,
        plus a short answer about one metric you moved (what it was, what you
        shipped, what happened, and what didn't work) 15-minute phone screen
        First interview (60 min): a deep dive into product growth work you've
        done. Part of it is showing us something you shipped that you'd still be
        proud to demo. Second interview (60 min): a working session on a real
        Soda adoption problem Culture fit (45 min) We answer every application,
        and every candidate hears back within 3–5 days of each step. If it's not
        a hell yes, it's a no, and we'll tell you quickly and kindly.
        Requirements You Should Have 5+ years in product, including at least 2
        owning growth, activation, onboarding, or adoption in B2B SaaS : you
        were accountable for a metric for long enough to see whether your
        changes worked. In your application, tell us which metric it was, where
        it started and where it ended, what you shipped, and what didn't work.
        Product craft and taste : you love software and have used a lot of it
        yourself, so you know what a good product feels like. You keep scope
        small, work in short cycles with engineers and designers, run your own
        customer calls, and have well-reasoned opinions about UX. An AI-native
        way of working and building : you've shipped an AI-powered feature and
        measured whether people use it, you prototype with coding agents (Claude
        Code, Codex, etc.), and you're happy to open a small PR yourself for
        something like a copy change. You do your own analysis : you write SQL,
        build funnels yourself, and know when a sample is too small to conclude
        anything. Experience with technical products : you've built for
        engineers or data teams and are comfortable talking about pipelines,
        warehouses, and APIs. Clear writing and comfort working async : we're a
        distributed team across 12+ countries, and most decisions happen in
        writing, in English. The five years don't all have to be in a PM role.
        If you were a product engineer or a founder and owned a growth metric,
        please apply. Good to Have Data quality, data observability, data
        governance, or data infrastructure experience. Experience with
        product-led growth at a company that also sells to enterprises.
        Experience with Shape Up or another fixed-time, variable-scope way of
        working. Benefits What We Offer Compensation €120,000–140,000/year +
        equity. Outside Belgium, this is a contractor position. Fully remote
        (EU-based), with a Belgian office available if you want one. In-person
        kickoffs every two months in cool locations across Europe, three days
        with the whole product and engineering team. All the tokens you need,
        across all frontier models. Real ownership, real impact, no
        micromanagement. A senior team that ships, across 12+ countries. Our
        Values We value freedom with responsibility, transparency, and a growth
        mindset. We avoid politics, have no tolerance for dishonesty, and value
        open and direct communication without judgment. We proactively bring up
        and address potential issues before they become critical, and we
        overcommunicate frequently. Working at Soda, you will have full autonomy
        to make impactful product and roadmap decisions. ❤️ Why you will love to
        join Soda You own the adoption metrics : you decide how we measure
        adoption and what we do to improve it. Lots of room to improve : we
        already have enterprise customers and usage data, and we've done very
        little growth work so far. Your own engineering team : you'll work with
        dedicated engineers who build agentically, so your ideas get shipped
        quickly. Be part of a transformation : data quality is having its
        moment, and we're at the front of it. Work on your own terms : fully
        remote, flexible hours, colleagues in 12+ countries. 😡 What you might
        not love Rapidly changing priorities : our roadmap can pivot quickly.
        It's a fast-paced environment with a LOT of work to be done. Small
        numbers : we have relatively few accounts and feedback is slow. If
        you're used to deciding from consumer-scale data, you may find that
        frustrating. No playbook : this is the first dedicated growth PM role at
