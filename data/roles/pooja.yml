        data-end=&quot;1502&quot;&gt;Set and drive a focused roadmap that
        combines quick wins with long-term innovation&lt;/li&gt; &lt;li
        data-start=&quot;1505&quot; data-end=&quot;1605&quot;&gt;Consolidate
        onboarding learnings, customer insights, and market context to guide
        product decisions&lt;/li&gt; &lt;li data-start=&quot;1608&quot;
        data-end=&quot;1709&quot;&gt;Improve key metrics like usage rates,
        satisfaction scores, and activation across reporting features&lt;/li&gt;
        &lt;li data-start=&quot;1712&quot; data-end=&quot;1811&quot;&gt;Build
        strong internal alignment and communicate product value clearly to
        Sales, CS, and GTM teams&lt;/li&gt; &lt;li data-start=&quot;1814&quot;
        data-end=&quot;1918&quot;&gt;Ensure commercial success by helping Sales
        and CS articulate differentiated analytics value to customers&lt;/li&gt;
        &lt;/ul&gt; &lt;p data-start=&quot;1920&quot;
        data-end=&quot;1958&quot;&gt;&lt;strong data-start=&quot;1920&quot;
        data-end=&quot;1956&quot;&gt;What you will bring to the
        table&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li
        data-start=&quot;1961&quot; data-end=&quot;2056&quot;&gt;Strong
        strategic thinking with the ability to balance long-term vision with
        near-term results&lt;/li&gt; &lt;li data-start=&quot;2059&quot;
        data-end=&quot;2151&quot;&gt;High ownership mindset with a proactive
        approach to removing blockers and driving progress&lt;/li&gt; &lt;li
        data-start=&quot;2154&quot; data-end=&quot;2257&quot;&gt;Proven ability
        to collaborate cross-functionally with Sales, CS, Data Science, Legal,
