      updated_at: 2026-10-27 20:27:22 UTC
      description: "Ready to become part of the most important mission on this planet?
        We are rebuy, pioneers in the sustainable reuse of electronics and
        media, and we are looking for you! Our mission: to make circular living
        accessible to all, one transaction at a time. By giving products a
        second chance, we reduce resource consumption and avoid unnecessary
        e-waste. Our global team of 500 drives things forward collaboratively,
        takes personal responsibility, values constructive critical thinking,
        and is dedicated to serving our customers and planet. The Role We are
        looking for a Product Manager to join our Product team and own the
        internal, backend-heavy products behind our operations. Every item rebuy
        sells has been through our hands. Before a pre-owned book, DVD, or game
        reaches a customer, it has been bought in, received, identified, tested,
        graded, stored, picked, packed, and shipped. The systems that run this
        flow are the focus of this team, and the users are the hundreds of
        colleagues in our operations teams. You will own the tools and services
        behind inbound processing, grading and quality control, fulfillment, and
        returns. Your users are warehouse operators, graders, pickers, and
        operations leads. Your customers are, in the end, every rebuy buyer and
        seller who relies on the condition and delivery promise we make. For
        this role we need someone who is genuinely detail-oriented, who reads
        the data before forming an opinion, who understands systems and data
        flows end-to-end, and who can translate operational reality into precise
        requirements and measurable outcomes. As a Product Manager you work hand
        in hand with operations leadership, team leads, engineering, and data to
        deliver measurable efficiency and quality improvements. You will spend
        time on the floor with the people who use your products, translate their
        goals and constraints into a roadmap you own, build the business case
        with unit economics together with operations and finance, and negotiate
        scope and timing with engineering. Improvements are co-created with the
        people who run the operation, not handed to them. Key Responsibilities:
        Drive domain product roadmap: Translate ops strategy (throughput, unit
        cost, quality, lead time) into a 6–12 month roadmap with the Strategy
        Manager and Ops Product Lead. Make and document trade-off decisions with
        ops leaders Understand operational reality: Spend time at the warehouse
        mapping processes and data flows end-to-end to uncover system gaps and
        unmet needs early Drive data-backed decisions: Analyze KPIs, pull data,
        avoid measurement traps, and connect feature changes to unit economics
        improvements Write precise requirements: Specify business rules, edge
        cases, data models, state transitions, integrations, and failure modes
        for engineering Ship iteratively without disruption: Sequence releases
        safely using pilots, feature flags, parallel runs, change management,
        and pre-defined metrics Collaborate across teams: Engage in technical
        discussions and manage scope, time, and urgency trade-offs with tech and
        ops leads Build stakeholder buy-in: Align ops, CS, tech, finance, and
        leadership on shared metrics via clear written communication"
