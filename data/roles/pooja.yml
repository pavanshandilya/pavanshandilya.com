      updated_at: 1793537716
      description: "&lt;div
        class=&quot;content-intro&quot;&gt;&lt;p&gt;&lt;strong&gt;We are the
        platform turning browsing into shopping&lt;/strong&gt;. We connect 200
        million shoppers with deals they love while boosting local sales for
        hundreds of top retailers and brands.&lt;/p&gt; &lt;p&gt;We help
        consumers save time and money while making smart shopping decisions, and
        we support retailers and brands in engaging customers from online
        research to in-store purchases.&lt;/p&gt; &lt;p&gt;In 2024, Shopfully
        joined forces with the North American company &lt;a
        href=&quot;https://corp.flipp.com/&quot;&gt;Flipp&lt;/a&gt;, creating a
        global leader in the sector. Together, we reach 400 million households
        and serve over 1,000 top retailers and brands across 27 markets,
        including Europe, Canada, the USA, Latin America, and
        Australia.&lt;/p&gt; &lt;p&gt;Ready
        to&amp;nbsp;&lt;strong&gt;spark&lt;/strong&gt; your growth with
        us?&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;WHO WE LOOK
        FOR&lt;/strong&gt;&lt;strong&gt; 🦄&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;Flipp + Shopfully’s Product team focuses on driving adoption
        and revenue of our products by identifying the biggest market
        opportunities, building the case for investing in them, and shipping
        solutions with engineering, all while representing the voice of our
        merchant customers.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;About the
        role&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;The Senior Product Manager is a
        senior, commercially minded product leader who already understands
        digital advertising. This role requires a strong strategic thinker with
        good business sense and solid hands-on product skills who leads
        opportunity identification, builds decision-ready business cases, and
        works with engineering to ship.&lt;/p&gt; &lt;p&gt;You will work closely
        with Sales, Engineering, Data, and Marketing teams across markets to
        align on key business objectives. By combining market insight, customer
        feedback, and industry trends, you will make sure our products resonate
        with merchants and drive growth. We’re looking for someone who can ramp
        up quickly and contribute independently.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;WHAT YOU WILL DO &lt;/strong&gt;🏄&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Market Understanding and Opportunity
        Identification&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Work with
        Product Marketing, Sales Engineering and customer-facing teams to
        understand customer needs and prioritize the opportunities that matter
        most.&lt;/li&gt; &lt;li&gt;Find the highest-leverage areas to invest in,
        and weigh customer demand against our resources, capabilities and
        strategic direction.&lt;/li&gt; &lt;li&gt;Turn complex questions into
        clear priorities. For example: how do we create more value for retail
        partners as their strategies move toward e-commerce? How do we find and
        build opportunities at scale as products launch in new
        markets?&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Business Cases
        and Strategy&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Build
        business cases that size opportunities, weigh revenue trade-offs, and
        structure a clear recommendation so leadership can make a
        decision.&lt;/li&gt; &lt;li&gt;Own your recommendations, and be ready to
        explain them and adapt them as you learn.&lt;/li&gt; &lt;li&gt;Lead the
        strategy for how our products differentiate from competitors in the
        market.&lt;/li&gt; &lt;li&gt;Partner with Sales and Finance on pricing
        and monetization so our offering stays cohesive.&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&lt;strong&gt;Product Discovery and
        Delivery&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Lead discovery
        with merchants, advertisers, and internal teams to define problems worth
        solving.&lt;/li&gt; &lt;li&gt;Prioritise ruthlessly, balancing revenue
        impact, effort, and strategic fit.&lt;/li&gt; &lt;li&gt;Work hands-on
        with engineering to define requirements and ship, from alpha and testing
        through broad launch.&lt;/li&gt; &lt;li&gt;Partner with Sales and
        Marketing on launch timing and readiness, and run retrospectives on past
        launches to improve future ones.&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&lt;strong&gt;Alignment and Stakeholder
        Management&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Generate
        cross-functional alignment (Engineering, Data, Sales, Marketing,
        Content) with a shared focus on goals and timing.&lt;/li&gt;
        &lt;li&gt;Work across markets and levels of seniority, including senior
        leadership, with confidence.&lt;/li&gt; &lt;li&gt;Track progress and
        impact of product initiatives and communicate results
        clearly.&lt;/li&gt; &lt;li&gt;Build relationships with industry
        analysts, partners, and customers, and represent Flipp + Shopfully at
        conferences and industry events where relevant.&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;WHAT YOU WILL
        NEED&lt;/strong&gt;&lt;strong&gt; &lt;/strong&gt;🪄&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Must-haves&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;
        &lt;li&gt;&lt;strong&gt;Digital advertising foundations:&lt;/strong&gt;
        supply vs. demand, how exchanges, SSPs, and DSPs work, programmatic
        bidding, pricing models (CPM, CPC, CPV), and fill rate and yield.
        Ideally gained in ad tech, a retail media network, a publisher, or a
        marketplace.&lt;/li&gt; &lt;li&gt;Proven experience building business
        cases: sizing opportunities, weighing revenue trade-offs, and
        structuring recommendations for decisions.&lt;/li&gt; &lt;li&gt;High
        autonomy: you figure things out, own the outcome and don’t need close
        management.&lt;/li&gt; &lt;li&gt;Genuine excitement about using AI tools
        and rethinking how work gets done.&lt;/li&gt; &lt;li&gt;Hands-on product
        skills: discovery, prioritisation, and working with engineering to ship,
        not only strategy.&lt;/li&gt; &lt;li&gt;Stakeholder management, with the
        confidence to work across markets and levels of seniority.&lt;/li&gt;
        &lt;li&gt;A scrappy, curious and confident approach. You’re hungry to
        make an impact.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;👉 At our company, we
        value diversity and actively encourage it — we believe a variety of
        perspectives and backgrounds makes us stronger. We focus on potential
        rather than on having a “perfect” CV. If this role excites you and you
        believe you could grow into it — even if you don’t tick every single box
        in the requirements — we’d love to hear from
        you!&lt;br&gt;&lt;br&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;NICE TO
        HAVE&amp;nbsp; &lt;/strong&gt;&lt;strong&gt;🎆&lt;/strong&gt;&lt;/p&gt;
        &lt;ul&gt; &lt;li&gt;Retail, CPG, or retail media background&lt;/li&gt;
        &lt;li&gt;Multi-market experience&lt;/li&gt; &lt;li&gt;Can speak Italian
        or German&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;LOCATION 🌐&lt;/strong&gt;&amp;nbsp;&lt;/p&gt;
        &lt;p&gt;While we have offices in Milan, Berlin, Barcelona, you can
        benefit from our flexible hybrid model (full remote available),
        empowering you to work where you&#39;re most effective.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;HOURS&amp;nbsp;&lt;/strong&gt;⏰&lt;br&gt;Your
        manager and several partner teams are in North America, so you’ll need
        to be flexible about working some later hours, beyond a standard 9-5
        CET.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;WHAT
        YOU WILL FIND AT SHOPFULLY&lt;/strong&gt;&lt;strong&gt;
        🤗&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;🌎 An opportunity to thrive in a
        rapidly scaling multinational company&lt;/p&gt; &lt;p&gt;🕶️ A vibrant,
        informal, and inclusive work environment&lt;/p&gt; &lt;p&gt;🧠 We
        champion autonomy, flexibility, and a hybrid work model, empowering you
        to own your work&lt;/p&gt; &lt;p&gt;📚 Access to learning opportunities
        and regular feedback sessions&lt;/p&gt; &lt;p&gt;🍓 Enjoy our central,
        modern offices featuring fresh snacks, coffee (including vegan
        options!), and ergonomic setups&lt;/p&gt; &lt;p&gt;🎉 Engage in
        meaningful team events: offsites, happy hours, company parties and
        celebrations that unite us beyond daily tasks&lt;/p&gt; &lt;p&gt;💻We
        provide all the necessary equipment for you to work effectively and set
        up your workspace, wherever you are&lt;/p&gt; &lt;p&gt;🧰 Benefit from
        additional country-specific advantages based on local contracts and
        practices&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;WHO WE ARE &lt;/strong&gt;💜&amp;nbsp;&lt;/p&gt;
        &lt;p&gt;We’re a team of 450 people (and counting!), from 30 different
        nationalities. We’re on a mission to innovate, and we believe the key to
        that is seeing the world through a variety of perspectives. That’s why
        building a more diverse team, as well as bringing in even more talent,
        is so important for us.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;TO FEEL AT HOME 🛋️ IN SHOPFULLY YOU NEED
        🎯&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Progress
        Over Perfection&lt;/strong&gt;: We move forward. Always. In a
        fast-moving world, speed with purpose beats certainty without action.
        Momentum matters—not for its own sake, but because it drives
        results.&lt;/li&gt; &lt;/ul&gt; &lt;ul&gt;
        &lt;li&gt;&lt;strong&gt;Clarity Through Transparency&lt;/strong&gt;: We
        bring each other along. We work in teams, not silos. Transparency gives
        context, and context enables action. That means we share decisions
        early, publish work in progress, and document outcomes so others can
        learn, move faster, and build better.&lt;/li&gt; &lt;/ul&gt; &lt;ul&gt;
        &lt;li&gt;&lt;strong&gt;Learn Loudly&lt;/strong&gt;: We grow by doing
        and by daring. Big bets unlock big breakthroughs. But real innovation
        demands risk, and risk always carries the possibility of failure. That’s
        not a flaw. It’s the price of ambition.&lt;/li&gt; &lt;/ul&gt;
        &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Challenge with
        Empathy&lt;/strong&gt;: We speak up, even when it’s hard—because candor
        shows care, and leads to better outcomes. Listening deeply is how we
        grow. Disagreeing openly is how we build trust.&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&lt;strong&gt;Always Build Better: We are builders—of products,
        systems, and ideas. But more than that, we are builders of better.
        Better has no finish line. It’s a
        mindset.&lt;/strong&gt;&lt;br&gt;&lt;br&gt;&lt;br&gt;&lt;/p&gt;
        &lt;p&gt;&lt;br&gt;&lt;em&gt;If you choose to apply for this specific
        job position and submit your application, which may include personal
        data such as your identifying details, contact information, curriculum
        vitae, cover letter, professional qualifications, and/or employment
        history, please be informed that your data may be shared with our
        Affiliates*, including Offerista Group GmbH and Flipp Operations Inc.
        The aforementioned entities will act as joint controllers for the
