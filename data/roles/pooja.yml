        TransPerfect is today recognized as the largest translation and language
        services company in the world with thousands of employees located in
        100+ offices around the world – and over $1 billion in revenue in 2023.
        &nbsp; The TransPerfect TechOps team has been a vital part of the
        company’s success since its formation 10 years ago – delivering
        technology and services that have drastically simplified the lives of
        our clients and colleagues – from workflow improvements for colleagues,
        to core services that form the basis of the company’s GlobalLink
        platform, to creating scalable client interfaces that allow novice users
        to navigate complex ecosystems. DESCRIPTION
