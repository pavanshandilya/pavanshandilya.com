        tech environment, with a track record across the full product
        lifecycle.&lt;/li&gt; &lt;li&gt;Proven experience or strong interest in
        Trust &amp;amp; Safety, Security, Registration/Onboarding, Bot
        Detection, Identity, Parental Controls, Compliance, or Fraud/Abuse
        Prevention.&lt;/li&gt; &lt;li&gt;A strong self-starter who thrives in
        ambiguous environments, bringing structure, defining scope, and
        translating complex concepts into actionable product steps.&lt;/li&gt;
        &lt;li&gt;Deeply member-centric with an analytical mindset, skilled at
        using qualitative insights and quantitative data to make product
        decisions, track metrics, and evaluate A/B tests.&lt;/li&gt;
        &lt;li&gt;Comfortable understanding technical architecture and
