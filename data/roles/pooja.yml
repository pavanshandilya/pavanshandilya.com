        individuals and businesses. We prevent fake or malicious registrations
        and automated bot activity, manage email/phone verification and
        two-factor authentication, reduce account takeovers, detect
        inappropriate multiple-account use, and build the core systems that
        power identity, verification, and additional security checks when
        needed.&lt;/p&gt; &lt;p&gt;Depending on your experience and interests,
        you will join one of three teams tackling meaningful problems for our
        business and members:&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Multiple
        Accounts: &lt;/strong&gt;Shape how multiple accounts and profiles work
        on Vinted, with an immediate priority on creating a safe, easy-to-use
        experience for minors and teens (including parental controls,
        compliance, and safety mechanisms), while expanding support for broader
        usage patterns.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Registration:
        &lt;/strong&gt;Protect genuine users while preventing malicious actors,
        focusing on end-to-end registration flows, UX-first adaptive
        registration, and defense mechanisms against bot activity.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Verification: &lt;/strong&gt;Own email/phone
        verification (2FA), identity check mechanisms, and friction platforms,
        ensuring seamless, scalable verification for genuine members while
        stopping compromised or fake accounts.&lt;/p&gt; &lt;p&gt;In close
        partnership with teams across your domain and neighboring areas, you’ll
        collaborate with Product Design, Product Analytics, Engineering, and
        cross-functional leadership to drive real impact.&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;In this position,
        you’ll&amp;nbsp;&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Drive
        and align the vision, product strategy, and measurable OKRs for your
        ownership area, connecting member problems to business
        opportunities.&lt;/li&gt; &lt;li&gt;Conduct rigorous product discovery,
        framing complex member, safety, security, and business problems using
        both qualitative research and quantitative analytics.&lt;/li&gt;
        &lt;li&gt;Partner closely with Engineering, Design, Data, Research,
        Legal, Compliance, Operations, Member Support, and external 3rd-party
        vendors.&lt;/li&gt; &lt;li&gt;Understand end-to-end user journeys,
        technical architecture constraints, safety signals, and platform
        ecosystem dynamics for both genuine users and malicious
        actors.&lt;/li&gt; &lt;li&gt;Oversee the product development cycle using
        agile methodologies, making clear trade-offs, managing roadmaps, running
        hypothesis-based experiments (A/B testing), and iterating based on
        data.&lt;/li&gt; &lt;li&gt;Ensure regulatory, legal, and security
        requirements are integrated into product decisions from the start
        without compromising a smooth member journey.&lt;/li&gt; &lt;li&gt;Bring
        clarity to ambiguous problem spaces and communicate effectively across
        technical and non-technical stakeholders and leadership.&lt;/li&gt;
        &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;About
        you&amp;nbsp;&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Several
