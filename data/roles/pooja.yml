      description: "&lt;div class=&quot;content-intro&quot;&gt;&lt;h3&gt;Who we
        are&lt;/h3&gt; &lt;p&gt;Typeform is a refreshingly different form
        builder. We help over 150,000 businesses collect the data they need with
        forms, surveys, and quizzes that people enjoy. Designed to look striking
        and feel effortless to fill out, Typeform drives 500 million responses
        every year—and integrates with essential tools like Slack, Zapier, and
        Hubspot.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Senior Product
        Manager, Blocks&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About
        the role&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We are looking for a Senior
        Product Manager to own and evolve Typeform’s core building blocks, the
        foundation that powers every form experience on the platform.&lt;/p&gt;
        &lt;p&gt;Typeform’s respondent experience is widely recognised as one of
        the best in the market. Behind that experience sits the blocks system,
        the primitives that power every question, interaction, and response
        flow. As Typeform continues to expand into new use cases and AI powered
        experiences, this system must evolve to support greater flexibility,
        composability, and speed of innovation.&lt;/p&gt; &lt;p&gt;In this role,
        you will lead the evolution of the blocks library and the architecture
        that powers the respondent experience. You will deepen the block system,
        introduce new high impact block types, and help shape the technical
        foundation that allows Typeform to support conversational, page based,
        embedded, and AI moderated experiences from a unified
        platform.&lt;/p&gt; &lt;p&gt;Your work will create the modular
        primitives that allow teams across Typeform to build faster while
        maintaining the quality of experience that sets Typeform
        apart.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About the
        team&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The Blocks team owns the
        foundational components that power the respondent experience across
        Typeform. Every question type, interaction, and response flow is built
        on top of this system.&lt;/p&gt; &lt;p&gt;The team works closely with
        platform engineering, product design, and multiple product teams across
        the company. Their mission is to ensure Typeform’s core building blocks
        remain flexible, scalable, and capable of supporting the next generation
        of product experiences.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Things you will
        do&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;• Own and evolve Typeform’s blocks
        library, the foundation of every form experience&lt;br&gt;• Lead the
        strategic evolution of the respondent experience architecture&lt;br&gt;•
        Expand the block library by introducing new high impact block types such
        as scheduling, payments, and document signature&lt;br&gt;• Define the
        product strategy for a major renderer refactoring initiative to improve
        flexibility and reduce architectural constraints&lt;br&gt;• Partner
        closely with engineering on architectural decisions that shape the
        future of the platform&lt;br&gt;• Ensure the block system remains
        scalable, performant, and easy for other teams to build on&lt;br&gt;•
        Define sequencing and delivery plans for platform improvements and new
        capabilities&lt;br&gt;• Work cross functionally with engineering,
        design, and product leadership to align on priorities and technical
        direction&lt;br&gt;• Use data and customer insight to identify
        opportunities and measure product impact&lt;br&gt;• Leverage AI tools to
        accelerate discovery, analysis, documentation, and decision
        making&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What you already bring to the
        table&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;• Strong product sense and the
        ability to identify what creates a great creator and respondent
        experience&lt;br&gt;• A high ownership mindset with a bias toward action
        and proactive problem solving&lt;br&gt;• Experience partnering closely
        with engineering teams on technically complex product
        initiatives&lt;br&gt;• Comfort engaging in discussions around
        architecture, performance, and scalability&lt;br&gt;• Experience working
        on platform level product systems rather than isolated
        features&lt;br&gt;• Ability to balance long term platform vision with
        short term delivery needs&lt;br&gt;• Strong product craft, including
        writing clear specifications and managing complex cross team
        initiatives&lt;br&gt;• A data driven approach to decision making and
        prioritisation&lt;br&gt;• Comfort operating in ambiguous environments
        and defining direction where none exists&lt;br&gt;• An AI augmented
        working style, using tools such as ChatGPT, Claude, coding assistants,
        and research agents to accelerate workflows&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Nice to have&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;•
        Experience building form builders, survey tools, or creator focused
        products&lt;br&gt;• Experience working on products that serve both
        creators and end users&lt;br&gt;• Familiarity with AI enhanced product
        experiences such as AI moderated workflows or smart logic
        systems&lt;br&gt;• Experience leading platform or infrastructure level
        product initiatives&lt;br&gt;• Experience driving architectural or
        platform refactoring initiatives&lt;/p&gt; &lt;p&gt;&lt;strong&gt;This
        is where you will make an impact&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;You
        will help define the core primitives that power every Typeform
        experience. By evolving the blocks system and respondent architecture,
        you will unlock faster innovation across the platform and shape how
        millions of people interact with forms every day.&lt;/p&gt;&lt;div
        class=&quot;content-conclusion&quot;&gt;&lt;p&gt;*Typeform drives
        hundreds of millions of interactions each year, enabling conversational,
        human-centered experiences across the globe. We &lt;strong&gt;move as
        one team&lt;/strong&gt;, empowering our collective efforts by valuing
        each individual’s unique perspective. This fosters &lt;strong&gt;strong
        bonds&lt;/strong&gt; grounded in respect, transparency, and trust. We
        &lt;strong&gt;champion our diverse customer base&lt;/strong&gt; by
        anticipating their needs and addressing their challenges with priority.
        Committed to excellence, we&lt;strong&gt; hold high expectations
        &lt;/strong&gt;for ourselves and each other, continuously striving to
        deliver exceptional results.&lt;/p&gt; &lt;p&gt;We are proud to be an
        equal-opportunity employer. We celebrate diversity and stand firmly
        against discrimination and harassment of any kind—whether based on race,
        color, ancestry, religion, sex, national origin, sexual orientation,
        age, citizenship, marital status, disability, gender identity or
        expression, or veteran status. Everyone is welcome
        here.&lt;/p&gt;&lt;/div&gt;"
