        data-contrast=&quot;auto&quot;&gt;We’re looking for a Senior Product
        Manager (Technical) who wants to help define how trust is built into the
        next generation of AI systems. At Affinidi, we’re building the Trust
        Fabric product suite to give AI agents verifiable identity, policy
        guardrails, and real-time observability, so organisations can move from
        promising proofs of concept to secure, governed production deployments
        with confidence.&lt;/span&gt;&lt;span
        data-ccp-props=&quot;{}&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;&lt;span data-contrast=&quot;auto&quot;&gt;This is a role for
        builders. You’ll work side by side with engineering to turn ambitious
        ideas into real, high-impact products, fast, iteratively, and with
        strong product judgment. You’ll take on complex, ambiguous challenges
        that don’t come with a playbook, bring structure to what matters, and
        help the team move with clarity, speed, and conviction. You’ll also
        collaborate with deeply engaged teams and senior leaders in an
        environment that expects high standards, values ownership, and gives you
        the chance to shape meaningful products from the ground
        up.&lt;/span&gt;&lt;span
        data-ccp-props=&quot;{}&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;&lt;span data-contrast=&quot;auto&quot;&gt;If you like
        combining technical depth, product thinking, and execution, you’ll fit
        right in.&lt;/span&gt;&lt;span
        data-ccp-props=&quot;{}&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;&lt;span data-contrast=&quot;auto&quot;&gt;What
