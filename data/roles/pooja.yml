        loves building great next-generation products, not status quo. Who cares
        about redefining how everyone around us can get the best financial
        applications, not for an exclusive few. We have teams working around the
        world, with over 20 nationalities and growing from our offices and
        remotely. Join us and build a better future for our society. In 2019, we
        built the first mobile-first, insurance platform, enabling insurance to
        be accessible online by millions in the region. Today, it's the leading
        insurance platform in Southeast Asia. The Role We are looking for
        product managers to own product areas within Doit's AI Stockbroking App.
        This role is for builders who can understand users, define product
        direction, work with engineering and design, launch fast and keep
        improving after release. What You'll Own Own product areas across
        insurance, payments, savings, investing, travel or other financial
        services. Define user problems, product scope, success metrics, roadmap
        and launch plans. Work with engineering, design, data, operations,
        compliance and business teams. Turn complex financial products into
        simple, usable customer journeys. Use data, feedback, research and
        production issues to improve product decisions. Launch features, monitor
        performance and drive iterations. Make trade-offs between speed, user
        experience, business impact, compliance and operational complexity. What
        We're Looking For Experience as Product Manager, Product Owner, founder,
        growth/product operator or similar role. Strong product sense and
        ability to simplify complex workflows. Able to work with engineers and
        designers to ship real products. Comfortable with metrics, user
        feedback, experiments and post-launch learning. Strong writing,
        prioritization and stakeholder management. High ownership and ability to
        drive work with limited guidance. Experience in fintech, insurance,
        payments, consumer apps or high-growth products is a strong advantage.
        The Kind of Builder We Want Starts from user problems, not feature
        lists. Can make decisions with incomplete information. Knows how to ship
        quickly and learn after launch. Works well with engineering without
        hiding behind process. Honest about what changed because of their work
        versus wider team effort. This Role Is Not For People who only write
        decks and do not drive execution. PMs who cannot work deeply with
        engineering. Candidates who need perfect data before making decisions.
        People who launch features and then stop caring. PMs who exaggerate
        business impact without understanding attribution. Location This role is
        remote, but candidates must be based in Germany . We are hiring
        specifically for this market, so applicants should already be based in
        Germany . Language English is our main working language across global
        teams. Strong English communication is required. Interview Process Our
        process is designed to move fast: 1. Online assessment or practical task
        2. Role-specific interview 3. CEO / final round For strong candidates,
        we aim to complete the process and make an offer within 1 week from the
        start of the interview process. Candidates who complete assessments
        quickly will be prioritized. Find Jobs in Germany on Arbeitnow"
