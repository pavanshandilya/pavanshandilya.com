      description: "Responsibilities We are looking for an experienced, passionate,
        and hands-onSenior Product Managerto join our product team and help
        drive success of the matching experience within our platform. Aroundhome
        is a two-sided marketplace platform where the possibility of shared
        success begins with the match: the moment a homeowner is connected with
        the right partner. The Matching Experience domain owns this critical
        step of the marketplace journey: making you responsible for transforming
        house owner service requests into high-quality partner matches that lead
        to successful projects and long-term platform engagement. In achieving
        this, aspects of quality and retention are as much part of your
        responsibility as is maximizing business outcome. At Aroundhome, Product
        Managers play a pivotal role in shaping the success of Germany’s leading
        housing project platform. We work in a domain-based model, where each
        product team owns a clearly defined part of the platform. This structure
        fosters close collaboration within cross-functional teams and ensures
        that the expertise needed for continuous product discovery, hypothesis
        development, and iterative improvement sits directly within each domain.
        As a Senior Product Manager, you play a critical role in driving and
        executing the strategy, setting a clear direction, and ensuring that
        your domain delivers meaningful value to both customer groups -
        homeowners and partners - as well as to the business. You continuously
        shape domain strategy and vision, setting clear measurable goals and
        roadmap for the matching experience to improve conversion through
        personal data collection and validation funnels, as well as increase
        match quality, trust, and successful project outcomes. You also actively
        rally those around you toward this vision. You drive domain growth
        through continuous end-to-end product discovery, using quantitative and
        qualitative insights to identify opportunities, devise solutions and
        make evidence-based, outcome-driven decisions with measurable impact.
        You communicate with clarity and purpose, translate complex topics into
        compelling narratives, and foster strong collaboration across Product,
        Tech, Product Analytics, UX, Marketing, Customer Care, Sales, and
        cross-domain stakeholders to enable decision-making and inspire action
        to develop impactful solutions. You are also comfortable managing up and
        aligning directly with C and Director level stakeholders. You ensure a
        strong balance between long-term strategic goals and short-term
        trade-offs, driving continuous (lean) delivery through effective backlog
        management and close collaboration with Engineering and Design to
        consistently deliver high-quality, incremental value. Skills You are
        experienced in optimizing complex user funnels and decision-driven
        experiences (e.g. personal data validation, recommendations, matching),
        using experimentation and data to improve conversion, quality, and user
        trust while laying the foundation for long-term platform engagement. You
        apply strong analytical thinking and product analytics skills to define
        meaningful success measures, interpret data, uncover insights, and guide
        evidence-based decisions across product opportunities to drive
        measurable user and business outcomes. You bring order to chaos by
        aligning diverse stakeholder perspectives and fostering a shared
        understanding across teams through your excellent communication skills
        in English, a structured way of working, and your entrepreneurial
        mindset. You proactively apply AI to enhance both product experiences
        and internal productivity, using hands-on experience with AI tools to
        drive efficiency and user-centric innovation. As a team player with a
        good sense of humor, you stay up to date on the latest PM trends and
        technologies and take full ownership of your goals. What we offer Hybrid
        Work // Stay flexible: We embrace a hybrid working model that balances
        the autonomy of remote work with purposeful in-person collaboration.
        Ideally, you are based in Berlin or live within easy commuting distance.
        While we offer flexibility, monthly presence in our office for team
        days, workshops, and meetings is required. Additionally, we offer you
        the possibility to work up to 30 days per year from selected EU
        countries. Room to grow // Stay curious: In regular/annual feedback
        meetings, you design your own personal development path together with
        your team lead. In addition, we offer an annual training budget, free
        access to LinkedIn Learning as well as great workshops to seek new input
        and specific training for your personal development. Mental &#x26;
        physical health // Stay healthy &#x26; active: We care about your
        well-being and support your health with a discounted membership at Urban
        Sports Club. In addition, our cooperation partner “Fürstenberg
        Institute” is available to you and your family members with advice and
        support when it comes to mental health &#x26; coaching. Taking
        responsibility // We #care: We care for our planet and the people who
        are living on it. To make our world a little bit better, our ESG Team
        (Environmental, Social &#x26; Governance) promotes our awareness of
        environmentally friendly behaviour. In addition, we work with JobRad,
        offer a discounted BVG ticket, and actively support social projects in
        Berlin at our annual Social Day to give something back. Teamspirit //
        Stay connected: What drives us is our sense of community. That's why we
        celebrate our Company Day once a month in our office at Potsdamer Platz,
        where everyone gets together in person. In addition to a comprehensive
        update of our C-Board, the main focus is on togetherness and the
        exchange of ideas over lunch and dinner together. Find more English
        Speaking Jobs in Germany on Arbeitnow"
