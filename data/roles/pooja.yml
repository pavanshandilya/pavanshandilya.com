      url: https://www.arbeitnow.com/jobs/companies/plancraft/senior-ai-product-manager-hamburg-130427
      updated_at: 1794768018
      description: 'OUR PURPOSE AT PLANCRAFT Building the backbone of European trades
        together – with AI-first software. We’re not just building software –
        we’re on a mission to create space for contractors &amp; tradespeople by
        equipping them with AI solutions that work the way they do: fast,
        practical, and AI-first. With Tier 1 Investors from Europe and the US,
        like Headline and Creandum as well as 30,000+ tradespeople as customer
        base, we’re scaling across Europe to turn scattered tradespeople into
        thriving communities. We believe in zero admin, not zero personality –
        and we build every feature with the people in mind who wear the boots,
        not the suits. We’re #stoked to shape the future, #together as a team,
        and #humble in our mission to support the builders of tomorrow. YOUR
        MISSION AT PLANCRAFT As a Senior AI Product Manager, you move plancraft
        closer to becoming the autopilot for the trades : Evolving our product
        from software that helps tradespeople manage their work into one where
        AI agents can take on meaningful parts of their daily workload. This is
        not about adding AI features to an existing roadmap. You’ll own an
        emerging problem space and identify where agents can create the highest
        leverage for our customers beyond what Plancraft does today. That means
        getting close to tradespeople and their businesses, uncovering the
        problems worth solving, and working with Engineering and UX to turn them
        into reliable, trustworthy products customers are willing to rely on for
        real work. You’ll operate across the full product journey: from spending
        time with tradespeople in the field and deciding which opportunity to
        pursue, to working with Engineering to understand technical requirements
        and trade-offs, defining evaluation criteria, shipping to production,
        and learning from real-world usage. The impact should be tangible. The
        products you build will aim to help trades businesses improve outcomes
        such as profit margins, quote acceptance rates, and capacity utilisation
        — while opening up entirely new product and growth opportunities for
        plancraft. YOUR RESPONSIBILITIES Own the product strategy, roadmap, and
        delivery for Plancraft’s customer-facing AI agents and workflows.
        Identify high-potential customer problems beyond today’s platform and
        translate messy, real-world trades workflows into focused opportunities
        for agentic products. Define and own the single co-worker interface for
        customers to interact with and manage agents and their underlying
        workflows. Work in a Product Trio with Engineering and UX throughout
        discovery, evaluation, and delivery, from early problem validation to
        production-quality releases. Establish a repeatable AI product operating
        loop across discovery, evaluation, release gates, monitoring, and
        iteration. Define and maintain evaluation sets, quality standards, and
        release criteria for customer-facing AI products, including accuracy,
        correction rates, latency, and safe rollback conditions. Instrument and
        monitor AI product performance, using customer behaviour and quality
        signals to decide what to scale, change, or stop. Demonstrate measurable
        customer outcomes from AI-powered workflows, including improvements in
        efficiency, profitability, quote acceptance, capacity utilisation,
        activation, and retention. Contribute the Product perspective to
        technical and platform trade-offs, including customer value, quality,
        cost, and time to market, together with Engineering and the shared AI
        infrastructure counterpart. Partner across Product and Engineering to
        manage dependencies, reusable AI experience patterns, mobile and voice
        input, and handovers between customer workflows. Work closely with
        RevOps, Sales, and Customer Success to understand adoption and
        willingness-to-pay signals and contribute to AI pricing and monetisation
        experiments. Must-Have Skills 7+ years of product management experience
        , including at least 2 years owning and shipping AI products in
        production end-to-end. Strong applied GenAI literacy across LLMs,
        agents, RAG, and evaluation frameworks — sufficient to understand
        technical requirements and help evaluate Product, quality, cost, and
        time-to-market trade-offs together with Engineering. Experience building
        0-to-1 AI products or new product areas , from customer discovery and
        problem definition through production launch and iteration. Experience
        defining quality and success criteria for AI products , including
        evaluation metrics, release thresholds, customer outcomes, and
        post-launch monitoring. Strong customer discovery and product judgment ,
        with the ability to turn complex real-world workflows into focused AI
        product opportunities. Experience in a fast-moving startup or scale-up
        environment , with a track record of creating structure, setting
        priorities, and delivering despite ambiguity. Proven cross-functional
        ownership , working closely with Engineering and UX from discovery
        through production and managing dependencies across teams. English at C1
        level and German at C2 level. Willingness to stay close to customers and
        the team , including field discovery with tradespeople and regular
        presence in Hamburg (approximately one week per month or equivalent).
        Nice-to-Have Skills Experience with voice, mobile, or document AI ,
        particularly products that turn unstructured inputs into reliable
        workflows. Experience with AI monetisation , including usage-based,
        credit-based, or hybrid pricing models. Background in B2B SaaS for SMBs,
        field service, construction, or the trades . Familiarity with product
        and research tools such as PostHog, Sentry, Dovetail, or ProductFruits .
        Additional language skills in Italian, Spanish, Dutch, or Polish . WHO
        THIS ROLE IS FOR You’ll probably enjoy this role if you want to build
        rather than inherit. You like starting with an important but not fully
        defined problem and creating clarity through customer insight, data,
        experimentation, and strong product judgment. You’re excited by AI
        because of the problems it can solve — not simply because the technology
        is new. You’re comfortable working closely with engineers, understanding
        technical requirements and evaluation results, and translating them into
        sound Product decisions. You want meaningful ownership. You’re
        comfortable making decisions with incomplete information, narrowing a
        large opportunity space into the right first wedge, shipping it,
        learning from real usage, and changing course when the evidence tells
        you to. And importantly, you want your work to have a visible outcome.
        The products you build here should change how trades businesses operate
        — and their adoption, customer value, and commercial impact will be
        measurable. WHY PLANCRAFT? Team Spirit : We’re driven by passion,
        commitment, and a shared mission. Team spirit matters to us — and we
        make it visible: with four major team event weeks per year, casual
        monthly on-site and remote formats, and a strong recognition culture
        where we regularly celebrate both the big and small wins together.
        Ownership : You’re encouraged to take ownership from day one. In a flat
        hierarchy and high-trust environment, you’re empowered to make
        meaningful decisions and drive real impact. Learning &amp; Growth : We
        invest in your personal and professional development through a strong
        feedback culture with 6-monthly 360° growth reviews, a personal learning
        budget (1.500€/year), 2 paid days of educational leave, and targeted
        enablement formats. Our goal is to help you unlock your full potential.
        AI Enablement : Our internal tools and workflows are AI-enabled by
        design. We support every team and individual in applying AI at the next
        level in their daily work. Tech &amp; Tooling : You’ll receive a
        MacBook, premium headphones, and everything else you need — from
        hardware to tools — to be effective in your daily doing. Flexibility :
        Whether remote, hybrid, abroad or on-site — you work where you’re at
        your best. Our Hamburg office (with a rooftop terrace) is always open,
        and you decide each week how often you come in. And if you need a change
        of scenery, working abroad worldwide up to 2 months is always an option.
        Recharge : To ensure the needed rest, we offer 30 vacation days per year
        (based on a 5-day week) plus Dec 24th off. We also subsidize your Urban
        Sports Club membership and organize internal sport meetups. Mobility :
        You can lease a "JobRad" (Bike) and get a subsidized "Deutschlandticket"
        or "BahnCard" for public transport to be supported in your commute.
        International Environment : We’re becoming more international every
        month, with team members already in Italy, Spain, the Netherlands, and
        Austria — which is why English is our internal company language. We’re
        #stoked to shape the future, #together as a team, and #humble in our
        mission to support the builders of tomorrow. For a first impression of
        us, take a look at our Instagram and LinkedIn page . Diversity makes us
        better. We welcome people of all backgrounds, identities, abilities, and
        experiences, and we believe that different perspectives lead to better
        ideas, stronger products, and a healthier workplace. If you’re excited
        about our mission but your experience doesn’t align perfectly with every
        requirement, we encourage you to apply anyway. You might be exactly who
        we’re looking for. ______ On the application process We want your
        candidate experience with us to be smooth, transparent, and enjoyable.
        We aim to get back to you regarding your application within 5 business
        days. Our interview process typically takes about 4 weeks from start to
        finish, though this may vary by role. You can learn more about our
        process here . If you need adjustments or flexibility at any stage,
        please don’t hesitate to let us know — we’ll do our best to make it work
        for you. Note on creating a test account: If you would like to create a
        test account as part of the challenge, please enter "Applicant" in the
        relevant field during registration and select "Other" under Trade. This
        ensures that our sales team does not mistakenly register you as a craft
        business and reach out to you unnecessarily. Find more English Speaking
        Jobs in Germany on Arbeitnow'
