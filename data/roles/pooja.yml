        prioritization decisions. What You Bring 3-6 years of product management
        experience in a B2B or technical environment building products for
        specialized, professional users (not purely consumer products).
        Demonstrated ability to manage complex products where the user base has
        deep domain expertise, e.g., enterprise software, developer tools,
