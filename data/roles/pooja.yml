      description: "&lt;div class=&quot;content-intro&quot;&gt;&lt;h2&gt;&lt;span
        data-sheets-root=&quot;1&quot;&gt;About Wolt&lt;/span&gt;&lt;/h2&gt;
        &lt;p&gt;&lt;span data-sheets-root=&quot;1&quot;&gt;At Wolt, we create
        technology that brings joy, simplicity and earnings to the neighborhoods
        of the world. In 2014 we started with delivery of restaurant food. Now
        we’re building the delivery of (almost) everything and you’ll find us in
        over 500 cities in 30 countries around the world. In 2022 we joined
        forces with DoorDash and together we keep on dreaming big and expanding
        across the globe.&lt;br&gt;&lt;br&gt;Working at Wolt isn’t always easy,
        but it’s definitely exciting. Here you’ll learn more, build more, and
        ship more than in most other companies. You’ll be challenged a lot, but
        also have a lot of fun on the way. So, if you’re a self-starter with
        drive and entrepreneurial spirit, this could be the ride of your
        life.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;p&gt;We are looking for a
        Product Manager to join our Product Management organization, working
        with the Delivery Promise team. This is one of those parts of Wolt&#39;s
        business that people don&#39;t always realize the complexity of.
        Logistics is absolutely integral to Wolt, and doing it well can mean the
        difference between delivering blissful customer experiences efficiently
        and profitably vs. operational nightmares and a cacophony of late
        deliveries.&amp;nbsp;&lt;/p&gt; &lt;p&gt;The Delivery Promise team is in
        the Courier &amp;amp; Logistics Product group at Wolt. We&#39;re driving
        the future with estimates that fuel our growth, flywheel, shaping
        shopping decisions and streamlining deliveries. Our goal: boost
        Wolt&#39;s growth and profitability by delivering reliable, precise time
        estimates to customers and partners worldwide. In a nutshell, the team
        is responsible for crafting accurate and reliable time estimates that
        form a key part of the pre-checkout purchase experience for our
        consumers, right from discovery to checkout. We employ advanced machine
        learning models and innovative tools to craft delivery estimates
        experienced by consumers across all business lines for
        Wolt.&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/p&gt; &lt;p&gt;As the Product
        Manager for the Delivery Promise team, your role will be integral in
        ensuring that we provide the best delivery estimates for our consumers
        while balancing the operational impact of fulfilling deliveries against
        the promised estimates. You will be contributing significantly to
        Wolt&#39;s goal of delightful customer experiences.&amp;nbsp;&lt;/p&gt;
        &lt;p&gt;Join us in shaping the future of delivery, where every delivery
        is an opportunity for delight and loyalty.&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Our humble
        expectations&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;You could come to this
        role from various backgrounds, but ideally, you bring:&lt;/p&gt;
        &lt;ul&gt; &lt;li&gt;Plenty of previous experience as a Product
        Manager&amp;nbsp;&lt;/li&gt; &lt;li&gt;It’s a plus for you if you have a
        background in Machine Learning or Data Science, since you would be
        focused on optimizing our estimates across markets and consumer
        cohorts.&amp;nbsp;&amp;nbsp;&lt;/li&gt; &lt;li&gt;Proven track record in
        building products influencing cross-functional teams, including
        engineering, data, design, and operations.&lt;/li&gt; &lt;li&gt;High
        ownership and collaborative capabilities, making thoughtful decisions,
        and focusing on product details to ensure execution aligns with the
        vision.&lt;/li&gt; &lt;li&gt;Strong ability to define, execute, and
        measure meaningful OKRs, ensuring alignment with company-wide goals and
        fostering bottom-up alignment from your team.&lt;/li&gt;
        &lt;li&gt;Ability to focus on the bigger picture, creating solutions
        that benefit couriers, operations, and customer experiences across the
        organization.&lt;/li&gt; &lt;li&gt;Excellent stakeholder management
        skills, able to work effectively with diverse internal teams and
        external partners, while confidently engaging with leadership in a
        high-visibility role.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;The position will
        be filled as soon as we find the right person, so make sure to apply as
        soon as you realize you really, really want to join us!&lt;/p&gt;
        &lt;p&gt;The compensation will be a negotiable combination of monthly
        pay and DoorDash RSUs. The latter makes it exceptionally easy to be
        excited about our company growing and doing well, as you’ll own a piece
        of the pie.&lt;/p&gt; &lt;p&gt;&lt;iframe
