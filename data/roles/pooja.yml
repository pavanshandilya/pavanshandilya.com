        &amp; balance: We value rest and recovery. That’s why you’ll enjoy 30
        vacation days plus public holidays to recharge and return inspired.
        Learning &amp; development: Your growth is our priority. We provide an
        annual budget dedicated to courses, conferences, or any resources that
        help you expand your skills. Ownership &amp; participation: As part of
        our equity program, you’ll directly share in our success and the value
