      title: Senior Product Manager, AI Products & Agentic Hospitality (f/m/d)
      location: Germany
      url: https://www.arbeitnow.com/jobs/companies/apaleo/senior-product-manager-ai-products-agentic-hospitality-germany-426998
      updated_at: 1794692722
      description: "About the role &nbsp; &nbsp; At Apaleo, we're building the open,
        API-first property management platform for hospitality. With
        integrations across hundreds of apps through the Apaleo Store, and the
        first AI agent marketplace for hospitality in our Agent Hub, we simplify
        operations, elevate the guest journey and drive revenue growth for our
        customers. &nbsp; We're looking for a senior Product Manager to own in
        our AI product domain. You'll turn our AI capabilities into coherent,
        commercially viable products that solve real operational problems for
        hoteliers. Your goal is to help hotels move towards genuinely autonomous
        operations, not to ship isolated automations or AI assistants. &nbsp;
        This is not a backlog role. You'll take an ambiguous opportunity, find
        the right customer problems, define the proposition, build it with
        Engineering, bring it to market and drive adoption. You'll also play a
        central role in turning our AI capabilities into a meaningful and
        growing source of revenue. &nbsp; This is a senior individual
        contributor role with real autonomy. You won't receive a roadmap and
        execute it. You'll shape it along our vision , using customer insight,
        data and sound reasoning. You'll work closely with Engineering, Design,
        Sales, Marketing and Customer Success, and in close collaboration with
        our other value stream teams. &nbsp; &nbsp; What you'll be up to &nbsp;
        Productising and commercialising our AI capabilities . Define the
        proposition, target customers and use cases, and shape packaging and
        launch with commercial teams. &nbsp; Building the foundations for AI
        across our ecosystem. Shape how our AI capabilities understand each
        hotel's context and work reliably with Apaleo and connected systems
        across operational areas. &nbsp; Productising hospitality knowledge.
        Turn hospitality expertise and operational processes into scalable
        product experiences, with appropriate human oversight. &nbsp; Driving
        autonomy and measurable value. Think in complete outcomes, such as staff
        hours saved and manual work removed. Show hoteliers tangible ROI. &nbsp;
        Driving adoption. Run discovery, shape onboarding and usability, measure
        adoption and improve from real-world feedback. &nbsp; Keeping AI
        products reliable and viable. Define good agent performance, understand
        cost and latency, set up evaluation and monitoring with Engineering, and
        trade off autonomy, reliability, human intervention and cost. &nbsp;
        Owning strategy, roadmap and delivery in your scope , with clear specs,
        a definition of done and impact analysis. &nbsp; Working with
        Engineering on trade-offs, dependencies, quality and our API-first
        AI-first architecture. &nbsp; Balancing ambition with reality. Weigh the
        roadmap against operational requests, bugs and technical debt, and say
        no to good ideas that aren't great ones. &nbsp; Spotting dependencies
        early with Hotel Operations and other engineering teams, since our AI
        capabilities build on the core platform. &nbsp; Using AI in your own PM
        work and championing AI-assisted engineering.&nbsp; &nbsp; &nbsp; What
        you'll bring &nbsp; 6+ years as a Product Manager, owning products from
        discovery through launch and adoption with limited day-to-day direction.
        &nbsp; Proven zero-to-one experience. You've taken a new B2B product,
        not a feature, from an ambiguous problem to paying customers, driving
        discovery, validation, definition, prioritisation and launch. &nbsp;
        Ownership after launch. You've owned a revenue, adoption or retention
        number and can tell us what moved and what you killed, pivoted or
        repriced. &nbsp; Commercial thinking. You've defined propositions,
        packaging and pricing, validated willingness to pay and worked with
        Sales, Marketing and Customer Success on go-to-market. &nbsp; Systems
        and process thinking. You break processes into steps, decisions and
        handoffs, and understand how systems with different data models and
        sources of truth affect the reliability of agents. &nbsp; Meaningful AI
        product experience. You've built and launched AI-powered products or
        capabilities used by real customers, understand what makes a product
        agentic, and can discuss context, tools, latency, cost and evaluation,
        with a view on human-in-the-loop design. &nbsp; Customer centricity and
        product judgement. You turn interview patterns into opportunities, make
        tough trade-offs and prioritise ruthlessly. &nbsp; Platform thinking.
        You weigh customer needs against reusable capabilities, API consistency
        and long-term platform evolution. &nbsp; Stakeholder alignment. You
        align Engineering, commercial teams and peers, manage cross-team
        dependencies and communicate trade-offs with confidence. &nbsp; Autonomy
        and adaptability. You take ownership, raise risks early and make
        progress through ambiguity. &nbsp; &nbsp; Strongly preferred &nbsp;
        Agentic AI products in production. You've taken an agentic AI product
        beyond prototype to paying customers, and dealt with reliability,
        permissions, exceptions, human intervention and evaluation. This is
        different from AI-powered features such as chatbots, summarisation or
        copilots. &nbsp; &nbsp; Nice to have &nbsp; Hospitality technology or
        hotel operations experience. &nbsp; Experience with PMS, RMS, CRS,
        channel managers, OTAs or hospitality distribution. &nbsp; Experience in
        B2B SaaS platforms, ecosystems or integration-heavy products. &nbsp;
        Experience with AI governance, permissions, identity, orchestration or
        enterprise AI adoption. &nbsp; Experience in a fast-moving startup or
        scale-up. &nbsp; Comfort with AI-assisted engineering processes. &nbsp;
        &nbsp; Don't tick every box? Hospitality experience is an advantage, not
        a prerequisite. A strong zero-to-one B2B product builder from another
        domain, with real AI product experience and a commercial mindset, can be
        a better fit than a hospitality specialist without them. We'd still love
        to hear from you. &nbsp; &nbsp; Who you are &nbsp; You take high
        ownership. You answer for product outcomes, not just delivery
        commitments. &nbsp; You're strategic and hands-on. You can set a product
        vision and still get into customer discovery, operational processes and
        detailed product decisions. &nbsp; You're comfortable with ambiguity.
        You make progress when the problem or the solution isn't fully defined.
        &nbsp; You think commercially. You ask what customers will buy and why,
        not just what Engineering can build. &nbsp; You're customer obsessed.
        You understand real operational pain and test your assumptions with
        customers. &nbsp; You're technically curious. You know enough about AI
        and agentic systems to hold meaningful discussions with engineers and
        make informed product decisions. &nbsp; You measure what matters. You
        judge success by customer outcomes, adoption and commercial impact, not
        features shipped. &nbsp; &nbsp; What we offer &nbsp; Culture and growth
        &nbsp; A diverse and international team. Work alongside passionate
        professionals from over 20 nationalities, bringing unique perspectives
        and experiences to shape the future of hospitality tech. &nbsp; Growth
        and development. You'll benefit from 360° feedback reviews, a dedicated
        learning budget and plenty of chances to take on more responsibility.
        &nbsp; Autonomy and ownership. Great ideas can come from anywhere. We
        empower you to take responsibility, make decisions and contribute
        directly, in an environment built on trust and transparency. &nbsp;
        Competitive and fair compensation. Our salaries are competitive and
