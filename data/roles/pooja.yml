      url: https://www.arbeitnow.com/jobs/companies/apaleo/senior-product-manager-fiscal-berlin-464956
      updated_at: 1792914332
      description: "Join Apaleo and Shape the Future of Hospitality Tech!
        At&nbsp;Apaleo,&nbsp;we're&nbsp;building the open, API-first property
        management platform for hospitality. With integrations across hundreds
        of apps through the&nbsp;Apaleo&nbsp;Store, we simplify operations,
        elevate the guest journey and drive revenue growth for our customers.
        &nbsp; We're looking for a Senior Product Manager - Fiscal (f/m/d) to
        help us make&nbsp;Apaleo&nbsp;compliant, fast, wherever we grow
        next.&nbsp;You'll&nbsp;own the delivery of features that keep our
        platform compliant across markets, working closely with a Senior
        Product&nbsp;Management&nbsp;Lead&nbsp;who sets the strategic direction
        for the wider fiscal and tax domain. &nbsp; &nbsp; What You'll Be Up To
        &nbsp; Owning the&nbsp;end to end&nbsp;delivery of one or two product
        crews within the fiscal and legal domain, for example invoicing or
        taxation. &nbsp; Turning roadmap priorities into clear, well scoped work
        your engineering team can execute against. &nbsp; Balancing planned
        roadmap delivery with the steady stream of regulatory and reactive work
        that comes with keeping&nbsp;Apaleo&nbsp;compliant in
        markets&nbsp;we've&nbsp;already launched. &nbsp; Writing clear specs,
        defining what done looks like and following through on impact analysis
        so nothing falls through the cracks. &nbsp; Working shoulder to shoulder
        with engineering as a technical partner.&nbsp;You'll&nbsp;get into the
        detail of our API-first architecture rather than handing off a ticket
        and waiting. &nbsp; Shielding your team from noise and distractions so
        they can focus on what matters, whilst keeping delivery predictable.
        &nbsp; Partnering with customer success,&nbsp;compliance&nbsp;and
        engineering stakeholders to understand&nbsp;what's&nbsp;needed and
        translate it into shippable work. &nbsp; Helping the team move faster on
        new country launches, contributing to our ambition of
        making&nbsp;Apaleo&nbsp;compliant in many more markets over the next few
        years. &nbsp; &nbsp; What You'll Bring to the Team &nbsp; At least 3 to
        4 years' experience as a Product Manager, ideally in a&nbsp;fast
