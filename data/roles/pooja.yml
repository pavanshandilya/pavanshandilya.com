        kostenlos. Dazu entwickeln wir eine App, die dir sofortigen Zugang zu
        lokal relevanten Helfer:innen verschafft, egal ob es sich dabei um deine
        Freunde, Familie oder professionelle Helfer:innen handelt. Wir sind ein
        kleines Team mit einem großen Herzen, mit Sitz in München, bestehend aus
        53 Personen mit 9 verschiedenen Nationalitäten. Wir suchen ein
        leidenschaftliches neues Teammitglied, das es liebt, neue
        Herausforderungen in einer schnelllebigen Startup-Umgebung anzugehen.
        Wir sind ein bunt gemischter Haufen ehrlicher und aufgeschlossener
        Menschen, die eine gemeinsame Vision haben, die Welt für uns und die
        Menschen und Orte, die wir lieben, sicherer zu machen. Für diese Vision
        suchen wir Unterstützung im Bereich Product Management , um unsere
        Vision in ein außergewöhnliches Produkt zu übersetzen, welches Menschen
        begeistert und echten Mehrwert generiert. Aufgaben Produktstrategie
        &#x26; Roadmap: Du moderierst und gestaltest die Produktvision sowie die
        strategische Roadmap in enger Zusammenarbeit mit dem Team und den
        Stakeholdern. Du stellst sicher, dass alle Perspektiven einfließen, um
        eine priorisierte Richtung vorzugeben, die sowohl Business-Ziele als
        auch Nutzerbedürfnisse optimal vereint. Menschzentrierte Product
        Discovery &#x26; Delivery: Du übernimmst volle Verantwortung entlang des
        gesamten Lebenszyklus. Du leitest eigenständig Discovery Stream, um
        echte Probleme oder Potentiale zu identifizieren, und stellst
        gleichzeitig eine exzellente Delivery sicher. Das bedeutet: Du hast die
        Nutzer:innen immer im Blick und begreifst dich als ihr Sprachrohr in das
        Unternehmen. Du verstehst Bedürfnisse, übersetzt diese in präzise
        Anforderungen (User Stories, Acceptance Criteria) und stellst während
        der Umsetzung sicher, dass das gelieferte Ergebnis die gewünschte
        Qualität und Wirkung erzielt. Datengetriebene Entscheidungsfindung: Du
        definierst die relevanten KPIs und Erfolgskriterien für unser Produkt
        und relevante Umsetzungen. Du nutzt quantitative Daten und qualitatives
        Feedback, um den Produkterfolg kontinuierlich zu steigern und die
        Roadmap und das Backlog rollierend entsprechend anzupassen.
        Cross-funktionale Führung &#x26; überzeugende Kommunikation: Du
        verstehst es als zentrale Schnittstelle zwischen Engineering, Design,
        Marketing und Sales zu agieren. Du moderierst komplexe
        Entscheidungsprozesse, managst die Erwartungen der Stakeholder (u.a.
        Geschäftsführung) und stellst abgestimmte Ziele/Pläne durch
        hervorragende Kommunikation sicher. Prozess-Optimierung &#x26;
        Mentoring: Du prägst eine nutzerzentrierte Produktkultur, indem du Best
        Practices in der Zusammenarbeit zwischen Produkt, Design und Tech
        etablierst. Du trägst aktiv dazu bei, die Effizienz und Qualität der
        Zusammenarbeit in der Produktentwicklung und darüber hinaus auf das
        nächste Level zu heben. Qualifikation Relevante Produktmanagement
        Erfahrung: Du verfügst über mindestens 5 Jahre einschlägige
        Berufserfahrung im Product Management von digitalen B2C- oder
        B2B2C-Produkten (App-Fokus), idealerweise in einem stark skalierenden
        Startup-Umfeld. Ganzheitliche Umsetzungskompetenz: Du hast bewiesen,
        dass du komplexe Produkte nicht nur konzipieren, sondern auch
