        of process. Three things that are specifically true of this role: Wealth
        management is ripe for disruption. Following digitalisation waves of
        banking and brokerage services, we are leading those efforts across the
        next big topic for private individuals: better understand and optimize
        your wealth The data asset is genuinely rare. Aggregated
        cross-institution wealth for half a million people, with over +€25bn in
        connected assets. Trade Republic sees its own platform. N26 sees the
        current account. Nobody else in Europe sees the whole picture, which
        means there are product questions you can only answer here You'll own
