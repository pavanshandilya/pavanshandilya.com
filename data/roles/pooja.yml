      updated_at: 1790272505
      description: "&lt;p&gt;P-1345&lt;/p&gt; &lt;p&gt;You will be the Product Manager
        for the Databricks Runtime team in &lt;strong&gt;Berlin&lt;/strong&gt;.
        The team works at the intersection of query processing, storage,
        infrastructure and data governance, all key components of the Databricks
        data intelligence platform. As the Product Manager, you will develop a
        deep understanding of modern cloud infrastructure, data governance
        solutions, and open source components, and gather requirements from
        customers. You will launch features that will impact how customers
        process petabytes of data every day and make it simpler for them to draw
        value from their data.&amp;nbsp;&lt;/p&gt; &lt;p&gt;This role requires
        coordinating all product activities from vision to implementation,
        including engaging customers to understand their needs, developing
        long-term product strategy, defining product roadmaps, working with
        engineering to build those products, and coordinating with various
        internal stakeholders (both pre- and post-launch) to ensure product
        success.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;The impact you will
        have:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Own the end-to-end
        product management process&lt;/li&gt; &lt;li&gt;Gather customer
        requirements, design features and collaborate with engineering to
        deliver a polished market-ready product&lt;/li&gt; &lt;li&gt;Drive
        launches with product marketing through blog posts, release notes,
        webinars&lt;/li&gt; &lt;li&gt;Define and measure OKRs for your
        products&lt;/li&gt; &lt;li&gt;Drive the prioritization and development
