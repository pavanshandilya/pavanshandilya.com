      company: K-tronik GmbH
      title: Scrum Master Funkkommunikationssysteme im SAFe-Kontext (m/w/x)
      location: Munich
      url: https://www.arbeitnow.com/jobs/companies/k-tronik-gmbh/scrum-master-funkkommunikationssysteme-im-safe-kontext-munich-11209
      updated_at: 1772544729
      description: "Projektbeschreibung: Zur Unterstützung unseres Teams bei unserem
        Kunden aus dem Bereich Funk und Kommunikation suchen wir zum
        nächstmöglichen Zeitpunkt eine/n Scrum Master Funkkommunikationssysteme
        im SAFe-Kontext (m/w/x) zur Festanstellung bei K-tronik. Das klingt
        interessant? Dann freuen wir uns auf Ihre Bewerbung! Aufgaben: Leiten
        und Moderieren aller Agile-Meetings, einschließlich Sprint-Planung,
        täglicher Stand-ups, Sprint-Reviews und Retrospektiven, um eine
        effektive Kommunikation und Zusammenarbeit im Team sicherzustellen.
        Teammitglieder in Agile-Prinzipien und -praktiken coachen und
        mentorieren, um eine Kultur der kontinuierlichen Verbesserung,
        Zusammenarbeit und Innovation innerhalb des Teams zu fördern.
        Verantwortlich für die Durchführung der Planung und Pflege der
        Sprint-Pläne und Backlogs durch das Team. Erstellen und Auswerten von
        automatischen Reports im Ticketmanagementsystem (Jira / IBM RTC) um die
        Planungsqualität und die Pflege der Tickets sicher zu stellen. Mit dem
        Product Owner (PO) zusammenarbeiten, um das Backlog effektiv zu
        priorisieren. Den PO unterstützen, klare und präzise Storys in einem
        geeigneten Format zu schreiben, um das Verständnis und die Umsetzung
        durch das Entwicklungsteam zu erleichtern.. Dem Team helfen, die
        Definition of Done (DoD) und die Definition of Ready (DoR) zu definieren
        und sie dabei unterstützen, Hindernisse zu beseitigen, die den
        Fortschritt behindern könnten. Abhängigkeiten innerhalb des Projekts
        identifizieren und sicherstellen, dass es keine Verzögerungen bei der
        Erreichung der Sprintziele gibt, indem potenzielle Blockaden proaktiv
        angegangen werden. Die Velocity des Teams verfolgen und sicherstellen,
        dass User Stories in jedem Sprint inkrementell geliefert werden, um
        Einblicke für die zukünftige Planung zu geben. Im SAFe-Kontext eng mit
        dem Release Train Engineer (RTE) und anderen Scrum Mastern
        zusammenarbeiten, um die übergreifende Koordination und Synchronisation
        zwischen den Teams zu gewährleisten und gemeinsame Ziele zu erreichen.
        Qualifikationen: Eolgreich abgeschlossenes Studium in
        Ingenieurwissenschaften, Informatik oder einer ähnlichen Qualifikation/
        Ausbildung mit IT-Hintergrund Hervorragende Kommunikationsfähigkeiten
        Fundierte Erfahrung in der Auswertung und Konfiguration von
        Ticketmanagement-Systemen wie Jira der IBM RTC. Mindestens 3 Jahre
        Erfahrung als Scrum Master, mit einem starken Verständnis von
        Agile-Methoden, insbesondere Scrum Kenntnisse in objektorientierter
        Softwareentwicklung (C++), Python, Yocto sind wünschenswert, um eine
        effektive Kommunikation mit dem Entwicklungsteam zu ermöglichen
        Zertifizierter Scrum Master (CSM) oder gleichwertige
        Agile-Zertifizierung ist von Vorteil und zeigt ein Engagement für
        Agile-Prinzipien und -Praktiken Benefits: Betriebliche Altersvorsorge
        &#x26; Vermögenswirksame Leistungen 30 Urlaubstage und flexible
        Urlaubsplanung Regelmäßige Team-Events Auszeichnung als Kununu TOP
        Company Corporate Benefits (Mitarbeiterangebote) Kostenlose Getränke
        Individuelle Weiterbildungsmöglichkeiten 360° Betreuung:
        Feedbackgespräche, Karriereplanung, Unterstützung bei Umzug, etc.
        Flexible Arbeitszeiten Find more English Speaking Jobs in Germany on
        Arbeitnow"
