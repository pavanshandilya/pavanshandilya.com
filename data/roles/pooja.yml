      description: "What we do At getquin, we're on a mission to empower everyone to
        build wealth. Founded in 2020, we started with a simple idea: help
        people see their entire financial life in one place, so they can make
        more informed decisions. Today, getquin has grown into one of the
        largest wealth platforms globally, already helping over half a million
        users manage and grow their wealth. Our platform combines analytics,
        tools and community to make wealth-building accessible for everyone, not
        just the experts. After launching in Germany, we've started expanding
        across Europe, with a focus on growing our user base, building valuable
        new features and helping even more people take control of their
        financial future. If you're excited to help shape the future of personal
        wealth management, join us. We're just getting started. What you'll be
        doing You've built products for investors. You know what a TER actually
        does to a long-run return, why a user with four brokers has no visbility
        what they really own, and how differently people behave when the number
        on screen is their pension rather than their pocket money. You've
        probably also hit the ceiling of what a chart can tell someone. Better
        tables, more filters, another allocation donut. The data was always
        there; the answer never quite arrived. We have something nobody else
        has: a complete, cross-institution picture of a person's wealth.
        Investments, cash, liabilities and insurance contracts, in one place,
        for over half a million users. Your work is turning that into features
        and insights people understand and act on, and the interesting tools for
        doing that now include AI. We're looking for an experienced Senior
        Product Manager to own that area. You'll work directly with the founders
        and the product team, alongside engineering and our financial advisory
        teams. This is a senior individual contributor role with no direct
        reports, and you'll mentor less experienced product managers on the
        team. Own the wealth product area end to end Set the product strategy
        and roadmap across the picture we give people of their wealth and how we
        help them optimize it Decide what we build on aggregated portfolio data
        that nobody with a single-broker view could build at all Own our efforts
        to stay on the forefront of digital wealth management services and play
        your part in disrupting a still very offline industry Work the
        unglamorous, high-leverage problems too: data quality, coverage gaps,
        missing cost basis, duplicate holdings across connections, ETFs held
        through more than one broker. A portfolio insight is only as trustworthy
        as the numbers under it Turn the data into something users act on Define
        the insights we surface about someone's portfolio, cash position and
        risk, and why each one earns a place on their screen Own our
        conversational AI assistant and our AI-driven insights: what they say,
        what they refuse to say, and how a user knows which is which Set the
        quality bar for anything we tell a user about their money: accuracy
        targets, human review, guardrails, rollback. Decide when something is
        good enough to ship and hold that line when the pressure is to ship
        anyway Own the numbers Define the metrics for your area: activation,
        engagement, the insight-to-action funnel, and contribution to
        subscription conversion and retention Run the experiments, including
        proper A/B testing, read them, and report what didn't work alongside
        what did Live in your own product analytics and write your own queries
        and reporting, rather than wait for someone to give that to you What we
        are looking for You might be a fit if: You've built wealth management,
        investing or portfolio products. You know the domain properly:
        instruments, ETFs, costs, allocation, risk, tax drag, and how retail
        investors actually behave rather than how they should. This is the
        requirement we're least flexible on You've owned a product area end to
        end against a number you defined yourself, with real experimentation
        behind it You've shipped at least one AI or LLM-based feature to
        production for real users, and you owned its output quality. You've
        shipped inside a legal or compliance constraint, and you can reason
        about where an insight becomes advice. Your product discovery produces
        evidence, not opinion. You can show us a real research artefact and a
        decision that changed because of it You're fluent in English; German is
        a plus You can work from our Berlin office, and you already have the
        right to work in Germany That usually adds up to around five or more
        years in product, but we care about the evidence, not the year count. If
        you came to product from engineering, data science, research, design,
        financial services, or from a Product Owner role, that counts. Strong
        plus if you have: PSD2, open banking or account aggregation experience
        Insurance or brokerage product exposure, which matters as we move into
        advisory Recommendation systems or personalisation at scale Subscription
        and paywall experimentation Experience mentoring or coaching other
        product managers Your own portfolio, and opinions about it If you meet
        most of this and not all of it, apply. We'd rather read your application
        than guess. Work authorisation This role requires an existing right to
        work in Germany. We're not able to sponsor visas or support relocation
        for this position, so we can only consider candidates who already hold
        German or EU work authorisation, or who can obtain it independently.
        We'd rather tell you now than after four conversations. What the first
        six months look like Month 1: you know the data model, the aggregation
        layer and its technology behind it. What our analytics do and don't
        cover, and understand how AI is already being used and where it. You've
        written down the three things you think are most wrong with the product
        today Months 2 to 3: a written, agreed area strategy with a prioritised
        roadmap, a primary metric with a baseline, and, clear metrics that you
        will be monitoring and optimizing along the way Months 3 to 4: the first
        thing you scoped is live to a user segment, with a read on the primary
        metric, and with quality measurement behind it if it involves generated
        output Months 5 to 6: two or three shipped iterations with measured
        results, including the ones that didn't work, a quality bar the team
        applies without you in the room, and at least one junior product manager
        who's visibly better at their job because of you You won't be measured
        on shipping volume. You'll be measured on whether your area got
        measurably more useful and more trustworthy. Why join getquin? Why join
        getquin? We're a fast-growing B2C fintech, and here, your work has real
        impact. From day one, you'll take ownership of your domain, ship
        features end-to-end, and help shape the direction of a product used
