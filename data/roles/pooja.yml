        ·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Support and evaluate product
        progress at each stage of the software development process
        ·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Perform any other special tasks
        that are deemed appropriate for this role as assigned by the
        manager/supervisor
