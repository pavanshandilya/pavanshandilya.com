      description: "&lt;div
        class=&quot;content-intro&quot;&gt;&lt;h4&gt;&lt;strong&gt;Who we
        are&amp;nbsp;&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;We simplify wealth
        creation. Founded in 2014 in Vienna, Austria by Eric Demuth, Paul
        Klanschek and Christian Trummer, we’re here to help people trust
        themselves enough to build their financial freedom — for now and the
        future. Our user-friendly, trade-everything platform empowers both
        first-time investors and seasoned experts to invest in the
        cryptocurrencies, crypto indices, stocks*, precious metals and
        commodities* they want — with any sized budget, 24/7. Our global team
        works across different cultures and time zones, bringing our products to
        more than 7 million customers, making us one of Europe’s safest and most
        secure platforms that powers modern investing.&lt;/p&gt;
        &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;Headquartered in Austria but
        operating across Europe, our products are built by fast-moving,
        talented, “roll-up-your-sleeves-and-make-it-happen” kind of people. It’s
        these diverse perspectives and innovative minds operating as ONE TEAM
        that keep Bitpanda at the cutting edge of our industry. So if you’re
        someone who thinks big, moves fast and wants to make an impact right
        from day one, then get ready to join our industry-changing team. Let’s
        go!&lt;/p&gt;
        &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;/div&gt;&lt;h4&gt;&lt;strong&gt;Your
        mission&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;Bitpanda serves millions of
        investors across Europe, and we&#39;re bringing regulated finance
        onchain with Vision Chain, our own OP Stack L2 blockchain. We are
        building the premier ecosystem for European financial institutions to
        issue and distribute euro-denominated tokenized assets. We&#39;re hiring
        a Lead Technical Product Manager to own Vision Chain as a product: the
        foundation that Bitpanda&#39;s onchain products run on.&lt;/p&gt;
        &lt;p&gt;You&#39;ll own how the chain works and evolves, covering topics
        spanning proof systems, core protocol modifications, selecting the
        infrastructure providers, and more. You&#39;ll design and implement
        compliance, identity and privacy solutions into and on the chain, to
        satisfy the requirements of both financial institutions and developers.
        You&#39;ll work on this in collaboration with both internal and external
        product and engineering teams, as well as Bitpanda&#39;s Compliance,
        Legal and Data Protection teams, as an individual contributor reporting
        to the Head of Web3 Product within a small, senior team.&lt;/p&gt;
        &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What you’ll
        do&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Own Vision
        Chain at the infrastructure level, managing configuration choices (fee
        mechanism, block building logic, etc.), and modifications to the OP
        Stack, in collaboration with the OP Labs team.&lt;/li&gt;
        &lt;li&gt;Manage infrastructure partnerships, owning the technical
        relationship with providers (RPC nodes, indexing, oracles,
        etc.).&amp;nbsp;&lt;/li&gt; &lt;li&gt;Collaborate with Compliance and
        Legal to implement regulatorily-compliant onchain transaction screening,
        identity, and privacy solutions.&lt;/li&gt; &lt;li&gt;Run reliability,
        incidents and cost, and own developer documentation and partner
        technical onboarding until a developer relations lead joins.&lt;/li&gt;
        &lt;li&gt;Coordinate with the other Vision Web3 product leads to ensure
        the chain’s technical roadmap supports the product roadmap being built
        on top of it.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Who you
        are&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;6+ years of
        product or engineering experience, with 3+ years focused on blockchain
        infrastructure (e.g., L1/L2, rollup-as-a-service, node infrastructure
        provider, account abstraction, or an exchange protocol team).&lt;/li&gt;
        &lt;li&gt;Deep understanding of EVM rollup mechanics, including
        sequencing, fees, proofs, withdrawals, bridges, upgrade keys, and
        account abstraction.&lt;/li&gt; &lt;li&gt;Proven ability to translate
        complex business and regulatory needs into precise technical
        requirements and drive them to delivery through engineering teams and
        external partners without direct management.&lt;/li&gt;
        &lt;li&gt;Experience partnering with Compliance, Legal, and Data
        Protection teams, possessing working knowledge of the EU crypto
        regulatory landscape (MiCA, DORA, AML/CFT, sanctions
        screening).&lt;/li&gt; &lt;li&gt;Exceptional written and spoken English
        communication skills for internal teams, leadership, and external
        partners.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;** This position
        is available in all of our Hubs.&lt;/strong&gt;&lt;/p&gt;&lt;div
