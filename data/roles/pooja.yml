        data-contrast=&quot;none&quot;&gt;&lt;strong&gt;Affinidi&amp;nbsp;&lt;/\
        strong&gt;is a technology company dedicated to changing data ownership
        for good. We empower businesses and individuals with control and
        ownership of their data, with a comprehensive approach to managing their
        holistic identity – accounting for all aspects of their digital
        footprint while ensuring privacy and security. &lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;&lt;span data-contrast=&quot;none&quot;&gt;Affinidi’s
        technology enables users to benefit from decentralised digital identity
        solutions. We believe that everyone has the right to own and control
        their data, and we are committed to creating a trusted digital
        credentials ecosystem that empowers businesses and individuals to
        securely exchange data and services across borders and
        industries.&lt;/span&gt;&lt;/p&gt; &lt;hr&gt;
