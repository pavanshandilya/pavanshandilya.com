        experienced Growth Product Manager who owns the why and what, works
        closely with Engineering and Design on the how, collaborates strongly
        with stakeholders, and leads through product discovery, strategy, and
        execution. This is also not a growth marketing role . You will not run
        campaigns or acquisition channels. Growth in this role is driven
        primarily through product-led changes to the user experience ,
        experimentation, and system-level improvements. 💔 Before you continue
        reading: Please note that this role requires fluent English (German is a
        plus) . If you’re not fully comfortable working in English , this
        position may unfortunately not be the right fit, as both are essential
        for the role. Who is Digistore24? At Digistore24, we’re building a
        best-in-class ecommerce platform used by tens of thousands of
        entrepreneurs and SMEs to sell digital products, courses, memberships,
        and more. As a Senior Growth Product Manager, your mission is to drive
        product-led growth across the Digistore24 platform, spanning activation,
        onboarding, engagement, retention, and monetization. You will own growth
        problems end to end: understanding user behavior, identifying
        opportunities, running experiments, shipping improvements, and measuring
        impact on activation, engagement, retention, and long-term value.
        Success in this role is defined by measurable improvement in growth
        metrics, not roadmap output. Your new dream job As a Product Manager at
        Digistore24, you'll join one of our cross-functional product teams and
        take ownership of a specific product domain. Your mission is to deeply
        understand our users, uncover valuable opportunities, and lead your team
        to deliver meaningful outcomes, all in alignment with the company’s
        broader product strategy and business goals. Here’s what you’ll do: Own
        growth outcomes across the user lifecycle Take ownership of one or more
        core growth metrics across the user lifecycle, such as activation,
        engagement, retention, or monetization. Identify friction, drop-offs,
        and unmet user needs using data and user insights. Translate insights
        into testable growth bets with clear success criteria. Define growth
        models &amp; loops Build and evolve growth models that connect product
        inputs to business outcomes. Identify and improve growth loops beyond
        linear funnels. Make prioritization and tradeoffs explicit, aligning
        initiatives with company OKRs and strategic goals. Lead experimentation
        Design and run experiments (A/B tests, prototypes, staged rollouts) with
        Design and Engineering. Apply sound experimentation practices, including
        hypothesis definition, success metrics, and basic statistical reasoning.
        Use learnings to iterate, double down, or stop initiatives decisively.
        Be hands-on with product analytics Work daily with product analytics to
        guide decisions and uncover opportunities. Use tools like PostHog
        (strong plus), Amplitude, Mixpanel, or Pendo to analyze user behavior
        and experiment results. Turn data into clear insights that inform
        decisions. Drive end-to-end execution Lead initiatives from problem
        framing through discovery, delivery, and measurement. Collaborate
        closely with Engineering and Design on scope, tradeoffs, and sequencing.
        Ensure learnings are documented and reused. Collaborate across the
        company Work as a thought partner with stakeholders across Marketing,
        Support, Analytics, and Leadership. Align teams around shared goals and
        outcomes. Communicate clearly and proactively. Your benefits at
        Digistore24 At Digistore24, we believe that great people do their best
        work when given real autonomy, clarity of purpose, and a supportive
        environment. Here’s what you can expect when you join us: Work from
        anywhere, on your schedule : Whether from home or your favorite
        coworking space (3 days a week): as long as you have a stable internet
        connection, your work location and hours are flexible (MO-FR).
        Continuous learning: Access to regular training opportunities and
        development resources to grow your skills and career. Stable,
        founder-led business: We’re a profitable German high-tech company,
        funded by our successful product, not outside investors. Empowered,
        outcome-focused teams : Join a product culture built on autonomy,
        ownership, and direct feedback, not micromanagement. Tools that fit your
        workflow : Choose the hardware that suits you best, whether MacBook Pro
        or ThinkPad. International, collaborative culture : Work with an
        international team of thoughtful, driven people Real human connection :
        Enjoy spectacular in-person team events across Europe to build
        relationships beyond screens. Ownership from day one : You’ll be trusted
        to make decisions and drive impact right from the start. No dress code.
        No egos. Just teams solving problems together."
