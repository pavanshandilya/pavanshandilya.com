      url: https://www.arbeitnow.com/jobs/companies/wolt/product-manager-courier-delivery-experience-berlin-151062
      updated_at: 1790780140
      description: "&lt;div class=&quot;content-intro&quot;&gt;&lt;h2&gt;&lt;span
        data-sheets-root=&quot;1&quot;&gt;About Wolt&lt;/span&gt;&lt;/h2&gt;
        &lt;p&gt;&lt;span data-sheets-root=&quot;1&quot;&gt;At Wolt, we create
        technology that brings joy, simplicity and earnings to the neighborhoods
        of the world. In 2014 we started with delivery of restaurant food. Now
        we’re building the delivery of (almost) everything and you’ll find us in
        over 500 cities in 30 countries around the world. In 2022 we joined
        forces with DoorDash and together we keep on dreaming big and expanding
        across the globe.&lt;br&gt;&lt;br&gt;Working at Wolt isn’t always easy,
        but it’s definitely exciting. Here you’ll learn more, build more, and
        ship more than in most other companies. You’ll be challenged a lot, but
        also have a lot of fun on the way. So, if you’re a self-starter with
        drive and entrepreneurial spirit, this could be the ride of your
        life.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;p&gt;We seek a Product
        Manager to join our Courier and Delivery Experience (CDX) team. This
        role will focus on ensuring world-class courier and consumer delivery
        experiences while continually evolving the delivery process with a
        future-oriented mindset. The Courier and Delivery Experience team owns
        the experiences that elevate every Wolt delivery, from the moment a
        courier opens the app to every order they accept, all the way to
        dropping an order off at the customer’s doorstep. The team sits at the
        intersection of a multi-sided marketplace product, real-world
        operations, and safety, and the work directly moves how reliable Wolt
        feels to consumers and how satisfied our couriers are when
        delivering.&lt;/p&gt; &lt;p&gt;You will play a crucial role in shaping
        the courier experience, ensuring that our couriers feel valued and
        supported while enhancing the efficiency of deliveries. By blending
        operational expertise with a deep understanding of courier needs, you
        will improve the user journey from onboarding couriers to completing
        deliveries. From designing new features that boost courier satisfaction
        to refining delivery processes, your work will contribute to key metrics
        across courier engagement, performance, and satisfaction. You will also
        be influential in shaping the evolution of the live delivery experience
        for our courier partners, the merchant courier interaction at pickup and
        the consumer courier interaction at the doorstep via the Courier app
        surfaces.&amp;nbsp;&lt;/p&gt; &lt;p&gt;The ideal candidate will have an
        exceptional track record in product management, with proven success in
        working with cross-functional teams across engineering, design, product,
        and operations. You will define the vision and roadmap for courier and
        delivery experiences across multiple projects. Working in partnership
        with business stakeholders, you will also collaborate on cross-team
        initiatives, contributing to the broader business strategy while
        ensuring a deep understanding of the courier experience.&lt;/p&gt;
        &lt;p&gt;Join us in shaping the future of delivery, where every delivery
        is an opportunity for delight and loyalty.&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Our humble
        expectations&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;You could come to this
        role from various backgrounds, but ideally, you bring:&lt;/p&gt;
        &lt;ul&gt; &lt;li&gt;Several years of experience in product management,
        specializing in consumer-facing products&lt;/li&gt; &lt;li&gt;Expertise
        in developing user-centric products, with the ability to address complex
        user experience-related challenges.&lt;/li&gt; &lt;li&gt;Demonstrated
        expertise in supporting cross-functional teams and fostering operational
        excellence in fast-paced, high-demand industries.&lt;/li&gt;
        &lt;li&gt;Proven track record in building products influencing
        cross-functional teams, including engineering, data, design, and
        operations.&lt;/li&gt; &lt;li&gt;High ownership and collaborative
        capabilities, making thoughtful decisions, and focusing on product
