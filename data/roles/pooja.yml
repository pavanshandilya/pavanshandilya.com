        data-start=&quot;1047&quot; data-end=&quot;1198&quot;&gt;Lead the
        delivery of a best-in-class reporting suite, including a redesigned
        summary page, filtering, advanced visualisations, and AI-driven
        insights&lt;/li&gt; &lt;li data-start=&quot;1201&quot;
        data-end=&quot;1307&quot;&gt;Define and ship the MVP for our next-gen
        Narrative Intelligence and “AI Copilot for Insights”
        experience&lt;/li&gt; &lt;li data-start=&quot;1310&quot;
        data-end=&quot;1415&quot;&gt;Partner with Data Science to land
        foundational Copilot capabilities that scale to millions of
