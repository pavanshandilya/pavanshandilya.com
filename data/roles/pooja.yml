        data-ccp-props=&quot;{}&quot;&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;
        &lt;ul&gt; &lt;li&gt;&lt;strong&gt;&lt;em&gt;&lt;span
        data-contrast=&quot;auto&quot;&gt;Shape and deliver
