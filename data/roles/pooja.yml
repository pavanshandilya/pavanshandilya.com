        and drive real change. Constantly grow as you work hard for a mission
        that matters at a company where you
        matter.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Location: Amsterdam,
        Netherlands OR Germany -
        Remote&lt;/strong&gt;&lt;br&gt;&lt;strong&gt;Travel: &lt;/strong&gt;up
        to 40% within DACH, Benelux, Nordics (an other European countries as
        needed)&lt;br&gt;&lt;strong&gt;Reports to:&lt;/strong&gt; Director,
        Professional Services, EMEA&lt;br&gt;&amp;nbsp;&lt;/p&gt;
        &lt;h2&gt;&lt;strong&gt;Your Impact&lt;/strong&gt;&lt;/h2&gt;
        &lt;p&gt;As a Senior Technical Project Manager, you’ll lead
        high-visibility projects, directly contributing to the development and
        implementation of solutions that truly make a difference. In this role,
        you’ll tackle complex challenges, working with some of the most advanced
        technologies in the industry, including cloud and on-prem platforms, and
        mission-critical systems. You’ll have the opportunity to collaborate
        with brilliant minds across professional services, sales, engineering,
        product, and customer teams to deliver solutions that save lives and
        enhance public trust.&lt;br&gt;&lt;br&gt;At Axon, we’re driven by a
        powerful mission: to protect life, capture truth, and accelerate
        justice. We’re growing rapidly, and this is your chance to make a
        lasting impact at a company where innovation meets purpose.&lt;/p&gt;
        &lt;h2&gt;&lt;br&gt;&lt;strong&gt;What You’ll
        Do&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;&lt;br&gt;&lt;strong&gt;Program
        &amp;amp; Project Management&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;
        &lt;li&gt;Manage all aspects of complex enterprise-grade product
        deployments&lt;/li&gt; &lt;li&gt;Oversee project milestones, resource
        planning, scope, timeline, and risk management.&lt;/li&gt;
        &lt;li&gt;Manage cross-functional stakeholders to ensure alignment,
        transparency, and on-time delivery.&lt;/li&gt; &lt;li&gt;Ensures project
        milestones and deadlines are met and associated documentation supports
        customer acceptance for purposes of revenue recognition&lt;/li&gt;
        &lt;li&gt;Support pre-sales scoping and post-sales implementation
        handoff.&lt;/li&gt; &lt;li&gt;Operates with a sense of urgency,
        accuracy, and detail-orientation, while maintaining consistent lines of
        communication with all teams involved in each project&lt;/li&gt;
        &lt;li&gt;Maintain customer confidence, especially in high-pressure
        situations&lt;/li&gt; &lt;li&gt;Remain organized and focused on removing
        obstacles through creativity and adaptation to rapidly changing
        circumstances&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Partner
        Management&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Own the
        relationship with 3rd party integrator and the client throughout the
        length of the contract&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&lt;strong&gt;Stakeholder
        Collaboration&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Work closely
        with Professional Services, Product Managers, and Engineers to align
        program execution with business goals.&lt;/li&gt; &lt;li&gt;Act as a
        liaison between customers and internal teams to manage change requests,
        solution feasibility, and roadmap alignment.&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&lt;strong&gt;Process Improvement&lt;/strong&gt;&lt;/p&gt;
        &lt;ul&gt; &lt;li&gt;Identify process inefficiencies and propose
        improvements to increase deployment speed, quality, and customer
        satisfaction.&lt;/li&gt; &lt;li&gt;Contribute to internal SOPs,
        implementation playbooks, and best practices.&lt;/li&gt; &lt;/ul&gt;
        &lt;h2&gt;&lt;strong&gt;What You Bring&lt;/strong&gt;&lt;/h2&gt;
        &lt;ul&gt; &lt;li&gt;Fluency in both German and English&lt;/li&gt;
        &lt;li&gt;European citizenship is required in order to work with
        sensitive Government data, willing to undergo a security
        check&lt;/li&gt; &lt;li&gt;5+ years of experience leading and delivering
        highly complex programs, with demonstrated success in technical program
        management.&lt;/li&gt; &lt;li&gt;Proven track record of managing
        enterprise-level software deployments, infrastructure projects, or
        large-scale enterprise application programs.&lt;/li&gt; &lt;li&gt;Deep
        expertise in delivering complex projects involving cross-functional
        teams, including sales, engineering, and product.&lt;/li&gt;
        &lt;li&gt;Mastery of program/project management tools and methodologies
        to track, report, and deliver on objectives. (PMP, PRINCE2,
        SCRUM)&lt;/li&gt; &lt;li&gt;Experience gathering requirements,
        optimizing workflows, and facilitating change management within
        teams.&lt;/li&gt; &lt;li&gt;Familiarity with software configurations and
        coding experience (particularly JSON) preferred.&lt;/li&gt;
        &lt;li&gt;Advanced communication and presentation skills, with the
        ability to distill technical concepts for diverse audiences.&lt;/li&gt;
        &lt;li&gt;Proficiency in guiding client and internal teams through
        ambiguity, driving alignment, and executing on shared goals.&lt;/li&gt;
