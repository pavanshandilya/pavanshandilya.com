        data-contrast=&quot;auto&quot;&gt;Drive focused, outcome-oriented
        delivery:&lt;/span&gt;&lt;/em&gt;&lt;/strong&gt;&lt;em&gt;
        &lt;/em&gt;&lt;span data-contrast=&quot;auto&quot;&gt;Balance user
        needs, market context, and execution speed while focusing on getting
