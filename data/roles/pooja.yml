        (serviceability, modularity and product configuration,
        manufacturability, and cost targets), and turn them into clear,
        prioritized, solution-neutral requirements. Establish our requirements
        engineering tooling and workflow: select and set up how we capture,
        trace, and maintain requirements, from customer need through
        specification to verification, including change control across releases.
        This is a foundational task in your first months. Own and maintain the
        QDm.1 roadmap: propose what gets built and in what order, make the
        trade-offs explicit, and align decisions with the management team. Work
        with the applications team on customer interactions and evaluations with
        fabs, IDMs, OSATs and failure analysis labs, and translate what you
        learn into requirements. For each requirement, define acceptance
        criteria from the customer's point of view so it is clear and testable
        when the need is met, and link them to customer evaluation and
        qualification plans. Align with the Product Development department on
        scope and timing, and hand solution-neutral requirements into
        engineering: state the need and the why, and leave the how to the
        disciplines. Support go-to-market: give input on positioning, pricing,
        launch readiness, and documentation scope together with the
        applications, operations, and product development teams. What is
        expected of you Several years in product management for complex hardware
        or capital equipment, ideally in semiconductor, metrology, or a
        comparable deep-tech environment. A track record of writing clear
        product requirements that engineering can actually build from. The
        ability to talk to both customers and engineers and to translate between
        them. Enough technical depth to hold a credible conversation with the
        people designing the product, across mechanics, optics, electronics/RF,
        and software. Structured prioritization: you make trade-offs explicit
        and back them with reasoning. We hire for demonstrated skill rather than
        a specific degree; a technical or scientific background is typical. The
        working language is English. Additional experience we value:
        Semiconductor industry knowledge (fabs, IDMs, OSATs, inspection,
        metrology, or failure analysis). Familiarity with SEMI standards and fab
        tool integration (for example, S2/S8, E10, SECS/GEM). Experience
        selecting or setting up a requirements management tool (for example,
        Jama, Polarion, or CodeBeamer). A working understanding of quantum
        sensing, optics, or precision instrumentation. Our benefits Mission: At
        QD, we’re driven by more than just building great products - we aim to
        make a lasting difference. Joining us means contributing to meaningful
        work that goes beyond business as usual. Impact &amp; growth: This is an
        exciting stage of our journey, and your voice matters. You’ll have the
        chance to shape our culture, influence key decisions, and grow alongside
        a company that’s scaling fast. Health &amp; fitness: With a
        company-sponsored Wellpass membership, you’ll have access to countless
        gyms, classes, and wellness offers across Germany to stay healthy and
        active. Team &amp; culture: We believe the best ideas come when we
        connect outside the office. From regular off-sites to team events,
