      description: "&lt;p&gt;&lt;strong&gt;At Superchat, we&#39;re rebuilding how
        businesses talk to their customers. AI is becoming the engine of that
        communication. Integrations are what give that engine teeth: the data,
        the tools, the systems that turn a clever agent into one that actually
        closes loops.&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Founded in 2020,
        Superchat has become the platform of choice for &lt;strong&gt;10,000+
        businesses worldwide&lt;/strong&gt;, from globally recognized brands
        like Allianz, Auto1, Enpal, Danone, and GASAG to the small businesses,
        dental practices, and one-person startups that need to look bigger than
        they are. Today, &lt;strong&gt;millions of messages flow through
        Superchat every single day&lt;/strong&gt;.&lt;/p&gt; &lt;p&gt;We started
        as a unified inbox: one place for every channel a customer might pick,
        WhatsApp, email, SMS, Instagram. Then ChatGPT happened, and the second
        chapter began: AI agents that respond across chat, email, and voice at
        the quality of the best human teams.&lt;/p&gt; &lt;p&gt;We&#39;re
        &lt;strong&gt;100 people&lt;/strong&gt;,
        &lt;strong&gt;profitable&lt;/strong&gt;, and have raised
        &lt;strong&gt;€18M in funding&lt;/strong&gt; (last round 4.5 years ago,
        we&#39;ve been growing on our own money since). Headquartered in
        Berlin.&lt;/p&gt; &lt;p&gt;We&#39;re looking for a Product Manager to
        join our Integrations team.&lt;/p&gt; &lt;p&gt;In this role, you&#39;ll
        own the surface that decides whether our AI agents are clever demos or
        systems that actually do work. CRM sync, appointment bookings, call
        transfers, custom workflows: every action our agents take in the real
        world runs through your team. Plus our public API, webhooks, and the
        developer experience that lets partners build on top of us. If
        you&#39;re excited to design APIs, ship agent tooling, and own a surface
        that gets more strategic every quarter, this might be a great
        fit.&lt;/p&gt; &lt;p&gt;We&#39;re reshaping our product function around
        three pillars, AI, Integrations, and Core, with a PM in each, operating
        directly with our founder and CPO Mika. This role is for
        Integrations.&lt;/p&gt; &lt;h4&gt;Learn how product is built from the
        inside, working side by side with our CPO.&lt;/h4&gt;
        &lt;p&gt;&lt;em&gt;As our Associate Product Manager, you&#39;ll work
        directly with our CPO as a force multiplier for the product team.
        You&#39;ll take on high-impact work across customer research, product
        data, product marketing and adoption - topics that span the whole
        product org rather than a single product
        area.&amp;nbsp;&lt;/em&gt;&lt;/p&gt; &lt;h4&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;Who We
        Want&amp;nbsp;&lt;/span&gt;&lt;/h4&gt; &lt;p&gt;&lt;strong&gt;Hungry
        learner&lt;br&gt;&lt;/strong&gt;You&#39;re eager to learn fast, actively
        seek feedback and turn it into visible progress within weeks, not
        months.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Structured
        self-starter&lt;br&gt;&lt;/strong&gt;You&#39;re highly organized, bring
        order to messy situations and get things done without step-by-step
        guidance.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Analytical
        thinker&lt;br&gt;&lt;/strong&gt;You&#39;re comfortable with data and can
        pull numbers from spreadsheets or analytics tools and turn them into
        clear insights.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Customer-curious&lt;br&gt;&lt;/strong&gt;You
        enjoy talking to users, ask good follow-up questions and turn interviews
        into actionable takeaways.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Clear
        communicator&lt;br&gt;&lt;/strong&gt;You write crisply, build clean
        slides and feel comfortable presenting to customers, e.g. in
        webinars.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Scrappy
        generalist&lt;br&gt;&lt;/strong&gt;You&#39;re happy to switch between
        product marketing, data, research and ops, and no task is &quot;beneath
        you&quot;.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;AI-native&lt;br&gt;&lt;/strong&gt;You use AI
        tools daily to work faster and better - from research and data analysis
        to drafting content and slides - and you&#39;re always experimenting
        with new ones.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Has
        taste&lt;br&gt;&lt;/strong&gt;You have a strong sense for what good
        looks like in product, design and writing, and you notice when something
        feels off, even if it&#39;s &quot;technically fine&quot;.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Language&lt;br&gt;&lt;/strong&gt;You&#39;re
        fluent in English, written and spoken.&lt;/p&gt; &lt;h4&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;Who We Don&#39;t
        Want&amp;nbsp;&lt;/span&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;You only
        want &quot;pure PM&quot; work like roadmaps and specs and aren&#39;t
        interested in marketing or customer-facing tasks&lt;/li&gt;
        &lt;li&gt;You need a lot of structure and clear processes to be
        productive&lt;/li&gt; &lt;li&gt;You struggle to communicate clearly in
        English, in writing or in front of an audience&lt;/li&gt; &lt;li&gt;You
        get defensive when receiving feedback&lt;/li&gt; &lt;li&gt;You see this
        mainly as a title step rather than a chance to learn and get
        hands-on&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;&lt;strong&gt;Your Day
        to Day&amp;nbsp;&lt;br&gt;&lt;br&gt;&lt;/strong&gt;Strategic Projects
        (~25%)&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Work directly with
        our CPO on the topics that matter most right now&lt;/li&gt;
        &lt;li&gt;Prepare leadership meetings, drive decisions forward and make
        sure priorities turn into results&lt;/li&gt; &lt;/ul&gt;
        &lt;p&gt;&lt;span style=&quot;text-decoration:
        underline;&quot;&gt;Product Marketing &amp;amp; Launches
        (~35%)&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Plan and run
        initiatives that bring our product to customers: webinars, product
        updates, customer events, newsletters and educational content&lt;/li&gt;
        &lt;li&gt;Prepare and launch new features end-to-end together with
        Product, Engineering and Marketing&lt;/li&gt; &lt;li&gt;Build sharp
        slides and reports for customers and leadership&amp;nbsp;&lt;/li&gt;
        &lt;/ul&gt; &lt;p
        data-lfile-container=&quot;df4b3f91-b87e-448a-89b1-dc2439ff8611&quot;
        data-pm-slice=&quot;1 3 []&quot;&gt;&lt;span
        style=&quot;text-decoration: underline;&quot;&gt;Customer Research
