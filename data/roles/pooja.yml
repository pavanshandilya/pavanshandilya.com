        forward-thinking individuals to join our team. We are currently looking
        to add a Product Manager to join our new Munich, Germany office,
        specifically within the Product Engineering Group. This role will focus
        on building, enhancing, and managing our technical products, working
        with our team to define and deliver solutions that support our mission
        of seamless, out-of-the-box space communication systems.&nbsp; &nbsp; As
        a Product Manager at CesiumAstro, you will be at the forefront of
        managing the entire product lifecycle, from initial concept through to
        customer integration and support for the European market. You will
        collaborate with cross-functional teams including engineering, sales,
        and marketing to develop product strategies that align with our customer
        needs and business objectives. This role requires a blend of technical
        knowledge and business acumen, enabling you to drive product decisions
        and ensure customer success in highly technical environments.&nbsp; KEY
        RESPONSIBILITIES Work closely with senior leadership and engineering
        teams to define product strategies, ensuring alignment with
        CesiumAstro’s business objectives and customer needs.&nbsp;&nbsp;
        Contribute to the development of product roadmaps, prioritizing features
        and enhancements based on market trends, customer feedback, and
        technological advancements.&nbsp; Act as a liaison between product
        engineering, business development/sales, marketing, and customer support
        teams to deliver products that meet or exceed customer
        expectations.&nbsp;&nbsp; Facilitate clear communication and
        collaboration across teams to drive product development cycles.&nbsp;
        Engage directly with customers to understand their technical needs,
        challenges, and goals. Leverage this insight to inform product decisions
        and ensure that solutions meet customer expectations.&nbsp; Oversee the
        launch of new products and features, working with the marketing team to
        drive product adoption and customer satisfaction.&nbsp;&nbsp; Provide
        technical leadership and customer-facing support as needed to ensure
        smooth product integrations.&nbsp; Lead the identification and
        implementation of continuous improvements for products and processes,
        ensuring that CesiumAstro’s products remain industry-leading and meet
        the evolving demands of our customers.&nbsp; Create and maintain
        high-quality documentation, including user manuals, application notes,
        and white papers.&nbsp;&nbsp; Ensure that customer-facing teams are
        well-equipped with the knowledge to support product offerings.&nbsp; JOB
        REQUIREMENTS AND MINIMUM QUALIFICATIONS Bachelor’s degree (or higher) in
        a relevant technical field such as Electrical Engineering, Computer
        Engineering, Physics, Computer Science, or related discipline.&nbsp; At
        least 7 years of experience in the design of communication electronics,
        technical product development, product management, or application
        support.&nbsp; In-depth understanding of RF electronics, communication
        systems, and associated technologies such as digital systems, embedded
        software, FPGAs, and power electronics.&nbsp; Proven experience working
        with technical customers, developing strong relationships, and
        translating their needs into actionable product requirements.&nbsp;
        Working knowledge of programming languages such as C/C++ or
        Python.&nbsp; Exceptional troubleshooting skills and ability to
        understand, diagnose, and solve complex product issues across hardware
        and software domains.&nbsp; Excellent verbal and written communication
        skills, with the ability to clearly articulate technical concepts to
        both technical and non-technical audiences.&nbsp; Experience with
        high-reliability electronics and systems, particularly in the aerospace
        industry.&nbsp; Familiarity with small satellite systems and their
        unique requirements&nbsp; PREFERRED EXPERIENCE Background in technical
        sales, marketing, or customer solution development is a plus. Experience
        in crafting technical solutions for customer proposals, demonstrating an
        understanding of customer requirements and aligning product capabilities
        accordingly. CesiumAstro considers several factors when extending an
        offer, including but not limited to, the role and associated
        responsibilities, a candidate’s work experience, education/training, and
        key skills. Please note: CesiumAstro does not accept unsolicited resumes
        from contract agencies or search firms. Any unsolicited resumes
        submitted to our website or to CesiumAstro team members not through our
        approved vendor list or Talent Acquisition will be considered property
        of CesiumAstro, and we will not be obligated to pay any referral fees.
        Find more English Speaking Jobs in Germany on Arbeitnow"
