        variables with granular details Requirements What You Bring At least 6+
        years of experience in Product Management, with a track record of owning
        a product area or capability end to end, from discovery through launch
        and iteration Demonstrated ability to work independently and proactively
        – highly organized, self-driven, and comfortable making progress without
        close direction Clear, structured communicator, able to explain context,
        decisions, and trade-offs to stakeholders at all levels Strong
        experience partnering with Design and Engineering throughout the product
        development lifecycle Comfortable introducing and shaping ‘best
        practices’ while balancing with the current organizational context
        AI-forward mindset, ruthless prioritization and consistent, clear verbal
