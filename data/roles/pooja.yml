      description: "About the Role at RobCo RobCo is building the category of
        Autonomous Industrial Robotics and we're doing it fast. We believe that
        automating the ordinary frees humans to do the extraordinary, and we're
        building the end-to-end robotics infrastructure to make that possible -
        hardware, software, and AI in one stack that just works. At RobCo, we
        automate the ordinary, so humans can do the extraordinary. To achieve
        this, we are looking for an ambitious Technical Program Manager (m/f/d)
        to help us establish RobCo as leading provider of automation solutions.
        As a Technical Program Manager (TPM) at RobCo, you take responsibility
        for overseeing and managing multiple complex robot deployment projects
        simultaneously. You actively contribute to shaping the structures and
        processes that drive our projects to success. Your goal is to ensure
        that all your projects are delivered efficiently, on time, and in line
        with the highest quality standards. Your Responsibilities End-to-End
        Program Ownership: You are responsible for multiple strategically
        relevant robotics deployment programs simultaneously – from pre-sales
        alignment and technical solution design through implementation to
        successful handover into operational business. Building Scalable
        Structures: You develop governance frameworks, reporting standards, and
        delivery processes that enable fast, high-quality growth. In doing so,
        you establish best practices for future programs. Strategic Stakeholder
        Management: You act as a sparring partner to C-level executives,
        customers, and internal leadership teams. You create transparency
        regarding progress, risks, dependencies, and business impact, and make
        data-driven decisions. Technical and Commercial Steering: You maintain
        oversight of both technical integration details and commercial aspects
        such as budgets, margins, resource planning, and business cases,
        ensuring projects are delivered successfully from a financial
        perspective. Risk and Escalation Management: You identify systemic risks
        at an early stage, initiate preventive measures, and manage escalations
        in a structured and solution-oriented manner. Innovation and Continuous
        Improvement: You analyze recurring patterns, identify optimization
        potential, and actively drive automation and standardization of our
        deployment processes. We're looking for someone who has: Excellent
        German and English language skills, both are critical. Completed
        technical university degree (e.g., Mechanical Engineering, Electrical
        Engineering, Computer Science) or equivalent qualification with
        significant technical professional experience 5+ years of experience
        managing complex technical programs, ideally in robotics, automation,
        industrial tech, or hardware-software integration Proven experience in
        building scalable project or deployment structures in a high-growth
        environment Strong systems understanding of mechatronic or
        cyber-physical systems Ability to abstract technical details to an
        executive level and translate them into business impact Confident
        presence when interacting with customers, management, and external
        partners Experience with budget responsibility, resource planning, and
        commercial management Structured, data-driven working style combined
        with pragmatic execution skills Why join RobCo? Develop modular,
        software-defined robotics solutions with us that set new standards in
        automation. Help us build robots equipped with state-of-the-art AI that
        perceive their environment, analyze data, and make intelligent decisions
        in real time. As part of a very dynamic and fast-growing scale-up, you
        will take on responsibility from day one, drive your own projects, and
        see the direct impact of your work. Flat hierarchies, open
        communication, and regular 360° feedback enable fast decisions and
        support your professional and personal development. Work out across
        Germany in over 7,200 studios with our subsidized Wellpass membership.
        Flexible working hours, a modern office, and—depending on the role—the
        option to work from home. Regular team events—from relaxed beer &amp;
        pizza nights on the rooftop terrace to shared experiences on ski trips
        or at Oktoberfest. About RobCo Founded in Munich in 2020, RobCo leads
        the transition toward fully Autonomous Industrial Robotics. Our mission
        is to deploy RobCo in every factory - solving the industrial labor
        shortage through end-to-end robotics that just works. Powered by
        Physical AI, our solutions combine a scalable modular hardware
        architecture with intelligent software that adapts to your use case,
        improves over time, and requires zero upfront investment through our
        Robotics-as-a-Service (RaaS) model. We solve our customers' most
        pressing pain points - labor shortage, cost pressure, workplace safety,
        and national reshoring - across the full spectrum of Autonomous
        Industrial Robotics. With $160M raised from investors including
        Lightspeed, Lingotto Innovation, and Sequoia, 200+ people globally, and
        2.5M+ operating hours in the field, we are deploying robots in factories
        across Europe and the United States - with our US operations
        headquartered in Austin, TX, and our RobCo Bay Area Demo Lab in San
        Francisco. Don’t meet every single requirement? If you’re excited about
        this role but your past experience doesn’t align perfectly with every
