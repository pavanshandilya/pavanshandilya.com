      description: "Grafana Labs is a remote-first, open-source powerhouse. There are
        more than 20M users of Grafana, the open source visualization tool,
        around the globe, monitoring everything from beehives to climate change
        in the Alps. The instantly recognizable dashboards have been spotted
        everywhere from a NASA launch and Minecraft HQ to Wimbledon and the Tour
        de France. Grafana Labs also helps more than 3,000 companies &#8212;
        including Bloomberg, JPMorgan Chase, and eBay &#8212; manage their
        observability strategies with the Grafana LGTM Stack, which can be run
        fully managed with Grafana Cloud or self-managed with the Grafana
        Enterprise Stack , both featuring scalable metrics ( Grafana Mimir ),
        logs ( Grafana Loki ), and traces ( Grafana Tempo ). We’re scaling fast
        and staying true to what makes us different: an open-source legacy, a
        global collaborative culture, and a passion for meaningful work. Our
        team thrives in an innovation-driven environment where transparency,
        autonomy, and trust fuel everything we do. You may not meet every
        requirement, and that’s okay. If this role excites you, we’d love you to
        raise your hand for what could be a truly career-defining opportunity.
        This is a fully remote position and we&#8217;re considering candidates
        in Germany. About Product Management: As a Product Manager at Grafana
        Labs, you&#8217;ll develop a vision and strategy for your product
        domain. You will own your product’s roadmap, collateral, and market
        research, and you will collaborate with Grafana leadership on
        fine-tuning your product’s goals. You will be the primary advocate and
        expert in your area, with a strong ability to communicate needs,
        functionality, and details effectively both to external customers and
        internal stakeholders. The teams and people you will be interacting with
        will be 100% remote and globally distributed, so strong and proactive
        communication is essential. Product Managers are the bridge that connect
        Engineering, Design, and UX to GTM. You are a facilitator who ensures
        the free flow of information across these teams and are expected to be
        technically proficient when representing our products to our customers.
        The opportunity: As a Product Manager for AI, you’ll be involved with
        everything related to our AI offerings, including helping drive the
        roadmap of our Grafana Assistant ecosystem . You’ll get to the bottom of
        what customers want and challenge us on what we should build next.
        You’ll work across Grafana’s R&amp;D and GTM orgs to deliver AI products
        and marketing messages. You will develop a deep understanding of how to
        apply AI to address customer problems in observability. And you’ll help
        shape Grafana Labs AI vision. What You’ll Be Doing: Partnering with our
        senior AI PM to define and own AI features end-to-end Working closely
        with our product marketing and sales teams to shape our AI messaging and
        support large commercial deals Understanding competitors, working with
        partners and staying on top of the broader AI market Being a hands-on
        builder: prototyping, building, and shipping AI features end-to-end with
        our engineering team Partnering with our data function to analyze large
        amounts at scale about our product, usage patterns and commercials
        Empathizing with customer problems in order to collect user needs,
        requirements, and pain points Curating and properly representing user
        feedback to Engineering, while providing evidence to support tradeoffs
        and priorities Using your deep product expertise to make decisions about
        our go-to-market strategies, pricing, packaging, licensing, and tiering
        What makes you a great fit: Excellent written and verbal communication
        Strong product sense and curiosity about AI, including demonstrated
        evidence such as AI projects, blog posts and community contributions 2
        years of product experience or equivalent experience in a related role
        with ownership of a feature or project Comfortable with basic data
        analysis (SQL, spreadsheets) and able to interpret experiment results
        Familiarity with large language models (LLMs), prompt engineering, or
        experience using open-source models Bonus Points: Experience using or
        building observability products and/or developer tools, either
        internally as an SRE or for external customer In Germany, the base
        compensation range for this role is EUR 85,670 &#8211; EUR 102,804.
        Actual compensation may vary based on level, experience, and skillset as
        assessed throughout the interview process. All of our roles include
        Restricted Stock Units (RSUs), giving every team member ownership in
        Grafana Labs&#8217; success. We believe in shared outcomes—RSUs help us
        stay aligned and invested as we scale globally. *Compensation ranges are
        country specific. If you are applying for this role from a different
        location than listed above, your recruiter will discuss your specific
        market’s defined pay range &amp; benefits at the beginning of the
        process. Why You’ll Thrive at Grafana Labs: 100% Remote, Global Culture
        &#8211; As a remote-only company, we bring together talent from around
        the world, united by a culture of collaboration and shared purpose.
        Scaling Organization – Tackle meaningful work in a high-growth,
        ever-evolving environment. Transparent Communication – Expect open
        decision-making and regular company-wide updates. Innovation-Driven –
        Autonomy and support to ship great work and try new things. Open Source
        Roots – Built on community-driven values that shape how we work.
        Empowered Teams – High trust, low ego culture that values outcomes over
        optics. Career Growth Pathways – Defined opportunities to grow and
        develop your career. Approachable Leadership – Transparent execs who are
        involved, visible, and human. Passionate People – Join a team of smart,
        supportive folks who care deeply about what they do. In-Person
        onboarding &#8211; We want you to thrive from day 1 with your fellow new
        ‘Grafanistas’ to learn all about what we do and how we do it. Balance is
        Key &#8211; We operate a global annual leave policy of 30 days per
        annum. 3 days of your annual leave entitlement are reserved for Grafana
        Shutdown Days to allow the team to really disconnect. *We will comply
        with local legislation where applicable. Equal Opportunity Employer: We
        will recruit, train, compensate and promote regardless of race,
        religion, color, national origin, gender, disability, age, veteran
        status, and all the other fascinating characteristics that make us
        different and unique. We believe that equality and diversity builds a
        strong organization and we’re working hard to make sure that’s the
        foundation of our organization as we grow. Grafana Labs may utilize AI
        tools in its recruitment process to assist in matching information
        provided in CVs to job postings. The recruitment team will continue to
        review inbound CVs manually to identify alignment with current openings.
        #LI-Remote For information about how your personal data is used once
